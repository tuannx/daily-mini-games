<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STEAL AN EGG! — Steal eggs. Dodge hens. Get yolked.</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0d0b1e;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:system-ui,'Arial Black',Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  #wrap{position:relative;width:100%;max-width:480px;height:100%;max-height:860px}
  canvas{display:block;width:100%;height:100%;background:#1a1030;cursor:pointer}
  .btn{position:absolute;top:8px;width:38px;height:38px;border:2px solid #ffd23e;border-radius:50%;background:rgba(13,11,30,.7);color:#fff;font-size:17px;line-height:34px;text-align:center;cursor:pointer;z-index:5}
  #pauseBtn{right:8px} #muteBtn{right:52px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="480" height="760"></canvas>
<div class="btn" id="muteBtn">♪</div>
<div class="btn" id="pauseBtn">II</div>
</div>
<script>
'use strict';
/* STEAL AN EGG! — break-and-steal egg heist.
   Drag (or WASD/arrows) to move the raccoon. Grab glowing eggs from
   the nests, carry them to your burrow (left) to score. Hens patrol
   with red vision cones: get touched while carrying and the egg
   SMASHES — yolk everywhere, one life gone.
   Twist: 12s THEY HATCH! — eggs left alone hatch into chicks that
   RUN for the exit (catch them +15, lose one = combo resets).
   25s DOG SHIFT — a guard dog joins, faster, bigger cone.
   40s GOLDEN EGG — +50, but carrying it makes EVERY guard chase you.
   Survive 60s to win. Glow = grab. Red angry = never touch.
   Trend: "Break and Steal an Egg" — #2 fastest-growing new Roblox
   game, Nov 2026 (325.3M visits, 5.6M/day, 97% liked, ggrecon.com);
   break eggs, hatch rare pets, steal them past guards to your base. */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 480, H = 760;
const GAME_URL = 'https://tuannx.github.io/daily-mini-games/games/steal-an-egg.html';
const HS_KEY = 'stealanegg-highscore';
const SKIN_KEY = 'stealanegg-golden-mask';

let AC = null, muted = false;
function beep(f, d, type, vol, slide){
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, AC.currentTime + d);
    g.gain.setValueAtTime(vol || 0.12, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + d);
  } catch(e){}
}
const sGrab  = ()=>{ beep(700,.08,'sine',.11,1050); };
const sScore = ()=>{ [880,1174,1568].forEach((f,i)=>setTimeout(()=>beep(f,.1,'sine',.11),i*55)); };
const sGold  = ()=>{ [1318,1568,2093,2637].forEach((f,i)=>setTimeout(()=>beep(f,.1,'sine',.1),i*50)); };
const sHatch = ()=>{ beep(500,.16,'square',.07,900); };
const sWarn  = ()=>{ beep(660,.14,'square',.08,440); };
const sSmash = ()=>{ [400,260,140,70].forEach((f,i)=>setTimeout(()=>beep(f,.16,'sawtooth',.12),i*90)); };
const sNear  = ()=>{ beep(1200,.08,'sine',.08,1600); };
const sBark  = ()=>{ beep(180,.12,'sawtooth',.12,90); };
const sStart = ()=>{ [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.1,'sine',.10),i*70)); };
const sWin   = ()=>{ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,.14,'sine',.11),i*90)); };

const R = (a,b)=>a+Math.random()*(b-a);
const TAU = Math.PI*2;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const dist = (ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);

let best = +(localStorage.getItem(HS_KEY) || 0);
let goldenMask = localStorage.getItem(SKIN_KEY) === '1';

// --- state ---
let state = 'title'; // title | play | pause | over | win
let score = 0, combo = 0, comboTimer = 0, timeLeft = 60, elapsed = 0;
let lives = 3;
let carrying = null; // 'egg' | 'golden' | null
let popup = null, popupT = 0;
let overLine = '', overCause = '';
let hatched = false, dogIn = false, goldenSpawned = false, goldenIn = false;
let shake = 0, flash = 0;
let nearCd = 0;

const OVER_LINES = [
  'The hen filed a complaint.',
  'Security footage is now a meme.',
  'You got yolked.',
  'The dog ate your alibi.',
  'Busted. The chicks snitched.',
  '3 strikes. The coop wins.',
];
const RANKS = [
  [0,'EGG THIEF'],[60,'YOLK SNATCHER'],[120,"HEN'S NIGHTMARE"],[200,'COOP LEGEND'],[300,'GOLDEN YOLK']
];
function rankFor(s){ let r = RANKS[0][1]; for (const [t,n] of RANKS) if (s>=t) r = n; return r; }

// --- player: raccoon thief ---
const P = { x: 90, y: H-140, r: 20, vx: 0, vy: 0, face: '😏', squash: 0, tail: 0, tx: null, ty: null };
const keys = {};

// --- burrow (home base, left) ---
const BURROW = { x: 62, y: H-110, r: 44 };

// --- nests (right side) ---
const NESTS = [
  { x: 390, y: 170 }, { x: 410, y: 360 }, { x: 385, y: 550 },
];
let eggs = [];    // {nest, x, y, kind:'egg'|'chick'|'golden', hatchT, vx, vy, wob, runT}
let parts = [];   // particles (feathers, yolk, sparkles)
let floatTxts = [];
let hay = [];     // background hay bales
let grass = [];   // background grass tufts
let yolks = [];   // yolk splats on the ground

function spawnEgg(nest, golden){
  eggs.push({ nest, x: nest.x, y: nest.y, kind: golden ? 'golden' : 'egg',
    hatchT: golden ? 999 : R(5,8), vx: 0, vy: 0, wob: R(0,TAU), runT: 0, born: elapsed });
}
function refillNests(){
  for (const n of NESTS){
    if (!eggs.some(e=>e.nest===n && e.kind!=='chick')) spawnEgg(n, false);
  }
}
function initBg(){
  hay = []; grass = [];
  for (let i=0;i<5;i++) hay.push({ x: R(30,W-30), y: R(90,H-220), r: R(26,40), rot: R(0,TAU) });
  for (let i=0;i<26;i++) grass.push({ x: R(10,W-10), y: R(90,H-40), ph: R(0,TAU), h: R(8,16) });
}
function reset(){
  score = 0; combo = 0; comboTimer = 0; timeLeft = 60; elapsed = 0;
  lives = 3; carrying = null; popup = null; popupT = 0;
  hatched = false; dogIn = false; goldenSpawned = false; goldenIn = false;
  shake = 0; flash = 0; nearCd = 0;
  P.x = 90; P.y = H-140; P.vx = 0; P.vy = 0; P.face = '😏'; P.tx = null; P.ty = null;
  eggs = []; parts = []; floatTxts = []; yolks = [];
  hens = [
    { x: 250, y: 200, r: 22, dir: 1, speed: 62, wy: 200, range: 130, chase: false, nearHit: false, wob: 0 },
    { x: 260, y: 470, r: 22, dir: -1, speed: 58, wy: 470, range: 130, chase: false, nearHit: false, wob: 0 },
  ];
  dog = { x: 240, y: 330, r: 26, dir: 1, speed: 95, wy: 330, range: 150, chase: false, nearHit: false, wob: 0, active: false };
  initBg();
  refillNests();
}
let hens = [];
let dog = null;
reset();

function popupMsg(t){ popup = t; popupT = 1.6; }
function addFloat(x, y, txt, col){ floatTxts.push({ x, y, txt, col: col || '#fff', t: 1.1 }); }
function burst(x, y, col, n, spd){
  for (let i=0;i<(n||10);i++){
    const a = R(0,TAU), s = R(30, spd || 160);
    parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 40, t: R(.4,.9), col, r: R(2,5), rot: R(0,TAU), vr: R(-6,6) });
  }
}
function yolkSplat(x, y){ yolks.push({ x, y, r: R(18,26), t: 6 }); burst(x, y, '#ffd23e', 14, 200); burst(x, y, '#fff', 6, 120); }

function deliver(){
  const mult = Math.min(combo + 1, 8);
  const pts = (carrying === 'golden' ? 50 : 10) * mult;
  score += pts; combo = Math.min(combo + 1, 8); comboTimer = 4;
  addFloat(BURROW.x, BURROW.y - 56, '+' + pts, carrying === 'golden' ? '#ffd23e' : '#7CFFB2');
  burst(BURROW.x, BURROW.y - 20, carrying === 'golden' ? '#ffd23e' : '#7CFFB2', 16, 180);
  if (carrying === 'golden'){ sGold(); popupMsg('GOLDEN YOLK!'); }
  else sScore();
  carrying = null; P.face = '😏';
  if (score >= 150 && !goldenMask){ goldenMask = true; localStorage.setItem(SKIN_KEY, '1'); popupMsg('GOLD MASK UNLOCKED!'); }
}
function loseLife(cause){
  lives--;
  combo = 0; comboTimer = 0;
  shake = 10; flash = .35;
  if (carrying){ yolkSplat(P.x, P.y + 14); carrying = null; }
  sSmash();
  P.face = '😱';
  if (lives <= 0){
    overCause = cause;
    overLine = OVER_LINES[Math.floor(Math.random()*OVER_LINES.length)];
    state = 'over';
    if (score > best){ best = score; localStorage.setItem(HS_KEY, String(best)); }
  } else {
    popupMsg(cause === 'hen' ? 'YOLKED!' : 'BITTEN!');
    P.x = 90; P.y = H-140; P.tx = null; P.ty = null;
  }
}
function endWin(){
  score += 100;
  state = 'win';
  sWin();
  if (score > best){ best = score; localStorage.setItem(HS_KEY, String(best)); }
}

// --- input ---
function toGame(e){
  const r = cv.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
}
cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  const p = toGame(e);
  if (state === 'title'){ state = 'play'; sStart(); return; }
  if (state === 'over' || state === 'win'){ reset(); state = 'play'; sStart(); return; }
  if (state !== 'play') return;
  P.tx = clamp(p.x, 24, W-24); P.ty = clamp(p.y, 90, H-24);
});
cv.addEventListener('pointermove', e=>{
  if (state !== 'play' || P.tx === null) return;
  const p = toGame(e);
  P.tx = clamp(p.x, 24, W-24); P.ty = clamp(p.y, 90, H-24);
});
cv.addEventListener('pointerup', ()=>{ P.tx = null; P.ty = null; });
window.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    if (state === 'title'){ state = 'play'; sStart(); }
    else if (state === 'over' || state === 'win'){ reset(); state = 'play'; sStart(); }
  }
  if (e.key === 'p' || e.key === 'P') togglePause();
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
function togglePause(){
  if (state === 'play') state = 'pause';
  else if (state === 'pause') state = 'play';
}
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('muteBtn').addEventListener('click', function(){
  muted = !muted; this.textContent = muted ? '✕' : '♪';
});

// --- update ---
function update(dt){
  elapsed += dt;
  timeLeft = Math.max(0, 60 - elapsed);
  if (popupT > 0) popupT -= dt;
  if (shake > 0) shake -= dt * 30;
  if (flash > 0) flash -= dt;
  if (nearCd > 0) nearCd -= dt;
  if (comboTimer > 0){ comboTimer -= dt; if (comboTimer <= 0) combo = 0; }
  for (const y of yolks) y.t -= dt;
  yolks = yolks.filter(y=>y.t > 0);
  for (const p of parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 300*dt; p.t -= dt; p.rot += p.vr*dt; }
  parts = parts.filter(p=>p.t > 0);
  for (const f of floatTxts){ f.y -= 34*dt; f.t -= dt; }
  floatTxts = floatTxts.filter(f=>f.t > 0);

  // twists
  if (!hatched && elapsed >= 12){
    hatched = true; popupMsg('THEY HATCH!'); sHatch();
    for (const e of eggs) if (e.kind === 'egg') e.hatchT = Math.min(e.hatchT, 1.2);
  }
  if (!dogIn && elapsed >= 25){
    dogIn = true; dog.active = true; popupMsg('DOG SHIFT!'); sBark();
  }
  if (!goldenSpawned && elapsed >= 40){
    goldenSpawned = true; goldenIn = true;
    eggs.push({ nest: null, x: W/2, y: 120, kind: 'golden', hatchT: 999, vx: 0, vy: 0, wob: 0, runT: 0, born: elapsed });
    popupMsg('GOLDEN EGG!'); sGold();
  }

  // player movement
  let mx = 0, my = 0;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (keys['w'] || keys['arrowup']) my -= 1;
  if (keys['s'] || keys['arrowdown']) my += 1;
  const spd = carrying === 'golden' ? 205 : 235;
  if (mx || my){
    const l = Math.hypot(mx, my);
    P.vx = mx/l*spd; P.vy = my/l*spd;
    P.tx = null; P.ty = null;
  } else if (P.tx !== null){
    const dx = P.tx - P.x, dy = P.ty - P.y, d = Math.hypot(dx, dy);
    if (d < 8){ P.vx = 0; P.vy = 0; }
    else { P.vx = dx/d*spd; P.vy = dy/d*spd; }
  } else { P.vx = 0; P.vy = 0; }
  P.x = clamp(P.x + P.vx*dt, 24, W-24);
  P.y = clamp(P.y + P.vy*dt, 90, H-24);
  P.squash = Math.max(0, P.squash - dt*4);
  P.tail += dt * (Math.hypot(P.vx, P.vy) > 10 ? 14 : 3);
  if (P.face === '😱' && lives > 0) P.face = carrying ? '😬' : '😏';

  // eggs: hatch countdown, chicks run
  for (const e of eggs){
    e.wob += dt*3;
    if (e.kind === 'egg' && hatched){
      e.hatchT -= dt;
      if (e.hatchT <= 0){
        e.kind = 'chick'; e.runT = 0; e.vx = R(70, 110); e.vy = 0;
        sHatch(); burst(e.x, e.y, '#fff', 8, 120);
        addFloat(e.x, e.y - 24, 'HATCHED!', '#fff');
      }
    }
    if (e.kind === 'chick'){
      e.runT += dt;
      e.x += e.vx*dt; e.y += Math.sin(e.runT*9)*28*dt;
      if (e.x > W - 14){
        eggs.splice(eggs.indexOf(e), 1);
        combo = 0; comboTimer = 0;
        popupMsg('IT GOT AWAY!'); sWarn();
        continue;
      }
    }
  }
  // respawn eggs in empty nests (not while chick running from that nest)
  for (const n of NESTS){
    if (!eggs.some(e=>e.nest===n) && elapsed < 52){
      if (Math.random() < dt*0.35) spawnEgg(n, false);
    }
  }
  // golden egg despawn if ignored too long
  if (goldenIn && !eggs.some(e=>e.kind==='golden') && carrying !== 'golden') goldenIn = false;

  // grab: egg / chick / golden
  if (!carrying){
    for (const e of eggs){
      const rr = e.kind === 'chick' ? 30 : 34;
      if (dist(P.x, P.y, e.x, e.y) < rr){
        if (e.kind === 'chick'){
          const mult = Math.min(combo + 1, 8);
          const pts = 15 * mult;
          score += pts; combo = Math.min(combo + 1, 8); comboTimer = 4;
          addFloat(e.x, e.y - 26, '+' + pts, '#7CFFB2');
          burst(e.x, e.y, '#ffe08a', 12, 150); sGrab();
          eggs.splice(eggs.indexOf(e), 1);
        } else {
          carrying = e.kind; // 'egg' or 'golden'
          P.face = '😬'; P.squash = 1;
          sGrab();
          eggs.splice(eggs.indexOf(e), 1);
        }
        break;
      }
    }
  }
  // deliver at burrow
  if (carrying && dist(P.x, P.y, BURROW.x, BURROW.y) < BURROW.r + 12) deliver();

  // guards
  const allGuards = [...hens];
  if (dog.active) allGuards.push(dog);
  const goldenChase = carrying === 'golden';
  for (const g of allGuards){
    g.wob += dt*4;
    const d = dist(P.x, P.y, g.x, g.y);
    const sees = carrying && (goldenChase || d < (g === dog ? 220 : 170));
    if (sees){
      g.chase = true;
      const sp = (g === dog ? 150 : 118) + elapsed * 0.9 + (goldenChase ? 25 : 0);
      const dx = P.x - g.x, dy = P.y - g.y, l = Math.hypot(dx, dy) || 1;
      g.x += dx/l*sp*dt; g.y += dy/l*sp*dt;
    } else {
      g.chase = false;
      const sp = (g === dog ? 95 : 62) + elapsed * 0.5;
      g.x += g.dir*sp*dt;
      if (g.x > W - 60) g.dir = -1;
      if (g.x < 150) g.dir = 1;
      g.y += Math.sin(g.wob*0.7)*10*dt;
    }
    g.x = clamp(g.x, 40, W-40);
    g.y = clamp(g.y, 110, H-60);
    // caught?
    if (d < g.r + P.r - 6){
      if (carrying) loseLife(g === dog ? 'dog' : 'hen');
      else { // bump: knockback + insult, no life lost (once per 1s)
        if (nearCd <= 0){
          nearCd = 1;
          P.x = clamp(P.x + (P.x > g.x ? 46 : -46), 24, W-24);
          popupMsg('RUDE.'); sWarn(); burst(P.x, P.y, '#fff', 6, 100);
        }
      }
      if (state !== 'play') return;
    }
    // near-miss
    if (carrying && d < 62 && d > g.r + P.r && !g.nearHit){
      g.nearHit = true;
      score += 5; addFloat(P.x, P.y - 34, 'SO CLOSE! +5', '#35e0ff'); sNear();
    }
    if (d > 90) g.nearHit = false;
  }

  if (timeLeft <= 0) endWin();
}

// --- draw helpers ---
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
function drawEgg(x, y, s, golden, wob){
  const pulse = 1 + Math.sin(wob)*0.06;
  ctx.save(); ctx.translate(x, y); ctx.scale(pulse, pulse);
  ctx.shadowColor = golden ? '#ffd23e' : '#7CFFB2';
  ctx.shadowBlur = 16;
  ctx.fillStyle = golden ? '#ffd23e' : '#fff8e6';
  ctx.beginPath();
  ctx.ellipse(0, 0, 13*s, 16*s, 0, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = golden ? '#b8860b' : '#e8d9b0';
  ctx.beginPath(); ctx.ellipse(-4*s, -6*s, 4*s, 6*s, -0.4, 0, TAU); ctx.fill();
  // face
  ctx.fillStyle = '#222'; ctx.font = `${11*s}px sans-serif`; ctx.textAlign = 'center';
  ctx.fillText('😴', 0, 5*s);
  if (golden){
    ctx.fillStyle = '#ffd23e';
    for (let i=0;i<4;i++){ const a = i*TAU/4 + wob; ctx.fillRect(Math.cos(a)*20*s-1.5, Math.sin(a)*20*s-1.5, 3, 3); }
  }
  ctx.restore();
}
function drawChick(x, y, runT){
  const bob = Math.sin(runT*12)*3;
  ctx.save(); ctx.translate(x, y + bob);
  ctx.shadowColor = '#ffe08a'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#ffe08a';
  ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ff9f1c';
  ctx.beginPath(); ctx.moveTo(11, -2); ctx.lineTo(19, 1); ctx.lineTo(11, 4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#222'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('😱', -2, 4);
  ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-6, 10); ctx.lineTo(-10, 16 + Math.sin(runT*14)*3); ctx.moveTo(6, 10); ctx.lineTo(10, 16 - Math.sin(runT*14)*3); ctx.stroke();
  ctx.restore();
}
function drawHen(g){
  ctx.save(); ctx.translate(g.x, g.y);
  // vision cone (red, only when player is carrying)
  if (carrying){
    ctx.fillStyle = 'rgba(255,60,80,0.10)';
    ctx.beginPath(); ctx.moveTo(0, 0);
    const a = Math.atan2(P.y - g.y, P.x - g.x);
    ctx.arc(0, 0, g.range, a - 0.45, a + 0.45); ctx.closePath(); ctx.fill();
  }
  const bob = Math.sin(g.wob*2)*2;
  ctx.translate(0, bob);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(0, 0, 20, 17, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ff5c5c';
  ctx.beginPath(); ctx.arc(0, -18, 9, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-4, -26); ctx.lineTo(0, -34); ctx.lineTo(4, -26); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff9f1c';
  ctx.beginPath(); ctx.moveTo(9, -18); ctx.lineTo(17, -15); ctx.lineTo(9, -13); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#222'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(g.chase ? '😤' : '😠', -1, -14);
  ctx.strokeStyle = '#ff9f1c'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-7, 15); ctx.lineTo(-9, 22 + Math.sin(g.wob*3)*2); ctx.moveTo(7, 15); ctx.lineTo(9, 22 - Math.sin(g.wob*3)*2); ctx.stroke();
  ctx.restore();
}
function drawDog(g){
  ctx.save(); ctx.translate(g.x, g.y);
  if (carrying){
    ctx.fillStyle = 'rgba(255,60,80,0.10)';
    ctx.beginPath(); ctx.moveTo(0, 0);
    const a = Math.atan2(P.y - g.y, P.x - g.x);
    ctx.arc(0, 0, g.range, a - 0.4, a + 0.4); ctx.closePath(); ctx.fill();
  }
  const bob = Math.sin(g.wob*2)*2.5;
  ctx.translate(0, bob);
  ctx.fillStyle = '#8a5a2b';
  ctx.beginPath(); ctx.ellipse(0, 0, 26, 19, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(20, -8, 13, 0, TAU); ctx.fill();
  ctx.fillStyle = '#6b4420';
  ctx.beginPath(); ctx.ellipse(30, -6, 7, 5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ff8fa3';
  ctx.fillRect(28, 2, 8, 6 + Math.sin(g.wob*6)*2);
  ctx.fillStyle = '#222'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(g.chase ? '😤' : '😠', 20, -6);
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-14, 16); ctx.lineTo(-16, 24); ctx.moveTo(14, 16); ctx.lineTo(16, 24); ctx.stroke();
  ctx.restore();
}
function drawRaccoon(){
  ctx.save(); ctx.translate(P.x, P.y);
  const sq = 1 + P.squash*0.12;
  ctx.scale(2 - sq > 1 ? 1.06 : 1, sq);
  // tail
  ctx.strokeStyle = '#5a5a6e'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-14, 6);
  ctx.quadraticCurveTo(-30, 2 + Math.sin(P.tail)*5, -34, -8 + Math.sin(P.tail)*6);
  ctx.stroke();
  ctx.strokeStyle = '#3a3a4e'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(-26, 1); ctx.lineTo(-30, -4); ctx.moveTo(-32, -4); ctx.lineTo(-34, -9); ctx.stroke();
  // body
  ctx.fillStyle = goldenMask ? '#c9a227' : '#6e6e80';
  ctx.beginPath(); ctx.ellipse(0, 2, 19, 16, 0, 0, TAU); ctx.fill();
  // mask band
  ctx.fillStyle = '#2e2e3e';
  ctx.beginPath(); ctx.ellipse(0, -6, 15, 7, 0, 0, TAU); ctx.fill();
  // ears
  ctx.fillStyle = goldenMask ? '#c9a227' : '#6e6e80';
  ctx.beginPath(); ctx.moveTo(-13, -14); ctx.lineTo(-17, -26); ctx.lineTo(-5, -18); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(13, -14); ctx.lineTo(17, -26); ctx.lineTo(5, -18); ctx.closePath(); ctx.fill();
  // face
  ctx.fillStyle = '#222'; ctx.font = '15px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(P.face, 0, -1);
  // carried egg on head
  if (carrying){
    ctx.save(); ctx.translate(0, -34 + Math.sin(elapsed*6)*2);
    ctx.fillStyle = carrying === 'golden' ? '#ffd23e' : '#fff8e6';
    ctx.shadowColor = carrying === 'golden' ? '#ffd23e' : '#7CFFB2'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.ellipse(0, 0, 9, 11, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function drawBurrow(){
  const pulse = 1 + Math.sin(elapsed*4)*0.05;
  ctx.save(); ctx.translate(BURROW.x, BURROW.y); ctx.scale(pulse, pulse);
  ctx.shadowColor = '#7CFFB2'; ctx.shadowBlur = 18;
  ctx.fillStyle = '#3a2415';
  ctx.beginPath(); ctx.ellipse(0, 0, BURROW.r, BURROW.r*0.72, 0, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#1c110a';
  ctx.beginPath(); ctx.ellipse(0, 2, BURROW.r*0.68, BURROW.r*0.45, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7CFFB2'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('🏠 HOME', 0, -BURROW.r - 6);
  ctx.restore();
}

// --- render ---
function draw(){
  ctx.save();
  if (shake > 0) ctx.translate(R(-shake, shake), R(-shake, shake));
  // sky / ground
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#241a4a'); g.addColorStop(0.45, '#3d2a5e'); g.addColorStop(1, '#5e3a2e');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W+40, H+40);
  // moon
  ctx.fillStyle = '#ffe9a8';
  ctx.beginPath(); ctx.arc(W-70, 62, 26, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e8cf8a';
  ctx.beginPath(); ctx.arc(W-78, 56, 6, 0, TAU); ctx.arc(W-62, 70, 4, 0, TAU); ctx.fill();
  // stars
  ctx.fillStyle = '#fff';
  for (let i=0;i<24;i++){ const sx = (i*97)%W, sy = (i*61)%130 + 8; ctx.globalAlpha = 0.4 + 0.6*Math.abs(Math.sin(elapsed*2 + i)); ctx.fillRect(sx, sy, 2, 2); }
  ctx.globalAlpha = 1;
  // ground
  ctx.fillStyle = '#2c4a22'; ctx.fillRect(-20, 84, W+40, H-64);
  ctx.fillStyle = '#33551f';
  for (let i=0;i<12;i++){ const gx = (i*53+20)%W; ctx.fillRect(gx, 84 + (i%3)*4, 60, 3); }
  // fence
  ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, 108); ctx.lineTo(W, 108); ctx.moveTo(0, 128); ctx.lineTo(W, 128); ctx.stroke();
  for (let x=20;x<W;x+=64){ ctx.beginPath(); ctx.moveTo(x, 96); ctx.lineTo(x, 140); ctx.stroke(); }
  // hay bales
  for (const h of hay){
    ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.rot);
    ctx.fillStyle = '#c9a227'; ctx.beginPath(); ctx.arc(0, 0, h.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#a8841c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, h.r*0.6, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  // grass tufts
  ctx.strokeStyle = '#4a7a2e'; ctx.lineWidth = 2;
  for (const gr of grass){
    const sw = Math.sin(elapsed*2 + gr.ph)*2;
    ctx.beginPath(); ctx.moveTo(gr.x, gr.y); ctx.lineTo(gr.x + sw, gr.y - gr.h); ctx.stroke();
  }
  // yolk splats
  for (const y of yolks){
    ctx.fillStyle = 'rgba(255,210,62,0.85)';
    ctx.beginPath(); ctx.ellipse(y.x, y.y, y.r, y.r*0.55, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(y.x, y.y, y.r*0.3, 0, TAU); ctx.fill();
  }
  // nests
  for (const n of NESTS){
    ctx.fillStyle = '#8a5a2b';
    ctx.beginPath(); ctx.ellipse(n.x, n.y + 12, 34, 12, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(n.x, n.y + 10, 30, 9, 0, 0, TAU); ctx.stroke();
  }
  drawBurrow();
  // eggs & chicks
  for (const e of eggs){
    if (e.kind === 'chick') drawChick(e.x, e.y, e.runT);
    else drawEgg(e.x, e.y - 6, e.kind === 'golden' ? 1.25 : 1, e.kind === 'golden', e.wob);
  }
  // guards
  for (const h of hens) drawHen(h);
  if (dog.active) drawDog(dog);
  drawRaccoon();
  // particles
  for (const p of parts){
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, p.t);
    ctx.fillStyle = p.col; ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*0.6);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  // floating texts
  ctx.textAlign = 'center';
  for (const f of floatTxts){
    ctx.globalAlpha = Math.max(0, f.t);
    ctx.font = 'bold 17px sans-serif'; ctx.fillStyle = f.col;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  // HUD
  ctx.fillStyle = 'rgba(10,8,24,0.72)'; rr(10, 10, W-20, 64, 12); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.font = 'bold 22px sans-serif';
  ctx.fillText('🥚 ' + score, 22, 38);
  ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 15px sans-serif';
  ctx.fillText('BEST ' + best, 22, 60);
  ctx.fillStyle = '#ff5c7a'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('❤'.repeat(lives) + '♡'.repeat(3 - lives), W/2, 38);
  ctx.fillStyle = '#35e0ff'; ctx.font = 'bold 15px sans-serif';
  ctx.fillText(rankFor(score), W/2, 60);
  ctx.fillStyle = timeLeft <= 10 ? '#ff5c5c' : '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(Math.ceil(timeLeft) + 's', W-22, 38);
  ctx.fillStyle = '#7CFFB2'; ctx.font = 'bold 14px sans-serif';
  ctx.fillText(combo > 1 ? 'COMBO x' + combo : '', W-22, 60);
  // carry indicator
  if (carrying){
    ctx.fillStyle = carrying === 'golden' ? '#ffd23e' : '#7CFFB2';
    ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(carrying === 'golden' ? 'GOLDEN! RUN TO HOME!' : 'CARRYING! GO HOME! ←', W/2, 92);
  }
  // popup
  if (popup && popupT > 0){
    ctx.globalAlpha = Math.min(1, popupT);
    ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(popup, W/2, 150);
    ctx.globalAlpha = 1;
  }
  // night-shift dim at 40s+
  if (elapsed >= 40 && state === 'play'){
    ctx.fillStyle = `rgba(8,6,20,${0.12 + 0.08*Math.sin(elapsed*3)})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (flash > 0){
    ctx.fillStyle = `rgba(255,60,60,${flash})`; ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
  drawOverlay();
}
function drawOverlay(){
  if (state === 'title'){
    ctx.fillStyle = 'rgba(10,8,24,0.78)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = '64px sans-serif'; ctx.fillText('🥚', W/2, 190);
    ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 40px sans-serif';
    ctx.fillText('STEAL AN EGG!', W/2, 250);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 19px sans-serif';
    ctx.fillText('Steal eggs. Dodge hens.', W/2, 292);
    ctx.fillText('Get yolked.', W/2, 318);
    ctx.font = '16px sans-serif'; ctx.fillStyle = '#b8b8d0';
    ctx.fillText('Drag / WASD to move • Grab glowing eggs', W/2, 368);
    ctx.fillText('Carry them HOME 🏠 • Hens are ANGRY 😠', W/2, 392);
    ctx.fillText('At 12s the eggs HATCH and run away!', W/2, 416);
    ctx.fillStyle = '#7CFFB2'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText('BEST ' + best + (goldenMask ? '  •  GOLD MASK 👑' : ''), W/2, 470);
    ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText('▶ TAP TO STEAL', W/2, 530);
  } else if (state === 'pause'){
    ctx.fillStyle = 'rgba(10,8,24,0.7)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W/2, H/2);
    ctx.font = '16px sans-serif'; ctx.fillStyle = '#b8b8d0';
    ctx.fillText('The hens are waiting. They hold grudges.', W/2, H/2 + 34);
  } else if (state === 'over' || state === 'win'){
    ctx.fillStyle = 'rgba(10,8,24,0.85)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = '56px sans-serif';
    ctx.fillText(state === 'win' ? '🏆' : '🍳', W/2, 170);
    ctx.fillStyle = state === 'win' ? '#ffd23e' : '#ff5c7a';
    ctx.font = 'bold 36px sans-serif';
    ctx.fillText(state === 'win' ? 'CLEAN GETAWAY!' : 'BUSTED!', W/2, 228);
    ctx.fillStyle = '#fff'; ctx.font = '19px sans-serif';
    if (state === 'over') ctx.fillText(overLine, W/2, 268);
    ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 30px sans-serif';
    ctx.fillText('SCORE ' + score, W/2, 322);
    ctx.fillStyle = '#7CFFB2'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText('RANK: ' + rankFor(score) + '   •   BEST ' + best, W/2, 356);
    ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif';
    ctx.fillText('Eggs stolen: ' + Math.max(0, Math.floor(score/10)), W/2, 388);
    // share + restart buttons
    ctx.fillStyle = '#ffd23e'; rr(W/2 - 130, 420, 260, 52, 12); ctx.fill();
    ctx.fillStyle = '#222'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText('📋 COPY RESULT', W/2, 453);
    ctx.fillStyle = '#35e0ff'; rr(W/2 - 130, 486, 260, 52, 12); ctx.fill();
    ctx.fillStyle = '#06222e'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText('↻ STEAL AGAIN', W/2, 519);
  }
}
cv.addEventListener('pointerdown', e=>{
  if (state !== 'over' && state !== 'win') return;
  const p = toGame(e);
  if (p.y >= 420 && p.y <= 472 && Math.abs(p.x - W/2) <= 130){
    const txt = `I stole ${score} pts of eggs in STEAL AN EGG! ${overLine || 'Clean getaway.'} Play: ${GAME_URL}`;
    const done = ()=>{
      popupMsg('COPIED!');
      if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(done);
    else done();
  } else if (p.y >= 486 && p.y <= 538 && Math.abs(p.x - W/2) <= 130){
    reset(); state = 'play'; sStart();
  }
});

// --- loop ---
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now - last)/1000);
  last = now;
  if (state === 'play') update(dt);
  else if (state === 'title'){ elapsed += dt; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
