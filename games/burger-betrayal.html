<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BURGER BETRAYAL! — Day 52</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0b0618;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden}
h1{font-size:22px;margin:8px;color:#ffb020;text-shadow:0 0 18px #ff6a00;letter-spacing:1px}
.hook{color:#7df9ff;font-size:14px;margin-bottom:6px}
#wrap{position:relative;width:min(96vw,420px)}
canvas{width:100%;background:linear-gradient(#1a0b2e,#2b1052 60%,#3a1a12);border:2px solid #ffb020;border-radius:14px;touch-action:none;display:block}
#hud{display:flex;gap:14px;font-weight:700;margin:6px;font-size:15px}
button{background:#ffb020;color:#1a0b2e;border:0;padding:10px 18px;border-radius:999px;font-weight:800;cursor:pointer;margin:4px}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,0,15,.72);border-radius:14px;text-align:center;padding:20px}
#overlay h2{font-size:28px;color:#ffb020;margin-bottom:8px}#overlay p{margin:6px;line-height:1.4}
.hidden{display:none!important}
a{color:#7df9ff}
</style></head>
<body>
<h1>🍔 BURGER BETRAYAL!</h1><div class="hook">The tomato dodges. Trust nothing.</div>
<div id="hud"><span id="score">Score 0</span><span id="combo">Combo x1</span><span id="lives">❤️❤️❤️</span><span id="rank">Snack Intern</span></div>
<div id="wrap"><canvas id="c" width="420" height="640"></canvas>
<div id="overlay"><h2 id="ovTitle">BURGER BETRAYAL!</h2><p id="ovText">Move the bun. Catch the glowing food.<br>Dodge the angry fish. 🐟</p><button id="startBtn">▶ START</button><p><a href="../index.html">← Catalog</a></p></div>
</div>
<p style="font-size:12px;opacity:.7;margin:8px">← → / drag to move • High score saved locally</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=420,H=640;
let state='menu',score=0,combo=1,comboTimer=0,lives=3,elapsed=0,last=0,spawnT=0,shake=0,flipUntil=0,flipWarned=false,doubleUntil=0,goldRainT=0;
let player={x:W/2,w:84},stack=[],items=[],parts=[],popups=[],keys={},pointerX=null;
let high=+localStorage.getItem('burgerBetrayalHigh')||0;
const ranks=[[0,'Snack Intern'],[150,'Fry Cook'],[400,'Burger Gremlin'],[800,'Stack Menace'],[1400,'Tomato Whisperer'],[2200,'BURGER ROYALTY']];
function rank(){let r=ranks[0][1];for(const[t,n]of ranks)if(score>=t)r=n;return r}
let AC=null;function beep(f,d=0.07,type='square',v=0.05){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function popup(x,y,t,col='#fff'){popups.push({x,y,t,life:1,col})}
function splat(x,y,col){for(let i=0;i<10;i++)parts.push({x,y,vx:(Math.random()-0.5)*220,vy:-Math.random()*200-40,life:0.6,col,r:3+Math.random()*4})}
const TYPES={
 lettuce:{col:'#39e75f',pts:10,label:'🥬'},
 tomato:{col:'#ff4757',pts:15,label:'🍅'},
 cheese:{col:'#ffd32a',pts:15,label:'🧀'},
 patty:{col:'#a0522d',pts:20,label:'🟤'},
 pickle:{col:'#ffe600',pts:50,label:'🥒',rare:true},
 fish:{col:'#a55eea',pts:0,label:'🐟',hazard:true}
};
function spawn(){
 const elapsedS=elapsed;
 let pool=['lettuce','tomato','cheese','patty','lettuce','cheese'];
 if(Math.random()<0.10)pool.push('fish','fish');
 let type=pool[Math.floor(Math.random()*pool.length)];
 if(Math.random()<0.06)type='pickle';
 if(Math.random()<0.13)type='fish';
 const x=30+Math.random()*(W-60);
 items.push({type,x,y:-30,vy:120+Math.random()*60+elapsedS*2.2,vx:0,wob:Math.random()*6.28,dodgeDir:Math.random()<0.5?-1:1,age:0});
}
function reset(){score=0;combo=1;comboTimer=0;lives=3;elapsed=0;spawnT=0;shake=0;flipUntil=0;flipWarned=false;doubleUntil=0;stack=[];items=[];parts=[];popups=[];player.x=W/2;state='play';document.getElementById('overlay').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
document.getElementById('startBtn').onclick=reset;
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();pointerX=(e.clientX-r.left)*(W/r.width)});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();pointerX=(e.clientX-r.left)*(W/r.width);if(state!=='play')reset()});
addEventListener('keydown',e=>{keys[e.key]=true;if(state!=='play'&&(e.key===' '||e.key==='Enter'))reset()});
addEventListener('keyup',e=>keys[e.key]=false);
function gameOver(){
 state='over';if(score>high){high=score;localStorage.setItem('burgerBetrayalHigh',high)}
 const lines=['The burger filed for divorce.','Your tomato left. It runs now.','Tower down. Dignity down.','The fish did this. Allegedly.'];
 const line=lines[Math.floor(Math.random()*lines.length)];
 const ov=document.getElementById('overlay');ov.classList.remove('hidden');
 document.getElementById('ovTitle').textContent='💥 BURGER DOWN!';
 document.getElementById('ovText').innerHTML=line+'<br>Score <b>'+score+'</b> • '+rank()+'<br>Best '+high+'<br><button id="copyBtn">📋 COPY RESULT</button>';
 document.getElementById('startBtn').textContent='↻ ONE MORE TRY';
 setTimeout(()=>{const b=document.getElementById('copyBtn');if(b)b.onclick=()=>{const txt='I scored '+score+' in BURGER BETRAYAL! ('+rank()+') — the tomato dodges. https://tuannx.github.io/daily-mini-games/games/burger-betrayal.html';if(navigator.clipboard)navigator.clipboard.writeText(txt);b.textContent='✅ COPIED!'}},0);
 beep(90,0.3,'sawtooth',0.08);
}
function drawItem(it){
 const t=TYPES[it.type];ctx.save();ctx.translate(it.x,it.y);
 const sq=1+Math.sin(it.age*10)*0.06;ctx.scale(sq,2-sq>1.12?1.12:sq);
 if(!t.hazard){ctx.shadowColor=t.col;ctx.shadowBlur=16}
 ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.label,0,0);
 // face
 ctx.font='11px serif';
 if(t.hazard)ctx.fillText('😠',0,14);else if(it.type==='tomato'&&elapsed>=12)ctx.fillText('😏',0,14);else if(t.rare)ctx.fillText('😎',0,14);else ctx.fillText('🙂',0,14);
 ctx.restore();
}
function draw(){
 ctx.save();if(shake>0){ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);shake*=0.88;if(shake<0.3)shake=0}
 ctx.clearRect(-10,-10,W+20,H+20);
 // background shelves / flies
 ctx.fillStyle='rgba(255,255,255,0.05)';for(let i=0;i<3;i++)ctx.fillRect(0,120+i*170,W,4);
 ctx.font='14px serif';for(let i=0;i<3;i++){const fx=(i*137+elapsed*30*(i%2?1:-1))% (W+20)-10;ctx.fillText('🪰',fx,60+i*90)}
 const flipped=elapsed*1000<flipUntil && state==='play';
 if(flipped){ctx.fillStyle='rgba(255,60,60,0.10)';ctx.fillRect(0,0,W,H)}
 // stack
 const baseY=H-70;const wob=Math.sin(elapsed*3)*Math.min(10,stack.length*1.2);
 stack.forEach((s,i)=>{ctx.save();ctx.translate(player.x+wob*(i+1)/Math.max(1,stack.length),baseY-14-i*13);ctx.font='26px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(TYPES[s].label,0,0);ctx.restore()});
 // player bun
 ctx.save();ctx.translate(player.x,baseY+12);const sqp=1+Math.sin(elapsed*6)*0.03;ctx.scale(sqp,1/sqp);
 ctx.font='52px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍞',0,0);
 ctx.font='14px serif';ctx.fillText(state==='play'?'😋':'😵',0,16);ctx.restore();
 if(flipped){ctx.font='bold 20px system-ui';ctx.fillStyle='#ff6b81';ctx.textAlign='center';ctx.fillText('KETCHUP! CONTROLS FLIPPED!',W/2,36)}
 // items
 items.forEach(drawItem);
 // particles
 parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1});
 // popups
 popups.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.font='bold 18px system-ui';ctx.fillStyle=p.col;ctx.textAlign='center';ctx.fillText(p.t,p.x,p.y);ctx.globalAlpha=1});
 // timer bar
 ctx.fillStyle='#333';ctx.fillRect(10,10,120,8);ctx.fillStyle='#ffb020';ctx.fillRect(10,10,Math.min(120,elapsed/60*120),8);
 ctx.restore();
 document.getElementById('score').textContent='Score '+score;
 document.getElementById('combo').textContent='Combo x'+combo;
 document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,lives));
 document.getElementById('rank').textContent=rank();
}
function loop(now){
 if(state!=='play')return;
 let dt=Math.min(0.033,(now-last)/1000);last=now;elapsed+=dt;
 // events
 if(elapsed>=30 && !flipWarned){/* first flip handled below */}
 if(elapsed>=30 && elapsed<30.2 && !flipWarned){flipWarned=true;flipUntil=elapsed*1000+5000;popup(W/2,120,'KETCHUP!','#ff6b81');beep(180,0.2,'sawtooth')}
 if(elapsed>=55){if(Math.floor(elapsed)%17===0 && Math.random()<0.02){flipUntil=elapsed*1000+4000;popup(W/2,120,'KETCHUP AGAIN!','#ff6b81')}}
 const flipped=elapsed*1000<flipUntil;
 let dir=0;if(keys['ArrowLeft']||keys['a'])dir-=1;if(keys['ArrowRight']||keys['d'])dir+=1;
 if(flipped)dir*=-1;
 player.x+=dir*380*dt;
 if(pointerX!==null){let target=pointerX;if(flipped)target=W-target;player.x+=(target-player.x)*Math.min(1,dt*14)}
 player.x=Math.max(44,Math.min(W-44,player.x));
 comboTimer-=dt;if(comboTimer<=0)combo=1;
 spawnT-=dt;const interval=Math.max(0.38,0.85-elapsed*0.008);
 if(spawnT<=0){spawn();if(elapsed>=40&&Math.random()<0.4)spawn();spawnT=interval}
 const baseY=H-70, catchY=baseY-14-stack.length*13;
 items=items.filter(it=>{
   it.age+=dt;
   // tomato dodges after 12s
   if(it.type==='tomato'&&elapsed>=12){const d=it.x-player.x;if(Math.abs(d)<70&&it.y>catchY-180)it.vx=it.dodgeDir*140}
   if(it.type==='cheese'&&elapsed>=20)it.vx=Math.sin(it.age*4)*90;
   if(it.type==='fish')it.vx=Math.sin(it.age*3)*60;
   it.x+=it.vx*dt;it.y+=it.vy*dt;it.vx*=0.98;
   it.x=Math.max(20,Math.min(W-20,it.x));
   if(it.y>=catchY-16&&it.y<catchY+22&&Math.abs(it.x-player.x)<52){
     const t=TYPES[it.type];
     if(t.hazard){lives--;combo=1;shake=14;splat(it.x,it.y,'#a55eea');popup(it.x,it.y-20,'YUCK! FISH!','#c56cf0');beep(110,0.2,'sawtooth');if(stack.length)stack.pop();if(lives<=0){gameOver()}return false}
     stack.push(it.type);comboTimer=2.2;const gained=t.pts*combo;score+=gained;combo=Math.min(9,combo+ (comboTimer>0?1:0));if(combo>9)combo=9;
     popup(it.x,it.y-24,'+'+gained,t.col);splat(it.x,it.y,t.col);beep(t.rare?880:440+combo*30,0.07,'square');
     if(Math.abs(it.x-player.x)>36)popup(it.x,it.y-44,'SO CLOSE!','#7df9ff');
     if(stack.length>14){score+=100;popup(W/2,200,'TOWER BONUS +100','#ffe600');stack=stack.slice(-8)}
     return false;
   }
   if(it.y>H-30){const t=TYPES[it.type];if(!t.hazard){lives--;combo=1;splat(it.x,H-20,t.col);popup(it.x,H-50,'SPLAT!','#ff6b81');beep(140,0.12,'triangle');if(lives<=0){gameOver()}}return false}
   return true;
 });
 parts=parts.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt;return p.life>0});
 popups=popups.filter(p=>{p.y-=40*dt;p.life-=dt*0.9;return p.life>0});
 draw();if(state==='play')requestAnimationFrame(loop);
}
draw();
</script></body></html>
