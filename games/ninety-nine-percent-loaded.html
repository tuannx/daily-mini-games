<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>99% LOADED! — Day 47</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#0b0618; overflow:hidden; touch-action:none;
    font-family:'Trebuchet MS','Comic Sans MS',sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#101830; border-radius:12px;
    box-shadow:0 0 40px #00d4ffaa, 0 0 90px #7b2ff7aa; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="720"></canvas></div>
<script>
"use strict";
// 99% LOADED! — Day 47
// You ARE the loading bar. Tap it to fill. It squirms, dodges, runs away.
// Viruses steal %, popups block you, the bar overheats, and at 50s it
// stalls at 99% and mocks you. Reach 100% in 60s.
// TWIST LADDER: 8s bar squirms/dodges -> 12s VIRUS! -> 15s CANCEL button
// flees -> 20s POPUP STORM -> 30s OVERHEAT! (fan to cool) -> 40s BAR RUNS
// AWAY! -> 50s FINAL 1% stall. Trend: itch.io "99.999999%" (Nov 15, 2026)
// — the loading screen IS the game.
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 480, H = 720;

// ---------- audio (WebAudio, self-generated) ----------
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(f, d, type, v){
  const ac = audio(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type||'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(v||0.12, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
}
function tapSnd(){ beep(740, 0.05, 'square', 0.07); }
function fillSnd(){ beep(1175, 0.06, 'sine', 0.10); setTimeout(()=>beep(1568, 0.08, 'sine', 0.09), 50); }
function virusSnd(){ beep(180, 0.2, 'sawtooth', 0.12); setTimeout(()=>beep(120, 0.25, 'sawtooth', 0.12), 90); }
function squashSnd(){ beep(500, 0.06, 'triangle', 0.12); setTimeout(()=>beep(900, 0.08, 'triangle', 0.10), 40); }
function popupSnd(){ beep(880, 0.07, 'square', 0.08); setTimeout(()=>beep(660, 0.07, 'square', 0.08), 60); }
function fanSnd(){ beep(300, 0.12, 'sine', 0.10); setTimeout(()=>beep(600, 0.1, 'sine', 0.08), 80); }
function ramSnd(){ [1319,1568,2093].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'sine',0.10), i*60)); }
function nopeSnd(){ beep(220, 0.15, 'sawtooth', 0.10); setTimeout(()=>beep(165, 0.25, 'sawtooth', 0.10), 120); }
function boomSnd(){
  const ac = audio(); if(!ac) return;
  const len = ac.sampleRate * 0.4, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2.2);
  const s = ac.createBufferSource(); s.buffer = buf;
  const g = ac.createGain(); g.gain.value = 0.25;
  s.connect(g); g.connect(ac.destination); s.start();
  beep(90, 0.4, 'sawtooth', 0.10);
}
function winSnd(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.15,'triangle',0.12), i*90)); }

// ---------- helpers ----------
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const TAU = Math.PI*2;
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); }

// ---------- state ----------
const ROUND = 60;
let state = 'menu'; // menu | play | over | win
let t = 0, timeLeft = ROUND, pct = 0, heat = 0;
let combo = 0, comboT = 0, bestCombo = 0;
let viruses = [], popups = [], chips = [], parts = [], popupsTxt = [], confetti = [];
let bar = { x: 50, y: 350, w: 380, h: 46, vx: 0, vy: 0, squash: 0, runaway: false, face: 'calm' };
let fan = { x: 400, y: 620, spin: 0, on: false };
let cancelBtn = { x: 240, y: 640, on: false, wiggle: 0 };
let shake = 0, twistMsg = '', twistMsgT = 0, twistsDone = {};
let virusT = 0, popupT = 0, chipT = 0, goldenT = 0, stallWarned = false;
let high = +(localStorage.getItem('npl_high')||0);
let unlock = localStorage.getItem('npl_unlock')||'';
let copied = false, copyT = 0, failLine = '', menuT = 0;
let pointer = { x: -999, y: -999 };
let spinnerA = 0;

const FAILS = [
  "The bar filed for overtime.",
  "Your Wi-Fi left the chat.",
  "The virus got promoted.",
  "Loading... forever.",
  "Error 404: patience not found.",
  "The bar unionized. You lost.",
  "99% is a lifestyle now.",
  "Your download expired. So did you.",
];
const POPUP_ADS = ["YOU WON!", "FREE RAM!", "HOT SINGLES", "UPDATE NOW", "100% FREE*", "CLICK ME!"];
function rankFor(p){
  if(p>=100) return "100% CLUB";
  if(p>=85) return "ALMOST THERE";
  if(p>=60) return "LOADING LEGEND";
  if(p>=30) return "BUFFERING ROOKIE";
  return "DIAL-UP PEASANT";
}
function popup(x,y,txt,col,size){ popupsTxt.push({x,y,txt,life:1.2,col:col||'#fff',size:size||26}); }
function burst(x,y,col,n,spd){
  for(let i=0;i<(n||12);i++){
    const a = rand(0,TAU), s = rand(40,spd||160);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rand(0.4,0.9),col,r:rand(2,5),grav:500});
  }
}
function addPct(n, x, y, label){
  const before = pct;
  pct = clamp(pct + n, 0, 100);
  if(label) popup(x, y, label, n>=0 ? '#7bff5e' : '#ff2d55', n>=5 ? 28 : 22);
  if(n<0 && before>=97 && pct<97) popup(W/2, 300, "SO CLOSE!", '#ff9f1c', 32);
  if(pct>=100 && state==='play'){ winGame(); }
}

// ---------- spawns ----------
function spawnVirus(){
  if(viruses.length >= 4) return;
  const side = Math.floor(rand(0,4));
  let x, y;
  if(side===0){ x = rand(40,440); y = 120; }
  else if(side===1){ x = rand(40,440); y = 680; }
  else if(side===2){ x = 30; y = rand(160,640); }
  else { x = 450; y = rand(160,640); }
  viruses.push({ x, y, r: 17, spd: rand(42,58) + t*0.6, wob: rand(0,TAU), dead:false });
  virusSnd();
}
function spawnPopup(){
  if(popups.length >= 3) return;
  const fake = Math.random() < 0.3;
  popups.push({ x: rand(60, 300), y: rand(200, 480), w: 170, h: fake?64:92,
    title: fake ? "LOADING..." : POPUP_ADS[Math.floor(Math.random()*POPUP_ADS.length)],
    fake, wiggle: 0, life: 9 });
  popupSnd();
}
function spawnChip(golden){
  chips.push({ x: rand(60, 420), y: -30, vy: rand(55, 80), r: golden?20:15,
    golden: !!golden, spin: rand(0,TAU), dead:false });
}

// ---------- twists ----------
function fireTwist(name){
  if(twistsDone[name]) return; twistsDone[name] = true;
  if(name==='squirm'){ twistMsg = "IT SQUIRMS!"; }
  if(name==='virus'){ twistMsg = "VIRUS!"; spawnVirus(); }
  if(name==='cancel'){ twistMsg = "DON'T PRESS CANCEL."; cancelBtn.on = true; }
  if(name==='popups'){ twistMsg = "POPUP STORM!"; spawnPopup(); spawnPopup(); }
  if(name==='heat'){ twistMsg = "OVERHEAT!"; fan.on = true; }
  if(name==='runaway'){ twistMsg = "BAR RUNS AWAY!"; bar.runaway = true;
    bar.vx = rand(120,180)*(Math.random()<0.5?-1:1); bar.vy = rand(90,140)*(Math.random()<0.5?-1:1); }
  if(name==='stall'){ twistMsg = "FINAL 1%!"; }
  twistMsgT = 2.2;
  popup(W/2, 300, twistMsg, '#ff9f1c', 34);
  if(name!=='squirm') popupSnd();
}

// ---------- update ----------
function update(dt){
  menuT += dt; spinnerA += dt*2;
  if(state==='menu'){ return; }
  if(state==='over' || state==='win'){
    confetti.forEach(p=>{ p.vy += 300*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.spin*dt; });
    confetti = confetti.filter(p=>p.y < H+20);
    parts.forEach(p=>{ p.vy += (p.grav||0)*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; });
    parts = parts.filter(p=>p.life>0);
    return;
  }
  // play
  t += dt; timeLeft = Math.max(0, ROUND - t);
  if(timeLeft<=0){ endGame(); return; }
  if(t>=8) fireTwist('squirm');
  if(t>=12) fireTwist('virus');
  if(t>=15) fireTwist('cancel');
  if(t>=20) fireTwist('popups');
  if(t>=30) fireTwist('heat');
  if(t>=40) fireTwist('runaway');
  if(t>=50) fireTwist('stall');

  // passive fill (stalls at 99% after 50s)
  const stalled = t>=50 && pct>=99;
  if(!stalled) pct = clamp(pct + 0.25*dt, 0, 99.9);
  if(stalled && !stallWarned){ stallWarned = true; popup(W/2, 260, "IT'S STUCK!", '#ff2d55', 28); }

  // combo decay
  if(comboT>0){ comboT -= dt; if(comboT<=0) combo = 0; }

  // bar squash decay
  bar.squash = Math.max(0, bar.squash - dt*4);

  // bar squirm / dodge (from 8s)
  if(t>=8 && !bar.runaway){
    const homeX = 50, homeY = 350;
    const dx = pointer.x - (bar.x + bar.w/2), dy = pointer.y - (bar.y + bar.h/2);
    const d = Math.hypot(dx, dy);
    let tx = homeX + Math.sin(t*3.1)*8, ty = homeY + Math.cos(t*2.3)*6;
    if(d < 110 && d > 1){ // dodge the pointer a little
      tx -= (dx/d)*26; ty -= (dy/d)*18;
    }
    bar.x += (clamp(tx, 20, W-bar.w-20) - bar.x) * Math.min(1, dt*6);
    bar.y += (clamp(ty, 200, 560) - bar.y) * Math.min(1, dt*6);
  }
  // bar runaway bounce (from 40s)
  if(bar.runaway){
    bar.x += bar.vx*dt; bar.y += bar.vy*dt;
    if(bar.x < 10){ bar.x = 10; bar.vx = Math.abs(bar.vx); }
    if(bar.x > W-bar.w-10){ bar.x = W-bar.w-10; bar.vx = -Math.abs(bar.vx); }
    if(bar.y < 130){ bar.y = 130; bar.vy = Math.abs(bar.vy); }
    if(bar.y > 600){ bar.y = 600; bar.vy = -Math.abs(bar.vy); }
    bar.vx = clamp(bar.vx + rand(-30,30)*dt, -220, 220);
    bar.vy = clamp(bar.vy + rand(-30,30)*dt, -180, 180);
  }
  // bar face mood
  bar.face = heat>60 ? 'hot' : (bar.runaway ? 'panic' : (viruses.length>0 ? 'scared' : 'calm'));

  // overheat (from 30s)
  if(fan.on){
    heat = clamp(heat + 5*dt, 0, 100);
    fan.spin += dt * (4 + heat/12);
    if(heat>60) pct = clamp(pct - 1.5*dt, 0, 100);
    if(heat>=100){ heat = 40; addPct(-10, W/2, 300, "MELTDOWN! -10%"); shake = 10; boomSnd(); }
  }

  // virus spawns + movement
  if(t>=12){
    virusT -= dt;
    if(virusT<=0){ spawnVirus(); virusT = Math.max(1.4, 2.6 - t*0.02); }
  }
  const bcx = bar.x + bar.w/2, bcy = bar.y + bar.h/2;
  for(const v of viruses){
    if(v.dead) continue;
    v.wob += dt*5;
    const dx = bcx - v.x, dy = bcy - v.y, d = Math.hypot(dx, dy) || 1;
    v.x += (dx/d)*v.spd*dt + Math.cos(v.wob)*14*dt;
    v.y += (dy/d)*v.spd*dt + Math.sin(v.wob)*14*dt;
    // reached the bar: steal %
    if(v.x > bar.x-6 && v.x < bar.x+bar.w+6 && v.y > bar.y-6 && v.y < bar.y+bar.h+6){
      v.dead = true;
      addPct(-5, v.x, v.y-24, "STOLEN! -5%");
      virusSnd(); shake = 6;
      burst(v.x, v.y, '#ff2d55', 14, 180);
    }
  }
  viruses = viruses.filter(v=>!v.dead);

  // popup spawns
  if(t>=20){
    popupT -= dt;
    if(popupT<=0){ spawnPopup(); popupT = 3.5; }
  }
  for(const p of popups){ p.life -= dt; p.wiggle = Math.max(0, p.wiggle - dt*4); }
  popups = popups.filter(p=>p.life>0);

  // RAM chips (golden every ~18s)
  chipT -= dt;
  if(chipT<=0){ spawnChip(false); chipT = rand(6,9); }
  goldenT -= dt;
  if(goldenT<=0){ spawnChip(true); goldenT = 18; }
  for(const ch of chips){
    if(ch.dead) continue;
    ch.y += ch.vy*dt; ch.spin += dt*3;
    if(ch.y > H+30) ch.dead = true;
  }
  chips = chips.filter(ch=>!ch.dead);

  // cancel button wiggle
  if(cancelBtn.on) cancelBtn.wiggle = Math.max(0, cancelBtn.wiggle - dt*4);

  // particles / floating texts
  parts.forEach(p=>{ p.vy += (p.grav||0)*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; });
  parts = parts.filter(p=>p.life>0);
  popupsTxt.forEach(p=>{ p.y -= 30*dt; p.life -= dt; });
  popupsTxt = popupsTxt.filter(p=>p.life>0);
  if(twistMsgT>0) twistMsgT -= dt;
  if(shake>0) shake = Math.max(0, shake - dt*30);
  if(copyT>0) copyT -= dt;
}

function endGame(){
  state = 'over';
  failLine = FAILS[Math.floor(Math.random()*FAILS.length)];
  if(pct > high){ high = pct; localStorage.setItem('npl_high', String(Math.floor(high))); }
  boomSnd();
}
function winGame(){
  state = 'win';
  if(pct > high){ high = pct; localStorage.setItem('npl_high', String(Math.floor(high))); }
  if(!unlock){ unlock = 'rainbow-bar'; localStorage.setItem('npl_unlock', unlock); }
  winSnd();
  for(let i=0;i<90;i++) confetti.push({x:rand(0,W), y:rand(-80,-10), vx:rand(-40,40), vy:rand(60,160),
    rot:rand(0,TAU), spin:rand(-4,4), col:['#00d4ff','#ff2d55','#7bff5e','#ffd60a','#ff9f1c'][i%5], w:rand(6,10), h:rand(8,14)});
}
function resetGame(){
  t = 0; timeLeft = ROUND; pct = 0; heat = 0;
  combo = 0; comboT = 0; bestCombo = 0;
  viruses = []; popups = []; chips = []; parts = []; popupsTxt = []; confetti = [];
  bar = { x: 50, y: 350, w: 380, h: 46, vx: 0, vy: 0, squash: 0, runaway: false, face: 'calm' };
  fan = { x: 400, y: 620, spin: 0, on: false };
  cancelBtn = { x: 240, y: 640, on: false, wiggle: 0 };
  shake = 0; twistMsg = ''; twistMsgT = 0; twistsDone = {};
  virusT = 0; popupT = 0; chipT = 4; goldenT = 14; stallWarned = false;
  copied = false; failLine = '';
  state = 'play';
}

// ---------- tapping ----------
function tapBar(){
  if(state!=='play') return;
  const stalled = t>=50 && pct>=99;
  const gain = (stalled ? 0.35 : 1.5) + Math.min(combo,10)*0.1;
  combo++; comboT = 1.2; if(combo>bestCombo) bestCombo = combo;
  bar.squash = 1;
  addPct(gain, bar.x + bar.w/2, bar.y - 16, "+" + gain.toFixed(1) + "%");
  if(combo>=3) popup(bar.x + bar.w/2, bar.y - 44, "COMBO x"+combo+"!", '#7bff5e', 24);
  fillSnd();
}
function hitBar(p){
  return p.x>=bar.x && p.x<=bar.x+bar.w && p.y>=bar.y && p.y<=bar.y+bar.h;
}

// ---------- drawing ----------
function drawBarFace(cx, cy){
  // face rides on the fill head
  ctx.fillStyle = '#1a1a1a';
  const f = bar.face;
  if(f==='panic'){
    circle(cx-8, cy-6, 3); circle(cx+8, cy-6, 3);
    ctx.beginPath(); ctx.ellipse(cx, cy+8, 4, 6, 0, 0, TAU); ctx.fill();
  } else if(f==='hot'){
    circle(cx-8, cy-6, 3); circle(cx+8, cy-6, 3);
    ctx.beginPath(); ctx.arc(cx, cy+12, 5, Math.PI*1.15, Math.PI*1.85); ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.fillStyle = '#ff2d55'; circle(cx-14, cy-12, 3); circle(cx+14, cy-12, 3); // sweat
    ctx.fillStyle = '#1a1a1a';
  } else if(f==='scared'){
    circle(cx-8, cy-7, 3.5); circle(cx+8, cy-7, 3.5);
    ctx.beginPath(); ctx.arc(cx, cy+4, 5, 0.15*Math.PI, 0.85*Math.PI); ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=2.5; ctx.stroke();
  } else {
    // calm smug
    circle(cx-8, cy-5, 2.5); circle(cx+8, cy-5, 2.5);
    ctx.beginPath(); ctx.arc(cx, cy+4, 6, 0.15*Math.PI, 0.85*Math.PI); ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=2.5; ctx.stroke();
  }
}
function drawBar(){
  const sq = bar.squash;
  const bw = bar.w + sq*6, bh = bar.h - sq*6;
  const bx = bar.x - sq*3, by = bar.y + sq*3;
  ctx.save();
  // track
  ctx.fillStyle = '#0a0f22';
  roundRect(bx-4, by-4, bw+8, bh+8, 12); ctx.fill();
  ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 3;
  roundRect(bx-4, by-4, bw+8, bh+8, 12); ctx.stroke();
  // fill (rainbow if unlocked)
  const fw = Math.max(0, (bw-4) * pct/100);
  if(fw > 2){
    if(unlock==='rainbow-bar'){
      const g = ctx.createLinearGradient(bx, by, bx+bw, by);
      ['#ff2d55','#ff9f1c','#ffd60a','#7bff5e','#00d4ff','#7b2ff7'].forEach((c,i)=>g.addColorStop(i/5, c));
      ctx.fillStyle = g;
    } else if(heat>60){
      ctx.fillStyle = '#ff2d55';
    } else {
      ctx.fillStyle = '#00d4ff';
    }
    roundRect(bx+2, by+2, fw, bh-4, 8); ctx.fill();
  }
  // stripes on fill
  if(fw > 30){
    ctx.fillStyle = '#ffffff33';
    for(let sx = bx+10; sx < bx+fw-6; sx += 22){
      ctx.beginPath(); ctx.moveTo(sx, by+4); ctx.lineTo(sx+10, by+4); ctx.lineTo(sx+2, by+bh-4); ctx.lineTo(sx-8, by+bh-4); ctx.closePath(); ctx.fill();
    }
  }
  // face at fill head (or center if empty)
  const fx = bx + Math.max(22, fw - 4), fy = by + bh/2;
  drawBarFace(fx, fy);
  ctx.restore();
}
function drawVirus(v){
  ctx.save(); ctx.translate(v.x, v.y);
  ctx.fillStyle = '#3a0d2e'; circle(0,0,v.r+2);
  ctx.fillStyle = '#c9184a'; circle(0,0,v.r);
  // spikes
  ctx.fillStyle = '#ff2d55';
  for(let i=0;i<6;i++){
    const a = i*TAU/6 + v.wob*0.3;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*(v.r-2), Math.sin(a)*(v.r-2));
    ctx.lineTo(Math.cos(a+0.3)*(v.r+7), Math.sin(a+0.3)*(v.r+7));
    ctx.lineTo(Math.cos(a+0.6)*(v.r-2), Math.sin(a+0.6)*(v.r-2));
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#c9184a'; circle(0,0,v.r-2);
  // angry eyes + fangs
  ctx.fillStyle = '#fff'; circle(-6,-4,4); circle(6,-4,4);
  ctx.fillStyle = '#1a1a1a'; circle(-6,-3,2); circle(6,-3,2);
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-10,-11); ctx.lineTo(-2,-7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10,-11); ctx.lineTo(2,-7); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(-5,6); ctx.lineTo(-2,11); ctx.lineTo(1,6); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(3,6); ctx.lineTo(6,11); ctx.lineTo(9,6); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawPopupAd(p){
  ctx.save();
  const wob = p.wiggle ? Math.sin(p.wiggle*20)*4 : 0;
  ctx.translate(wob, 0);
  ctx.fillStyle = '#fff';
  roundRect(p.x, p.y, p.w, p.h, 8); ctx.fill();
  ctx.strokeStyle = '#ff2d55'; ctx.lineWidth = 3;
  roundRect(p.x, p.y, p.w, p.h, 8); ctx.stroke();
  // title bar
  ctx.fillStyle = '#ff2d55';
  roundRect(p.x, p.y, p.w, 24, 8); ctx.fill();
  ctx.fillRect(p.x, p.y+12, p.w, 12);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Trebuchet MS'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(p.fake ? 'totally-real.exe' : 'AD — do not click', p.x+8, p.y+13);
  // X button
  ctx.fillStyle = '#1a1a1a';
  roundRect(p.x+p.w-24, p.y+3, 18, 18, 4); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Trebuchet MS'; ctx.textAlign='center';
  ctx.fillText('✕', p.x+p.w-15, p.y+13);
  if(p.fake){
    // fake mini bar stuck at 99%
    ctx.fillStyle = '#dfe6ff';
    roundRect(p.x+12, p.y+38, p.w-24, 14, 7); ctx.fill();
    ctx.fillStyle = '#00d4ff';
    roundRect(p.x+12, p.y+38, (p.w-24)*0.99, 14, 7); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 11px Trebuchet MS';
    ctx.fillText('99% — so close!', p.x+p.w/2, p.y+56);
  } else {
    ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 17px Trebuchet MS';
    ctx.fillText(p.title, p.x+p.w/2, p.y+48);
    ctx.font = 'bold 11px Trebuchet MS'; ctx.fillStyle = '#888';
    ctx.fillText('tap ✕ to close', p.x+p.w/2, p.y+70);
  }
  ctx.restore();
}
function drawChip(ch){
  ctx.save(); ctx.translate(ch.x, ch.y); ctx.rotate(Math.sin(ch.spin)*0.25);
  if(ch.golden){
    ctx.shadowColor = '#ffd60a'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#ffd60a';
    roundRect(-ch.r, -ch.r*0.6, ch.r*2, ch.r*1.2, 5); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#7a4a00'; ctx.font = 'bold 13px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('RAM+', 0, 1);
  } else {
    ctx.shadowColor = '#7bff5e'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#7bff5e';
    roundRect(-ch.r, -ch.r*0.6, ch.r*2, ch.r*1.2, 5); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0a3d16'; ctx.font = 'bold 11px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('RAM', 0, 1);
  }
  ctx.restore();
}
function drawFan(){
  if(!fan.on) return;
  ctx.save(); ctx.translate(fan.x, fan.y);
  ctx.fillStyle = '#2a1a4a'; circle(0,0,34);
  ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0,0,34,0,TAU); ctx.stroke();
  ctx.fillStyle = '#00d4ff';
  for(let i=0;i<3;i++){
    const a = fan.spin + i*TAU/3;
    ctx.beginPath(); ctx.ellipse(Math.cos(a)*14, Math.sin(a)*14, 13, 7, a, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#fff'; circle(0,0,7);
  ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 10px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('FAN', 0, 44);
  ctx.restore();
}
function drawCancel(){
  if(!cancelBtn.on) return;
  ctx.save();
  const wob = cancelBtn.wiggle ? Math.sin(cancelBtn.wiggle*20)*5 : 0;
  ctx.translate(cancelBtn.x + wob, cancelBtn.y);
  ctx.fillStyle = '#ff2d55';
  roundRect(-52, -18, 104, 36, 10); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; roundRect(-52, -18, 104, 36, 10); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('CANCEL', 0, 1);
  ctx.restore();
}
function drawHUD(){
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Trebuchet MS';
  ctx.fillText(Math.floor(pct) + '%', 18, 44);
  ctx.fillStyle = '#00d4ff'; ctx.font = 'bold 13px Trebuchet MS';
  ctx.fillText(rankFor(pct), 18, 68);
  ctx.textAlign = 'right'; ctx.fillStyle = timeLeft<=10 ? '#ff2d55' : '#fff';
  ctx.font = 'bold 26px Trebuchet MS';
  ctx.fillText(Math.ceil(timeLeft) + 's', W-18, 48);
  if(combo>=2){ ctx.fillStyle = '#7bff5e'; ctx.font = 'bold 18px Trebuchet MS'; ctx.fillText('COMBO x'+combo, W-18, 74); }
  ctx.fillStyle = '#ffffff88'; ctx.font = 'bold 12px Trebuchet MS'; ctx.textAlign='left';
  ctx.fillText('BEST ' + Math.floor(high) + '%', 18, 92);
  // heat gauge
  if(fan.on){
    ctx.fillStyle = '#2a1a4a'; roundRect(18, 100, 180, 12, 6); ctx.fill();
    ctx.fillStyle = heat>60 ? '#ff2d55' : '#ff9f1c';
    roundRect(18, 100, clamp(180*heat/100, 0, 180), 12, 6); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Trebuchet MS';
    ctx.fillText('HEAT — tap the FAN!', 18, 126);
  }
  ctx.restore();
}
function drawPopupsTxt(){
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const p of popupsTxt){
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.font = 'bold ' + p.size + 'px Trebuchet MS';
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 4;
    ctx.strokeText(p.txt, p.x, p.y);
    ctx.fillStyle = p.col; ctx.fillText(p.txt, p.x, p.y);
  }
  ctx.restore();
}
function drawParts(){
  for(const p of parts){ ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = p.col; circle(p.x, p.y, p.r); }
  ctx.globalAlpha = 1;
}
function drawTwistBanner(){
  if(twistMsgT<=0 || !twistMsg) return;
  ctx.save(); ctx.globalAlpha = clamp(twistMsgT, 0, 1);
  ctx.font = 'bold 30px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 6;
  ctx.strokeText(twistMsg, W/2, 300);
  ctx.fillStyle = '#ff9f1c'; ctx.fillText(twistMsg, W/2, 300);
  ctx.restore();
}
function drawBG(){
  ctx.fillStyle = '#101830'; ctx.fillRect(-20,-20,W+40,H+40);
  // spinning loader arcs
  ctx.save(); ctx.translate(44, 660); ctx.rotate(spinnerA);
  ctx.strokeStyle = '#00d4ff55'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*1.4); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#ffffff22'; ctx.font = 'bold 12px Trebuchet MS'; ctx.textAlign='left'; ctx.textBaseline='middle';
  const dots = '.'.repeat(1 + Math.floor(menuT*2)%3);
  ctx.fillText('buffering' + dots, 70, 660);
  // download arrows drifting down
  ctx.fillStyle = '#ffffff10'; ctx.font = 'bold 20px Trebuchet MS'; ctx.textAlign='center';
  for(let i=0;i<5;i++){
    const y = ((menuT*30 + i*140) % 760) - 20;
    ctx.fillText('↓', 30 + i*100, y);
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0) ctx.translate(rand(-shake,shake), rand(-shake,shake));
  drawBG();

  if(state==='menu'){
    // preview bar stuck at 99% with a smug face
    ctx.save();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font = 'bold 52px Trebuchet MS';
    ctx.fillStyle = '#00d4ff';
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 8;
    ctx.strokeText('99%', W/2, 150); ctx.fillText('99%', W/2, 150);
    ctx.font = 'bold 44px Trebuchet MS';
    ctx.fillStyle = '#fff';
    ctx.strokeText('LOADED!', W/2, 205); ctx.fillText('LOADED!', W/2, 205);
    // mini preview bar
    const px = 60, py = 280, pw = 360, ph = 40;
    ctx.fillStyle = '#0a0f22'; roundRect(px, py, pw, ph, 10); ctx.fill();
    ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 3; roundRect(px, py, pw, ph, 10); ctx.stroke();
    ctx.fillStyle = '#00d4ff'; roundRect(px+2, py+2, (pw-4)*0.99, ph-4, 8); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    circle(px+pw*0.99-14, py+ph/2-5, 2.5); circle(px+pw*0.99+2, py+ph/2-5, 2.5);
    ctx.beginPath(); ctx.arc(px+pw*0.99-6, py+ph/2+5, 6, 0.15*Math.PI, 0.85*Math.PI); ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=2.5; ctx.stroke();
    // virus peeking at the bar
    ctx.fillStyle = '#ff2d55'; circle(70, 250, 12);
    ctx.fillStyle = '#fff'; circle(66, 247, 3); circle(74, 247, 3);
    ctx.fillStyle = '#1a1a1a'; circle(66, 248, 1.5); circle(74, 248, 1.5);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Trebuchet MS';
    ctx.fillText('Tap the bar. Reach 100%. It fights back.', W/2, 380);
    ctx.fillStyle = '#7bff5e'; ctx.font = 'bold 18px Trebuchet MS';
    ctx.fillText('BEST ' + Math.floor(high) + '%' + (unlock ? '  •  RAINBOW BAR ✓' : ''), W/2, 420);
    ctx.fillStyle = '#00d4ff';
    roundRect(W/2-110, 460, 220, 56, 14); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 24px Trebuchet MS';
    ctx.fillText('▶ TAP TO PLAY', W/2, 489);
    ctx.fillStyle = '#ffffff88'; ctx.font = 'bold 14px Trebuchet MS';
    ctx.fillText('Tap bar = fill  •  Squash viruses', W/2, 556);
    ctx.fillText('Close popups  •  Cool the fan  •  Space = tap', W/2, 580);
    ctx.restore();
    ctx.restore();
    return;
  }

  // window frame
  ctx.fillStyle = '#0a0f22';
  roundRect(24, 130, W-48, 500, 12); ctx.fill();
  ctx.strokeStyle = '#2a3a6a'; ctx.lineWidth = 2;
  roundRect(24, 130, W-48, 500, 12); ctx.stroke();
  ctx.fillStyle = '#1c2a55';
  roundRect(24, 130, W-48, 30, 12); ctx.fill();
  ctx.fillRect(24, 146, W-48, 14);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Trebuchet MS'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('⬇ downloading_fun.exe', 36, 146);
  ctx.fillStyle = '#ff2d55'; circle(W-44, 146, 6);

  drawHUD();
  drawBar();
  for(const ch of chips) drawChip(ch);
  for(const v of viruses) drawVirus(v);
  for(const p of popups) drawPopupAd(p);
  drawFan();
  drawCancel();
  drawParts();
  drawPopupsTxt();
  drawTwistBanner();
  ctx.restore();

  if(state==='over' || state==='win'){
    ctx.save();
    ctx.fillStyle = 'rgba(11,6,24,0.85)'; ctx.fillRect(0,0,W,H);
    for(const p of confetti){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); }
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(state==='win'){
      ctx.font = 'bold 44px Trebuchet MS'; ctx.fillStyle = '#7bff5e';
      ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 8;
      ctx.strokeText('100% LOADED!', W/2, 220); ctx.fillText('100% LOADED!', W/2, 220);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Trebuchet MS';
      ctx.fillText('The bar gave up. You win.', W/2, 280);
    } else {
      ctx.font = 'bold 38px Trebuchet MS'; ctx.fillStyle = '#ff2d55';
      ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 8;
      ctx.strokeText('STUCK AT ' + Math.floor(pct) + '%!', W/2, 220);
      ctx.fillText('STUCK AT ' + Math.floor(pct) + '%!', W/2, 220);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 19px Trebuchet MS';
      const words = failLine.split(' ');
      let line1 = '', line2 = '';
      words.forEach(w=>{ if((line1+' '+w).trim().length <= 26) line1 = (line1+' '+w).trim(); else line2 = (line2+' '+w).trim(); });
      ctx.fillText(line1, W/2, 280); if(line2) ctx.fillText(line2, W/2, 306);
    }
    ctx.fillStyle = '#00d4ff'; ctx.font = 'bold 30px Trebuchet MS';
    ctx.fillText(Math.floor(pct) + '%  •  ' + rankFor(pct), W/2, 360);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Trebuchet MS';
    ctx.fillText('BEST COMBO x' + bestCombo + '   •   BEST ' + Math.floor(high) + '%', W/2, 398);
    if(unlock==='rainbow-bar'){ ctx.fillStyle = '#7bff5e'; ctx.fillText('🏆 RAINBOW BAR UNLOCKED!', W/2, 428); }
    ctx.fillStyle = copied ? '#7bff5e' : '#00d4ff';
    roundRect(W/2-120, 460, 240, 48, 12); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 19px Trebuchet MS';
    ctx.fillText(copied ? 'COPIED!' : '📋 COPY RESULT', W/2, 485);
    ctx.fillStyle = '#7b2ff7';
    roundRect(W/2-120, 524, 240, 52, 12); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Trebuchet MS';
    ctx.fillText('↻ PLAY AGAIN', W/2, 551);
    ctx.fillStyle = '#ffffff88'; ctx.font = 'bold 13px Trebuchet MS';
    ctx.fillText('tap R to restart', W/2, 600);
    ctx.restore();
  }
}

// ---------- input ----------
function posFromEvent(e){
  const r = cv.getBoundingClientRect();
  const sx = W / r.width, sy = H / r.height;
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return { x: (cx - r.left) * sx, y: (cy - r.top) * sy };
}
function shareText(){
  return "I got stuck at " + Math.floor(pct) + "% loading. The bar ran away. 99% LOADED! " + location.href;
}
cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  const p = posFromEvent(e);
  pointer.x = p.x; pointer.y = p.y;
  if(state==='menu'){ resetGame(); return; }
  if(state==='over' || state==='win'){
    if(p.y>=460 && p.y<=508 && Math.abs(p.x-W/2)<=120){
      const txt = shareText();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(()=>{ copied = true; copyT = 2; }).catch(()=>{ copied = true; copyT = 2; });
      } else { copied = true; copyT = 2; }
      return;
    }
    if(p.y>=524 && p.y<=576 && Math.abs(p.x-W/2)<=120){ resetGame(); return; }
    return;
  }
  // play: hit order — popup X, popup body, virus, chip, fan, cancel, bar, miss
  for(let i=popups.length-1;i>=0;i--){
    const pp = popups[i];
    if(p.x>=pp.x && p.x<=pp.x+pp.w && p.y>=pp.y && p.y<=pp.y+pp.h){
      if(p.x>=pp.x+pp.w-26 && p.y<=pp.y+24){
        popups.splice(i,1);
        popup(p.x, p.y-16, pp.fake ? "FAKE!" : "CLOSED!", '#7bff5e', 22);
        squashSnd(); burst(p.x, p.y, '#7bff5e', 8, 120);
        return;
      }
      pp.wiggle = 1;
      popup(pp.x+pp.w/2, pp.y-12, "NOPE.", '#ff2d55', 20);
      nopeSnd();
      return;
    }
  }
  for(const v of viruses){
    if(!v.dead && Math.hypot(p.x-v.x, p.y-v.y) <= v.r+8){
      v.dead = true;
      popup(v.x, v.y-24, "SQUASHED!", '#7bff5e', 24);
      squashSnd(); burst(v.x, v.y, '#ff2d55', 14, 180);
      return;
    }
  }
  for(const ch of chips){
    if(!ch.dead && Math.abs(p.x-ch.x)<=ch.r+10 && Math.abs(p.y-ch.y)<=ch.r+10){
      ch.dead = true;
      addPct(ch.golden?8:5, ch.x, ch.y-20, ch.golden ? "GOLD RAM! +8%" : "+5% RAM");
      ramSnd(); burst(ch.x, ch.y, '#7bff5e', 12, 160);
      return;
    }
  }
  if(fan.on && Math.hypot(p.x-fan.x, p.y-fan.y) <= 40){
    heat = clamp(heat - 18, 0, 100);
    popup(fan.x, fan.y-44, "COOL!", '#00d4ff', 22);
    fanSnd();
    return;
  }
  if(cancelBtn.on && Math.abs(p.x-cancelBtn.x)<=56 && Math.abs(p.y-cancelBtn.y)<=22){
    cancelBtn.x = rand(90, 390); cancelBtn.y = rand(180, 600);
    cancelBtn.wiggle = 1;
    popup(cancelBtn.x, cancelBtn.y-30, "NOPE.", '#ff2d55', 24);
    nopeSnd();
    return;
  }
  if(hitBar(p)){ tapBar(); return; }
  // miss: combo breaks
  if(combo>=3) popup(p.x, p.y-16, "WHIFF!", '#ff9f1c', 20);
  combo = 0;
  tapSnd();
});
cv.addEventListener('pointermove', e=>{
  const p = posFromEvent(e);
  pointer.x = p.x; pointer.y = p.y;
});
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(k===' '){ e.preventDefault(); if(state==='menu') resetGame(); else if(state==='play') tapBar(); }
  if(k==='r' && (state==='over'||state==='win'||state==='play')) resetGame();
});

// ---------- loop ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now-last)/1000); last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
