<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MOM'S SLIPPER! — Mom's slipper never misses. Until today.</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0d0b1e;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:system-ui,'Arial Black',Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  #wrap{position:relative;width:100%;max-width:480px;height:100%;max-height:860px}
  canvas{display:block;width:100%;height:100%;background:#2b1a12;cursor:pointer}
  .btn{position:absolute;top:8px;width:38px;height:38px;border:2px solid #ffd23e;border-radius:50%;background:rgba(13,11,30,.7);color:#fff;font-size:17px;line-height:34px;text-align:center;cursor:pointer;z-index:5}
  #pauseBtn{right:8px} #muteBtn{right:52px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="480" height="760"></canvas>
<div class="btn" id="muteBtn">♪</div>
<div class="btn" id="pauseBtn">II</div>
</div>
<script>
'use strict';
/* MOM'S SLIPPER! — slingshot physics: drag from Mom, release to throw
   the slipper at the kid. Kid ducks, jumps, hides behind the sofa/door.
   Twist: 12s PILLOW SHIELD! (slipper bounces off the pillow — hit while
   he peeks), 25s REVENGE! (kid throws toys back — tap them mid-air to
   swat, or Mom loses a slipper), 40s GOLDEN SLIPPER flies by (+50, +2),
   50s GRANDMA! (she throws her own slipper at the kid, 50/50).
   Ammo = slippers (5). Hit = +1 slipper back. Miss = slipper lost.
   0 slippers = game over. Survive 60s to win.
   Glow = golden slipper only (tap = good). Red angry = toys (swat them).
   Trend: "Slipper Missile" — mom's-slipper slingshot physics game,
   covered 2026-11-10 (tbreak.com); household-joke physics, 75 levels. */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 480, H = 760;
const GAME_URL = 'https://tuannx.github.io/daily-mini-games/games/moms-slipper.html';
const HS_KEY = 'moms-slipper-highscore';
const SKIN_KEY = 'moms-slipper-skin';

let AC = null, muted = false;
function beep(f, d, type, vol, slide){
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, AC.currentTime + d);
    g.gain.setValueAtTime(vol || 0.12, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + d);
  } catch(e){}
}
const sThrow = ()=>{ beep(300,.12,'sine',.12,700); };
const sHit   = ()=>{ beep(200,.08,'square',.14,90); beep(1200,.06,'sine',.08,1800); };
const sBounce= ()=>{ beep(180,.09,'square',.10,90); };
const sHurt  = ()=>{ [300,200,120].forEach((f,i)=>setTimeout(()=>beep(f,.14,'sawtooth',.12),i*80)); };
const sGold  = ()=>{ [1318,1568,2093,2637].forEach((f,i)=>setTimeout(()=>beep(f,.1,'sine',.1),i*50)); };
const sSwat  = ()=>{ beep(500,.08,'square',.11,900); };
const sNear  = ()=>{ beep(1200,.08,'sine',.08,1600); };
const sWin   = ()=>{ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,.14,'sine',.11),i*90)); };
const sStart = ()=>{ [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.1,'sine',.10),i*70)); };
const sTaunt = ()=>{ beep(800,.12,'sine',.08,1200); };
const sWarn  = ()=>{ beep(660,.12,'square',.07,440); };

const R = (a,b)=>a+Math.random()*(b-a);
const TAU = Math.PI*2;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const dist = (ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);

let best = +(localStorage.getItem(HS_KEY) || 0);
let skin = localStorage.getItem(SKIN_KEY) === '1';

// --- state ---
let state = 'title'; // title | play | pause | over | win
let score = 0, combo = 0, comboTimer = 0, timeLeft = 60, elapsed = 0;
let slippers = 5, hits = 0, misses = 0, swats = 0;
let popup = null, popupT = 0, popupCol = '#ffd23e';
let overLine = '';
let shake = 0;
let pillowDone = false, revengeDone = false, goldDone = false, grannyDone = false;
let gold = null, grannySlipper = null, grannyT = 0, toyT = 4;
let slipper = null; // flying player slipper
let toys = [];
let parts = [], floatTxts = [];
let aim = null; // {x,y} drag point
let dragStart = null;
let nearMissed = false;

const OVER_LINES = [
  'The kid is still laughing.',
  'Mom needs new slippers.',
  'Grounded. Forever.',
  'The pillow won.',
  'Grandma is disappointed.',
  '0 hits. The kid is a legend.',
];
const RANKS = [
  [0,'GROUNDED'],[80,'SLIPPER ROOKIE'],[200,'HALLWAY SNIPER'],[350,"MOM'S FAVORITE"],[500,'SLIPPER LEGEND']
];
function rankFor(s){ let r = RANKS[0][1]; for (const [t,n] of RANKS) if (s>=t) r = n; return r; }
function setPopup(t, col){ popup = t; popupT = 1.1; popupCol = col || '#ffd23e'; }
function floatTxt(x, y, t, col){ floatTxts.push({x, y, t, col: col||'#fff', life: 1}); }
function burst(x, y, col, n, spd){
  for (let i=0;i<(n||10);i++){
    const a = R(0,TAU), s = R(40, spd||160);
    parts.push({x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s-40, life: R(.4,.8), col, r: R(2,5), shape: Math.random()<.3?'star':'dot'});
  }
}
function feathers(x, y, n){
  for (let i=0;i<(n||10);i++){
    parts.push({x: x+R(-20,20), y: y+R(-14,14), vx: R(-40,40), vy: R(10,60), life: R(.8,1.4), col: '#fff', r: R(3,6), shape: 'feather'});
  }
}

// --- mom ---
const MOM = { x: 72, y: 540, arm: 0, dizzy: 0, face: '😤', squash: 0 };
// --- kid ---
const KID = { x: 385, y: 540, r: 36, mode: 'idle', modeT: 1.2, face: '😜',
              squash: 0, dizzy: 0, jumpV: 0, hideSpot: '', pillowUp: false, peekT: 0, pillowT: 0 };
// --- granny ---
const GRANNY = { x: 60, y: 210, face: '👵', active: false, arm: 0 };
// --- cat on couch (audience) ---
const CAT = { x: 250, y: 655, mood: '😺', jump: 0 };

function kidCenter(){
  // hitbox center depends on mode
  if (KID.mode === 'duck') return { x: KID.x, y: KID.y + 26, r: 26 };
  if (KID.mode === 'hide-sofa') return { x: KID.x, y: KID.y - 8, r: 18 };
  if (KID.mode === 'hide-door') return { x: KID.x + 14, y: KID.y - 6, r: 16 };
  if (KID.mode === 'jump') return { x: KID.x, y: KID.y - 60, r: 32 };
  return { x: KID.x, y: KID.y, r: 34 };
}
function pillowBox(){
  // pillow in front of kid when up
  return { x: KID.x - 34, y: KID.y - 58, w: 62, h: 76 };
}

function gameOver(){
  state = 'over';
  overLine = OVER_LINES[Math.floor(Math.random()*OVER_LINES.length)];
  if (score > best){ best = score; localStorage.setItem(HS_KEY, best); }
  if (score >= 300 && !skin){ skin = true; localStorage.setItem(SKIN_KEY, '1'); }
}
function winGame(){
  state = 'win';
  if (score > best){ best = score; localStorage.setItem(HS_KEY, best); }
  if (score >= 300 && !skin){ skin = true; localStorage.setItem(SKIN_KEY, '1'); }
  sWin();
}
function reset(){
  score = 0; combo = 0; comboTimer = 0; timeLeft = 60; elapsed = 0;
  slippers = 5; hits = 0; misses = 0; swats = 0;
  pillowDone = false; revengeDone = false; goldDone = false; grannyDone = false;
  gold = null; grannySlipper = null; grannyT = 0; toyT = 4; toys = [];
  slipper = null; parts = []; floatTxts = []; aim = null; dragStart = null;
  MOM.arm = 0; MOM.dizzy = 0; MOM.face = '😤';
  KID.mode = 'idle'; KID.modeT = 1.2; KID.face = '😜'; KID.squash = 0; KID.dizzy = 0;
  KID.pillowUp = false; KID.peekT = 0; KID.pillowT = 0; KID.x = 385;
  GRANNY.active = false; GRANNY.arm = 0; CAT.mood = '😺';
  state = 'play'; sStart();
}

// --- events (escalation timeline) ---
function timeline(){
  if (!pillowDone && elapsed >= 12){
    pillowDone = true;
    KID.pillowUp = true; KID.pillowT = 2.5;
    setPopup('PILLOW SHIELD!', '#ff4757'); sWarn(); shake = 8;
    floatTxt(KID.x, KID.y - 110, 'WAIT FOR THE PEEK!', '#ff4757');
  }
  if (!revengeDone && elapsed >= 25){
    revengeDone = true;
    setPopup('REVENGE!', '#ff4757'); sWarn(); shake = 10;
    floatTxt(KID.x, KID.y - 110, 'TAP TOYS TO SWAT!', '#ff4757');
    toyT = 1.2;
  }
  if (!goldDone && elapsed >= 40){
    goldDone = true;
    gold = { x: -60, y: 180, vx: 240, caught: false };
    setPopup('GOLDEN SLIPPER!', '#ffd23e'); sGold();
  }
  if (!grannyDone && elapsed >= 50){
    grannyDone = true;
    GRANNY.active = true; grannyT = 1.5;
    setPopup('GRANDMA!', '#ff6bff'); sTaunt(); shake = 8;
    floatTxt(GRANNY.x, GRANNY.y - 60, 'SHE HAS TWO!', '#ff6bff');
  }
}

// --- kid AI ---
function kidAI(dt){
  if (KID.dizzy > 0){ KID.dizzy -= dt; return; }
  KID.modeT -= dt;
  // pillow logic (after 12s): up most of the time, drops to peek
  if (pillowDone){
    if (KID.pillowUp){
      KID.pillowT -= dt;
      if (KID.pillowT <= 0){ KID.pillowUp = false; KID.peekT = 1.1; KID.face = '😝'; sTaunt(); }
    } else {
      KID.peekT -= dt;
      if (KID.peekT <= 0){ KID.pillowUp = true; KID.pillowT = R(2.2, 3.2); KID.face = '😜'; }
    }
  }
  if (KID.modeT > 0) return;
  // pick next move; harder as time passes
  const roll = Math.random();
  const hideChance = elapsed > 18 ? .3 : .15;
  if (roll < hideChance){
    KID.mode = Math.random() < .5 ? 'hide-sofa' : 'hide-door';
    KID.hideSpot = KID.mode;
    KID.modeT = R(1.6, 2.4);
    KID.x = KID.mode === 'hide-sofa' ? 330 : 415;
    KID.face = '🫣';
  } else if (roll < hideChance + .3){
    KID.mode = 'duck'; KID.modeT = R(.8, 1.4); KID.face = '😝';
  } else if (roll < hideChance + .55){
    KID.mode = 'jump'; KID.modeT = .7; KID.jumpV = -420; KID.face = '😆';
  } else {
    KID.mode = 'idle'; KID.modeT = R(.9, 1.8); KID.x = 385; KID.face = Math.random() < .5 ? '😜' : '😛';
  }
  if (KID.mode !== 'hide-sofa' && KID.mode !== 'hide-door') KID.x = 385;
}

// --- throwing ---
function launchSlipper(power, ang){
  slipper = {
    x: MOM.x + 30, y: MOM.y - 40,
    vx: Math.cos(ang) * power, vy: Math.sin(ang) * power,
    rot: 0, vr: R(6, 10) * (Math.random() < .5 ? -1 : 1),
    bounces: 0, nearMissed: false, granny: false
  };
  slippers--;
  MOM.arm = .35; MOM.face = '😤';
  sThrow();
}
function launchGrannySlipper(){
  GRANNY.arm = .4;
  const hit = Math.random() < .5;
  const tx = hit ? KID.x : KID.x + R(-90, 90);
  const ty = KID.y - 20;
  const dx = tx - (GRANNY.x + 20), dy = ty - (GRANNY.y - 20);
  const t = .9;
  grannySlipper = {
    x: GRANNY.x + 20, y: GRANNY.y - 20,
    vx: dx / t, vy: dy / t - 0.5 * 900 * t,
    rot: 0, vr: 8, bounces: 0, granny: true, willHit: hit
  };
  sThrow();
}
function kidHit(px, py, byGranny){
  hits++;
  combo++; comboTimer = 3;
  const pts = 10 + Math.min(combo, 10) * 2;
  score += pts;
  KID.dizzy = .9; KID.face = '😵'; KID.squash = 1;
  burst(px, py, '#ffd23e', 14, 200);
  burst(px, py, '#ff4757', 8, 150);
  floatTxt(px, py - 60, '+' + pts + (byGranny ? ' GRANNY!' : ''), '#ffd23e');
  if (!byGranny) slippers = Math.min(5, slippers + 1);
  CAT.jump = 1; CAT.mood = '😱';
  setTimeout(()=>{ CAT.mood = '😺'; }, 900);
  sHit(); shake = 8;
  if (KID.dizzy > 0 && Math.random() < .4) setPopup(['POW!','BULLSEYE!','GOTCHA!'][Math.floor(Math.random()*3)], '#00ff88');
}
function slipperLost(reason){
  misses++;
  combo = 0;
  floatTxt(240, 300, reason || 'MISS!', '#ff4757');
  if (slippers <= 0) gameOver();
}
function momHit(){
  slippers--;
  MOM.dizzy = .9; MOM.face = '😵'; shake = 12;
  combo = 0;
  burst(MOM.x + 20, MOM.y - 40, '#ff4757', 12, 170);
  floatTxt(MOM.x + 40, MOM.y - 90, '-1 SLIPPER!', '#ff4757');
  KID.face = '🤣'; CAT.jump = 1; CAT.mood = '😹';
  sHurt();
  if (slippers <= 0) gameOver();
}

// --- update ---
let last = performance.now();
function update(dt){
  if (state !== 'play') return;
  elapsed += dt; timeLeft = Math.max(0, 60 - elapsed);
  if (timeLeft <= 0){ winGame(); return; }
  timeline();
  kidAI(dt);

  if (MOM.arm > 0) MOM.arm -= dt;
  if (MOM.dizzy > 0){ MOM.dizzy -= dt; if (MOM.dizzy <= 0) MOM.face = '😤'; }
  if (MOM.squash > 0) MOM.squash -= dt * 3;
  if (KID.squash > 0) KID.squash -= dt * 3;
  if (GRANNY.arm > 0) GRANNY.arm -= dt;
  if (CAT.jump > 0) CAT.jump -= dt * 2;
  if (comboTimer > 0){ comboTimer -= dt; if (comboTimer <= 0) combo = 0; }

  // kid jump physics
  if (KID.mode === 'jump'){
    KID.y += KID.jumpV * dt; KID.jumpV += 900 * dt;
    if (KID.y >= 540){ KID.y = 540; KID.mode = 'idle'; KID.modeT = .6; KID.face = '😜'; }
  }

  // player slipper physics
  if (slipper) stepSlipper(slipper, dt, false);
  if (grannySlipper) stepSlipper(grannySlipper, dt, true);

  // toys (kid revenge)
  if (revengeDone){
    toyT -= dt;
    if (toyT <= 0){
      toyT = R(3.2, 4.6) / (1 + elapsed * .006);
      const kinds = ['🧸','🧦','🧱'];
      const k = kinds[Math.floor(Math.random()*kinds.length)];
      const t = 1.15;
      const dx = (MOM.x + 20) - KID.x, dy = (MOM.y - 40) - (KID.y - 30);
      toys.push({ x: KID.x, y: KID.y - 30, vx: dx / t, vy: dy / t - .5 * 900 * t,
                  rot: 0, vr: R(4, 8), kind: k, life: 2.2, hit: false });
      KID.face = '😈'; sTaunt();
      setTimeout(()=>{ if (KID.face === '😈') KID.face = '😜'; }, 700);
    }
  }
  for (let i = toys.length - 1; i >= 0; i--){
    const t = toys[i];
    t.x += t.vx * dt; t.y += t.vy * dt; t.vy += 900 * dt; t.rot += t.vr * dt; t.life -= dt;
    if (dist(t.x, t.y, MOM.x + 20, MOM.y - 40) < 46){
      toys.splice(i, 1); momHit(); continue;
    }
    if (t.life <= 0 || t.y > H + 40 || t.x < -40){ toys.splice(i, 1); }
  }

  // granny auto-throws
  if (GRANNY.active && !grannySlipper){
    grannyT -= dt;
    if (grannyT <= 0){ launchGrannySlipper(); grannyT = R(2.6, 3.6); }
  }

  // golden slipper
  if (gold){
    gold.x += gold.vx * dt;
    if (gold.x > W + 80) gold = null;
  }

  // particles / floats / popup / shake
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.shape === 'feather' ? 40 : 300) * dt;
    p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = floatTxts.length - 1; i >= 0; i--){
    const f = floatTxts[i]; f.y -= 40 * dt; f.life -= dt * .9;
    if (f.life <= 0) floatTxts.splice(i, 1);
  }
  if (popupT > 0) popupT -= dt;
  if (shake > 0) shake *= Math.pow(.001, dt);
}
function stepSlipper(s, dt, isGranny){
  s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 900 * dt; s.rot += s.vr * dt;
  const kc = kidCenter();
  // pillow block (player slipper only, while pillow up)
  if (!isGranny && pillowDone && KID.pillowUp){
    const pb = pillowBox();
    if (s.x > pb.x && s.x < pb.x + pb.w && s.y > pb.y && s.y < pb.y + pb.h){
      feathers(pb.x + pb.w / 2, pb.y + pb.h / 2, 12);
      setPopup('BLOCKED!', '#ff4757'); sBounce(); shake = 5;
      floatTxt(pb.x + 30, pb.y - 20, 'THE PILLOW!', '#fff');
      if (isGranny) grannySlipper = null; else { slipper = null; slipperLost('BLOCKED!'); }
      return;
    }
  }
  // kid hit
  if (dist(s.x, s.y, kc.x, kc.y) < kc.r + 14){
    kidHit(kc.x, kc.y, isGranny);
    if (isGranny) grannySlipper = null; else slipper = null;
    return;
  }
  // near-miss (player slipper passes close to kid)
  if (!isGranny && !s.nearMissed && dist(s.x, s.y, kc.x, kc.y) < kc.r + 46 && s.vx > 0){
    s.nearMissed = true;
    score += 5; floatTxt(kc.x, kc.y - 70, 'SO CLOSE! +5', '#ffd23e'); sNear();
  }
  // sofa block (kid hides behind it — slipper hits sofa, not kid)
  if (s.y > 640 && s.x > 300 && s.x < 420 && s.vy > 0){
    burst(s.x, s.y, '#6c5ce7', 8, 120);
    setPopup('THE SOFA!', '#a29bfe'); sBounce();
    if (isGranny) grannySlipper = null; else { slipper = null; slipperLost('SOFA ATE IT!'); }
    return;
  }
  // floor bounce
  if (s.y > 712){
    s.y = 712; s.vy *= -.45; s.vx *= .7; s.bounces++;
    burst(s.x, s.y, '#fff', 4, 80);
    if (s.bounces >= 2){
      if (isGranny) grannySlipper = null; else { slipper = null; slipperLost('TOO SHORT!'); }
      return;
    }
  }
  // right wall / off-screen
  if (s.x > W + 30 || s.x < -40 || s.y < -60){
    if (isGranny) grannySlipper = null;
    else { slipper = null; slipperLost('OVER THE FENCE!'); }
  }
}

// --- drawing ---
function drawSlipperShape(x, y, rot, scale, golden){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.fillStyle = golden ? '#ffd23e' : (skin ? '#ff9ff3' : '#ff6b6b');
  ctx.beginPath(); ctx.ellipse(0, 0, 26, 11, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-8, -6, 14, 9, -.2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(8, -2, 8, 5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2d3436';
  ctx.beginPath(); ctx.arc(-18, 2, 2.5, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawMom(){
  const sq = MOM.squash;
  ctx.save();
  ctx.translate(MOM.x, MOM.y);
  // legs
  ctx.strokeStyle = '#5b4bc4'; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-8, 10); ctx.lineTo(-14, 44); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8, 10); ctx.lineTo(14, 44); ctx.stroke();
  // dress
  ctx.fillStyle = '#e17055';
  ctx.beginPath(); ctx.moveTo(-26, -6); ctx.lineTo(26, -6); ctx.lineTo(34, 22); ctx.lineTo(-34, 22); ctx.closePath(); ctx.fill();
  // arm (wind-up when aiming/throwing)
  const armAng = MOM.arm > 0 ? -1.2 : (aim ? -0.9 : -0.2);
  ctx.save();
  ctx.translate(20, -2); ctx.rotate(armAng);
  ctx.strokeStyle = '#f5c396'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(30, 0); ctx.stroke();
  ctx.fillStyle = '#f5c396'; ctx.beginPath(); ctx.arc(32, 0, 7, 0, TAU); ctx.fill();
  ctx.restore();
  // head + hair bun
  ctx.fillStyle = '#f5c396';
  ctx.beginPath(); ctx.arc(0, -34, 22, 0, TAU); ctx.fill();
  ctx.fillStyle = '#6c4a2f';
  ctx.beginPath(); ctx.arc(0, -40, 22, Math.PI, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -58, 10, 0, TAU); ctx.fill();
  // face
  ctx.font = '26px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(MOM.face, 0, -32);
  if (MOM.dizzy > 0){ ctx.font = '18px serif'; ctx.fillText('💫', -26, -52); ctx.fillText('💫', 26, -56); }
  // slipper stock icon
  ctx.font = '16px serif';
  ctx.fillText('🩴', -30, -66);
  ctx.restore();
}
function drawKid(){
  const kc = kidCenter();
  const sq = KID.squash;
  const hidden = KID.mode === 'hide-sofa' || KID.mode === 'hide-door';
  ctx.save();
  // body (squash on hit)
  const w = 30 * (1 + sq * .3), h = 44 * (1 - sq * .25);
  ctx.fillStyle = '#00b894';
  ctx.beginPath(); ctx.ellipse(KID.x, KID.y + 18, w, h * .7, 0, 0, TAU); ctx.fill();
  // legs
  ctx.strokeStyle = '#2d3436'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  const duck = KID.mode === 'duck';
  ctx.beginPath(); ctx.moveTo(KID.x - 8, KID.y + 34); ctx.lineTo(KID.x - 12, KID.y + (duck ? 56 : 62)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(KID.x + 8, KID.y + 34); ctx.lineTo(KID.x + 12, KID.y + (duck ? 56 : 62)); ctx.stroke();
  // head
  ctx.fillStyle = '#f5c396';
  ctx.beginPath(); ctx.arc(KID.x, KID.y - (duck ? 6 : 22), 20, 0, TAU); ctx.fill();
  // hair
  ctx.fillStyle = '#2d3436';
  ctx.beginPath(); ctx.arc(KID.x, KID.y - (duck ? 10 : 26), 20, Math.PI, TAU); ctx.fill();
  // face
  ctx.font = '24px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(KID.face, KID.x, KID.y - (duck ? 4 : 20));
  if (KID.dizzy > 0){ ctx.font = '16px serif'; ctx.fillText('💫', KID.x - 24, KID.y - 44); ctx.fillText('💫', KID.x + 24, KID.y - 48); }
  // pillow shield
  if (pillowDone && KID.pillowUp){
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.roundRect(KID.x - 34, KID.y - 58, 62, 76, 12); ctx.fill();
    ctx.strokeStyle = '#dfe6e9'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(KID.x - 34, KID.y - 58, 62, 76, 12); ctx.stroke();
    ctx.font = '20px serif'; ctx.fillText('🛡️', KID.x - 3, KID.y - 20);
  }
  if (pillowDone && !KID.pillowUp){
    // pillow lowered — peek face
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.roundRect(KID.x - 34, KID.y + 30, 62, 30, 10); ctx.fill();
    ctx.font = 'bold 13px Arial'; ctx.fillStyle = '#ff4757'; ctx.textAlign = 'center';
    ctx.fillText('PEEK!', KID.x - 3, KID.y + 82);
  }
  ctx.restore();
}
function drawGranny(){
  ctx.save();
  ctx.translate(GRANNY.x, GRANNY.y);
  ctx.fillStyle = '#a29bfe';
  ctx.beginPath(); ctx.ellipse(0, 10, 26, 30, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f5c396';
  ctx.beginPath(); ctx.arc(0, -28, 20, 0, TAU); ctx.fill();
  ctx.fillStyle = '#dfe6e9';
  ctx.beginPath(); ctx.arc(0, -34, 20, Math.PI, TAU); ctx.fill();
  ctx.font = '24px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('😤', 0, -26);
  const armAng = GRANNY.arm > 0 ? -1.2 : -0.2;
  ctx.save(); ctx.translate(18, 0); ctx.rotate(armAng);
  ctx.strokeStyle = '#f5c396'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(26, 0); ctx.stroke();
  ctx.restore();
  ctx.restore();
}
function drawCat(){
  const j = CAT.jump > 0 ? Math.sin(CAT.jump * Math.PI) * 14 : 0;
  ctx.save();
  ctx.translate(CAT.x, CAT.y - j);
  ctx.fillStyle = '#ffa502';
  ctx.beginPath(); ctx.ellipse(0, 0, 26, 16, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(22, -10, 13, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(12, -20); ctx.lineTo(10, -30); ctx.lineTo(18, -22); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(26, -20); ctx.lineTo(28, -30); ctx.lineTo(33, -21); ctx.closePath(); ctx.fill();
  ctx.font = '16px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(CAT.mood, 22, -8);
  ctx.strokeStyle = '#ffa502'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-24, 0); ctx.quadraticCurveTo(-36, -12, -30, -22); ctx.stroke();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > .3) ctx.translate(R(-shake, shake), R(-shake, shake));

  // --- living room background ---
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#3d2b1f'); bg.addColorStop(.6, '#2b1a12'); bg.addColorStop(1, '#1a0f08');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
  // window + sun
  ctx.fillStyle = '#5b4636'; ctx.fillRect(150, 40, 180, 110);
  ctx.fillStyle = '#ffeaa7';
  ctx.beginPath(); ctx.arc(280, 82, 26, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5b4636';
  ctx.fillRect(232, 40, 8, 110); ctx.fillRect(150, 90, 180, 8);
  // picture frames
  ctx.fillStyle = '#e17055'; ctx.fillRect(30, 60, 70, 46);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
  ctx.fillText('HOME', 65, 80); ctx.fillText('SWEET HOME', 65, 94);
  ctx.fillStyle = '#00b894'; ctx.fillRect(380, 60, 70, 46);
  ctx.fillStyle = '#fff'; ctx.fillText('NO', 415, 78); ctx.fillText('RUNNING!', 415, 92);
  // rug
  ctx.fillStyle = '#6c5ce7'; ctx.beginPath(); ctx.ellipse(240, 700, 200, 34, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#a29bfe'; ctx.beginPath(); ctx.ellipse(240, 700, 150, 24, 0, 0, TAU); ctx.fill();
  // floor
  ctx.fillStyle = '#170d08'; ctx.fillRect(0, 712, W, 48);
  // door (kid hide spot)
  ctx.fillStyle = '#8d6e3f'; ctx.fillRect(424, 420, 56, 292);
  ctx.fillStyle = '#6b4f2a'; ctx.fillRect(432, 430, 40, 272);
  ctx.fillStyle = '#ffd23e'; ctx.beginPath(); ctx.arc(436, 570, 5, 0, TAU); ctx.fill();
  // sofa (kid hide spot + cat)
  ctx.fillStyle = '#6c5ce7'; ctx.fillRect(280, 640, 150, 60);
  ctx.fillStyle = '#a29bfe'; ctx.fillRect(280, 628, 150, 18);
  ctx.fillStyle = '#5b4bc4'; ctx.fillRect(280, 700, 150, 12);
  drawCat();
  // lamp
  ctx.strokeStyle = '#ffd23e'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(140, 640); ctx.lineTo(140, 700); ctx.stroke();
  ctx.fillStyle = '#ffd23e';
  ctx.beginPath(); ctx.moveTo(118, 640); ctx.lineTo(162, 640); ctx.lineTo(152, 612); ctx.lineTo(128, 612); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,210,62,.25)';
  ctx.beginPath(); ctx.arc(140, 626, 40, 0, TAU); ctx.fill();

  // granny (upper-left, after 50s)
  if (GRANNY.active) drawGranny();

  // golden slipper (glow = good)
  if (gold){
    ctx.save();
    ctx.shadowColor = '#ffd23e'; ctx.shadowBlur = 26;
    drawSlipperShape(gold.x, gold.y + Math.sin(performance.now() / 200) * 6, Math.sin(performance.now() / 300) * .4, 1.2, true);
    ctx.restore();
    ctx.font = 'bold 13px Arial'; ctx.fillStyle = '#ffd23e'; ctx.textAlign = 'center';
    ctx.fillText('+50  +2 🩴', gold.x, gold.y - 40);
  }

  drawMom();
  drawKid();

  // flying slippers
  if (slipper){
    ctx.save();
    ctx.shadowColor = skin ? '#ff9ff3' : '#ff6b6b'; ctx.shadowBlur = 10;
    drawSlipperShape(slipper.x, slipper.y, slipper.rot, 1, false);
    ctx.restore();
  }
  if (grannySlipper){
    ctx.save();
    ctx.shadowColor = '#ff6bff'; ctx.shadowBlur = 10;
    drawSlipperShape(grannySlipper.x, grannySlipper.y, grannySlipper.rot, .9, false);
    ctx.restore();
  }
  // toys flying back
  for (const t of toys){
    ctx.save();
    ctx.translate(t.x, t.y); ctx.rotate(t.rot);
    ctx.font = '30px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t.kind, 0, 0);
    ctx.font = 'bold 12px Arial'; ctx.fillStyle = '#ff4757';
    ctx.fillText('😠', 0, -24);
    ctx.restore();
  }

  // aim trajectory preview
  if (aim && state === 'play' && !slipper){
    const dx = MOM.x + 30 - aim.x, dy = (MOM.y - 40) - aim.y;
    const power = clamp(Math.hypot(dx, dy) * 1.6, 0, 460);
    const ang = Math.atan2(dy, dx);
    const vx = Math.cos(ang) * power, vy = Math.sin(ang) * power;
    ctx.fillStyle = '#ffd23e';
    for (let i = 1; i <= 10; i++){
      const t = i * .09;
      const px = MOM.x + 30 + vx * t, py = MOM.y - 40 + vy * t + .5 * 900 * t * t;
      ctx.globalAlpha = 1 - i / 12;
      ctx.beginPath(); ctx.arc(px, py, 4, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // pull-back band
    ctx.strokeStyle = 'rgba(255,210,62,.6)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(MOM.x + 30, MOM.y - 40); ctx.lineTo(aim.x, aim.y); ctx.stroke();
    ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
    ctx.fillText('POWER ' + Math.round(power / 460 * 100) + '%', MOM.x + 30, MOM.y - 90);
  }

  // particles
  for (const p of parts){
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.col;
    if (p.shape === 'star'){ ctx.font = p.r * 3 + 'px serif'; ctx.textAlign = 'center'; ctx.fillText('⭐', p.x, p.y); }
    else if (p.shape === 'feather'){ ctx.font = p.r * 3 + 'px serif'; ctx.textAlign = 'center'; ctx.fillText('🪶', p.x, p.y); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  // floating texts
  for (const f of floatTxts){
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center';
    ctx.fillStyle = f.col; ctx.fillText(f.t, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // --- HUD ---
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, 52);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 20px Arial';
  ctx.fillText('⭐ ' + score, 12, 20);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Arial';
  ctx.fillText('BEST ' + best, 12, 40);
  ctx.textAlign = 'center';
  ctx.fillStyle = combo > 1 ? '#ff6bff' : '#fff';
  ctx.font = 'bold 18px Arial';
  ctx.fillText(combo > 1 ? 'COMBO x' + combo : rankFor(score), W / 2, 20);
  ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 13px Arial';
  ctx.fillText('⏱ ' + Math.ceil(timeLeft) + 's', W / 2, 40);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 16px Arial';
  ctx.fillText('🩴'.repeat(Math.max(0, slippers)), W - 12, 26);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial';
  ctx.fillText(slippers + ' LEFT', W - 12, 44);
  // time bar
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(0, 52, W, 5);
  ctx.fillStyle = timeLeft > 10 ? '#00ff88' : '#ff4757';
  ctx.fillRect(0, 52, W * (timeLeft / 60), 5);

  // popup
  if (popupT > 0){
    ctx.globalAlpha = Math.min(1, popupT * 2);
    ctx.textAlign = 'center'; ctx.font = 'bold 34px Arial';
    ctx.fillStyle = popupCol;
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 6;
    const py = 300 + Math.sin(performance.now() / 90) * 3;
    ctx.strokeText(popup, W / 2, py); ctx.fillText(popup, W / 2, py);
    ctx.globalAlpha = 1;
  }

  // --- screens ---
  if (state === 'title'){
    ctx.fillStyle = 'rgba(13,11,30,.72)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 44px Arial'; ctx.fillStyle = '#ffd23e';
    ctx.fillText("MOM'S", W / 2, 200);
    ctx.fillText('SLIPPER!', W / 2, 252);
    ctx.font = '44px serif'; ctx.fillText('🩴😤', W / 2, 312);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 17px Arial';
    ctx.fillText("Mom's slipper never misses. Until today.", W / 2, 362);
    ctx.fillStyle = '#a29bfe'; ctx.font = '15px Arial';
    ctx.fillText('Drag back, release to THROW', W / 2, 394);
    ctx.fillText('Hit the kid. Dodge the toys. 5 slippers.', W / 2, 418);
    ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 20px Arial';
    ctx.fillText('▶ TAP TO THROW', W / 2, 482 + Math.sin(performance.now() / 300) * 4);
    if (best > 0){ ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Arial'; ctx.fillText('BEST ' + best + '  •  ' + rankFor(best), W / 2, 522); }
    if (skin){ ctx.font = '16px serif'; ctx.fillText('🌸 Flower slipper unlocked (300+ pts)', W / 2, 548); }
  }
  if (state === 'pause'){
    ctx.fillStyle = 'rgba(13,11,30,.7)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 34px Arial';
    ctx.fillText('PAUSED', W / 2, 360);
    ctx.font = '16px Arial'; ctx.fillText('Tap to resume', W / 2, 400);
  }
  if (state === 'over' || state === 'win'){
    ctx.fillStyle = 'rgba(13,11,30,.8)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = '44px serif';
    ctx.fillText(state === 'win' ? '🏆' : '😹', W / 2, 220);
    ctx.font = 'bold 36px Arial';
    ctx.fillStyle = state === 'win' ? '#00ff88' : '#ff4757';
    ctx.fillText(state === 'win' ? 'KID SURVIVED?!' : 'OUT OF SLIPPERS!', W / 2, 280);
    ctx.fillStyle = '#fff'; ctx.font = '17px Arial';
    ctx.fillText(overLine || 'The kid demands a rematch.', W / 2, 322);
    ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 26px Arial';
    ctx.fillText('SCORE ' + score, W / 2, 372);
    ctx.fillStyle = '#ff6bff'; ctx.font = 'bold 18px Arial';
    ctx.fillText('RANK: ' + rankFor(score), W / 2, 404);
    ctx.fillStyle = '#fff'; ctx.font = '15px Arial';
    ctx.fillText('Hits ' + hits + '  •  Misses ' + misses + '  •  Swats ' + swats, W / 2, 434);
    ctx.fillText('BEST ' + best, W / 2, 458);
    if (score >= 300) { ctx.fillStyle = '#ffd23e'; ctx.fillText('🌸 FLOWER SLIPPER UNLOCKED!', W / 2, 484); }
    drawBtn(W / 2 - 130, 520, 260, 48, '#00ff88', '#06281a', '↻ THROW AGAIN');
    drawBtn(W / 2 - 130, 580, 260, 48, '#ffd23e', '#3a2a00', '📋 COPY RESULT');
    ctx.fillStyle = '#a29bfe'; ctx.font = '13px Arial';
    ctx.fillText('Tap anywhere else to restart', W / 2, 660);
  }
  ctx.restore();
}
function drawBtn(x, y, w, h, bg, fg, label){
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill();
  ctx.fillStyle = fg; ctx.font = 'bold 17px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  ctx.textBaseline = 'alphabetic';
}

// --- input ---
function toGame(e){
  const r = cv.getBoundingClientRect();
  const cx = (e.clientX - r.left) * (W / r.width);
  const cy = (e.clientY - r.top) * (H / r.height);
  return { x: cx, y: cy };
}
function onDown(e){
  e.preventDefault();
  const p = toGame(e);
  if (state === 'title'){ reset(); return; }
  if (state === 'pause'){ state = 'play'; return; }
  if (state === 'over' || state === 'win'){
    if (p.x > W / 2 - 130 && p.x < W / 2 + 130 && p.y > 580 && p.y < 628){
      copyResult(); return;
    }
    reset(); return;
  }
  if (state !== 'play') return;
  dragStart = p;
  aim = p;
}
function onMove(e){
  if (!dragStart || state !== 'play') return;
  e.preventDefault();
  aim = toGame(e);
}
function onUp(e){
  if (!dragStart || state !== 'play'){ dragStart = null; aim = null; return; }
  e.preventDefault();
  const p = toGame(e);
  const moved = dist(p.x, p.y, dragStart.x, dragStart.y);
  // small movement = tap: check golden slipper / toys
  if (moved < 12){
    if (gold && dist(p.x, p.y, gold.x, gold.y) < 55){
      gold = null; score += 50; slippers = Math.min(5, slippers + 2);
      floatTxt(W / 2, 240, '+50 GOLD! +2 🩴', '#ffd23e');
      setPopup('GOLDEN!', '#ffd23e'); sGold();
      burst(W / 2, 240, '#ffd23e', 16, 180);
      dragStart = null; aim = null; return;
    }
    for (let i = 0; i < toys.length; i++){
      const t = toys[i];
      if (dist(p.x, p.y, t.x, t.y) < 44){
        toys.splice(i, 1); swats++; score += 5; combo++; comboTimer = 3;
        burst(t.x, t.y, '#00ff88', 10, 150);
        floatTxt(t.x, t.y - 26, 'SWATTED! +5', '#00ff88');
        sSwat(); dragStart = null; aim = null; return;
      }
    }
    dragStart = null; aim = null; return;
  }
  // drag release = throw (only if no slipper in flight and ammo left)
  if (!slipper && slippers > 0){
    const dx = MOM.x + 30 - p.x, dy = (MOM.y - 40) - p.y;
    const power = clamp(Math.hypot(dx, dy) * 1.6, 80, 460);
    const ang = Math.atan2(dy, dx);
    // only throw rightward-ish
    if (dx > 10) launchSlipper(power, ang);
  }
  dragStart = null; aim = null;
}
function copyResult(){
  const txt = 'I scored ' + score + " in MOM'S SLIPPER! (" + rankFor(score) + ') — ' + overLine + ' ' + GAME_URL;
  const done = ()=>{ setPopup('COPIED!', '#00ff88'); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>{ fallbackCopy(txt); done(); });
  } else { fallbackCopy(txt); done(); }
}
function fallbackCopy(t){
  const ta = document.createElement('textarea');
  ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}
cv.addEventListener('pointerdown', onDown);
cv.addEventListener('pointermove', onMove);
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', ()=>{ dragStart = null; aim = null; });
document.getElementById('pauseBtn').addEventListener('click', ()=>{
  if (state === 'play') state = 'pause';
  else if (state === 'pause') state = 'play';
});
document.getElementById('muteBtn').addEventListener('click', function(){
  muted = !muted; this.textContent = muted ? '✕' : '♪';
});
window.addEventListener('keydown', (e)=>{
  if (e.code === 'Space'){
    e.preventDefault();
    if (state === 'title' || state === 'over' || state === 'win'){ reset(); return; }
    if (state === 'play' && !slipper && slippers > 0){
      // quick throw at the kid's current spot
      const kc = kidCenter();
      const dx = kc.x - (MOM.x + 30), dy = kc.y - (MOM.y - 40);
      const d = Math.hypot(dx, dy);
      const t = d / 380;
      const vx = dx / t, vy = dy / t - .5 * 900 * t;
      slipper = { x: MOM.x + 30, y: MOM.y - 40, vx, vy, rot: 0, vr: 8, bounces: 0, nearMissed: false, granny: false };
      slippers--; MOM.arm = .35; sThrow();
    }
  }
  if (e.code === 'KeyP'){ if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play'; }
});

// --- loop ---
function loop(t){
  const dt = Math.min(.05, (t - last) / 1000);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
