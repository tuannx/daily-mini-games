<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FRIDGE TETRIS! — Daily Mini-Games</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#070714;color:#e2e8f0;font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:14px 8px;-webkit-user-select:none;user-select:none;touch-action:none}
  h1{font-size:clamp(24px,6vw,36px);background:linear-gradient(90deg,#22d3ee,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
  .hook{color:#facc15;font-weight:700;font-size:15px;margin:4px 0 8px;text-align:center}
  #wrap{position:relative;width:min(94vw,420px)}
  canvas{width:100%;display:block;border-radius:16px;border:2px solid rgba(34,211,238,.45);background:#0b1226;box-shadow:0 0 34px rgba(34,211,238,.25)}
  .hud{display:flex;justify-content:space-between;width:min(94vw,420px);font-weight:800;font-size:15px;margin:8px 0;color:#e2e8f0}
  .hud span b{color:#22d3ee}
  button{background:linear-gradient(90deg,#0891b2,#db2777);color:#fff;border:0;border-radius:999px;padding:11px 22px;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px;min-height:44px}
  button:active{transform:scale(.96)}
  .small{font-size:12px;color:#94a3b8;margin-top:8px;text-align:center}
  a{color:#22d3ee}
</style>
</head>
<body>
<h1>🧊 FRIDGE TETRIS!</h1>
<div class="hook">Stack the leftovers. Dodge the spoiled milk.</div>
<div class="hud"><span>⭐ <b id="score">0</b></span><span>🔥 <b id="combo">x1</b></span><span>❤️ <b id="lives">3</b></span><span>🏆 <b id="best">0</b></span></div>
<div id="wrap"><canvas id="cv" width="420" height="640"></canvas></div>
<button id="btn">▶ START</button>
<div class="small">← → / A D / drag to slide the tray · <a href="../index.html">← all games</a></div>
<script>
"use strict";
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=420,H=640;
const $=id=>document.getElementById(id);
let AC=null;function beep(f,d,type,g){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain();o.type=type||'square';o.frequency.value=f;v.gain.value=g||0.05;o.connect(v);v.connect(AC.destination);o.start();v.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(d||0.09));o.stop(AC.currentTime+(d||0.09));}catch(e){}}
// ---------- state ----------
let state='menu'; // menu | play | over
let score=0,combo=0,bestCombo=0,lives=3,time=0,spawnT=0,shake=0;
let wobble=0; // 0..100, stack topples at 100
let quakeT=0,nextQuake=10,invertT=0,flickerT=0,slipT=0;
let items=[],parts=[],pops=[],stack=[];
let tray={x:W/2,w:86,vx:0,squash:0};
let keys={},pointerX=null;
let best=+(localStorage.getItem('fridgeTetrisBest')||0);
$('best').textContent=best;
const RANKS=[[0,'Fridge Rookie'],[150,'Leftover Lifter'],[350,'Tupperware Titan'],[600,'Gravy Guardian'],[900,'FRIDGE TETRIS GOD']];
function rankFor(s){let r=RANKS[0][1];for(const[th,n]of RANKS)if(s>=th)r=n;return r;}
const FAILS=["The fridge won. Again.","Gravy. Everywhere. EVERYWHERE.","The jelly saw everything.","Spoiled milk sends its regards.","Your stack filed for divorce.","Thanksgiving: 1 — You: 0."];
let failLine=FAILS[0];
// ---------- objects ----------
// families (one family = one role):
//  good container: cyan glow, happy face -> CATCH
//  golden pie: gold glow, star eyes -> CATCH rare
//  mystery box: grey, "?" face -> CATCH gamble (own family/role)
//  jelly: purple wobble blob -> CATCH = slippery stack (own family/role)
//  spoiled milk: red/purple, angry face -> AVOID (only angry family)
function spawn(){
  const t=time;const r=Math.random();
  let kind='good';
  if(r<0.05)kind='pie';
  else if(r<0.13)kind='mystery';
  else if(t>9&&r<0.24)kind='jelly';
  else if(r<0.40)kind='milk';
  const speed=140+Math.min(190,time*3.2)+Math.random()*60;
  items.push({kind,x:30+Math.random()*(W-60),y:-30,vy:speed,vx:(Math.random()-0.5)*30,rot:(Math.random()-0.5)*0.3,ph:Math.random()*6.28,landed:false});
}
function popup(x,y,txt,color){pops.push({x,y,txt,color:color||'#facc15',t:0});}
function burst(x,y,color,n){for(let i=0;i<(n||10);i++){const a=Math.random()*6.28,s=40+Math.random()*130;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,t:0,life:0.45+Math.random()*0.3,color,r:2+Math.random()*3});}}
// ---------- input ----------
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key===' '&&(state!=='play'))start();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function toGameX(clientX){const r=cv.getBoundingClientRect();return (clientX-r.left)/r.width*W;}
cv.addEventListener('pointerdown',e=>{pointerX=toGameX(e.clientX);if(state!=='play')start();});
cv.addEventListener('pointermove',e=>{if(e.buttons)pointerX=toGameX(e.clientX);});
cv.addEventListener('pointerup',()=>{pointerX=null;});
cv.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
// ---------- flow ----------
function start(){
  score=0;combo=0;bestCombo=0;lives=3;time=0;spawnT=0;shake=0;wobble=0;
  quakeT=0;nextQuake=10;invertT=0;flickerT=0;slipT=0;
  items=[];parts=[];pops=[];stack=[];tray.x=W/2;tray.vx=0;
  state='play';$('btn').textContent='↻ RESTART';hud();
}
function gameOver(){
  state='over';failLine=FAILS[Math.floor(Math.random()*FAILS.length)];
  if(score>best){best=score;localStorage.setItem('fridgeTetrisBest',best);}
  $('best').textContent=best;$('btn').textContent='▶ ONE MORE TRY';
  burst(tray.x,H-90,'#f472b6',26);beep(140,0.35,'sawtooth',0.07);setTimeout(()=>beep(90,0.4,'sawtooth',0.06),120);
}
function hud(){$('score').textContent=score;$('combo').textContent='x'+(1+Math.floor(combo/5));$('lives').textContent=Math.max(0,lives);}
// ---------- update ----------
function update(dt){
  time+=dt;spawnT-=dt;
  const spawnRate=Math.max(0.42,0.95-time*0.011);
  if(spawnT<=0){spawn();spawnT=spawnRate*(0.7+Math.random()*0.6);}
  // quake twist: first at 10s, then every ~13s, escalating
  if(time>=nextQuake){quakeT=2.6;invertT=2.6;nextQuake=time+13;shake=14;wobble=Math.min(96,wobble+16);popup(W/2,120,'🌍 QUAKE! FLIPPED!','#f472b6');beep(70,0.3,'sawtooth',0.08);}
  if(quakeT>0)quakeT-=dt; if(invertT>0)invertT-=dt; if(slipT>0)slipT-=dt;
  if(time>25&&Math.random()<dt*0.25)flickerT=0.55;
  if(flickerT>0)flickerT-=dt;
  // tray movement
  let dir=0;
  if(keys['arrowleft']||keys['a'])dir-=1;
  if(keys['arrowright']||keys['d'])dir+=1;
  if(invertT>0)dir=-dir;
  const slip=slipT>0?0.45:1;
  if(pointerX!==null){const target=invertT>0?(W-pointerX):pointerX;tray.vx=(target-tray.x)*14*slip;}
  else tray.vx=dir*430*slip;
  tray.x+=tray.vx*dt;
  tray.x=Math.max(tray.w/2,Math.min(W-tray.w/2,tray.x));
  if(tray.squash>0)tray.squash-=dt*5;
  // wobble decays slowly; tall stack wobbles more
  wobble=Math.max(0,wobble-dt*(stack.length>7?2.2:4.5));
  if(wobble>=100){popup(tray.x,H-170,'💥 TOPPLED!','#f87171');gameOver();return;}
  const stackTopY=H-64-stack.length*17;
  const sway=Math.sin(time*3.1)*(wobble*0.22);
  // items
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.y+=it.vy*dt;it.x+=it.vx*dt+Math.sin(time*2+it.ph)*8*dt;it.ph+=dt*4;
    if(it.kind==='jelly')it.x+=Math.sin(time*7+it.ph)*36*dt;
    const nearTray=it.y>=stackTopY-16&&it.y<=stackTopY+16;
    const overTray=Math.abs(it.x-(tray.x+sway*0.4))<tray.w/2+14;
    if(nearTray&&overTray&&it.vy>0){
      catchItem(it);items.splice(i,1);continue;
    }
    if(it.y>H+34){
      // missed
      if(it.kind==='good'||it.kind==='pie'){
        if(Math.abs(it.x-tray.x)<tray.w/2+44)popup(it.x,H-120,'SO CLOSE!','#facc15');
        combo=0;wobble=Math.min(96,wobble+5);burst(it.x,H-8,'#64748b',6);
      }
      if(it.kind==='milk')popup(it.x,H-120,'DODGED! 😤','#4ade80');
      items.splice(i,1);
    }
  }
  // particles & popups
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;if(p.t>p.life)parts.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dt;p.y-=34*dt;if(p.t>0.95)pops.splice(i,1);}
  if(shake>0)shake=Math.max(0,shake-dt*26);
  hud();
}
function catchItem(it){
  tray.squash=1;
  const mult=1+Math.floor(combo/5);
  if(it.kind==='good'){
    combo++;bestCombo=Math.max(bestCombo,combo);
    const pts=10*mult;score+=pts;stack.push('good');
    popup(it.x,it.y-14,'+'+pts,'#22d3ee');burst(it.x,it.y,'#22d3ee',8);beep(520+combo*14,0.07,'square',0.045);
  }else if(it.kind==='pie'){
    combo+=2;bestCombo=Math.max(bestCombo,combo);
    const pts=50*mult;score+=pts;stack.push('pie');
    popup(it.x,it.y-14,'⭐ GOLDEN +'+pts,'#facc15');burst(it.x,it.y,'#facc15',20);beep(880,0.14,'triangle',0.07);
  }else if(it.kind==='mystery'){
    if(Math.random()<0.6){const pts=30*mult;score+=pts;stack.push('good');popup(it.x,it.y-14,'🎁 +'+pts,'#e2e8f0');burst(it.x,it.y,'#e2e8f0',12);beep(700,0.1,'triangle',0.06);}
    else{wobble=Math.min(96,wobble+26);popup(it.x,it.y-14,'🤢 MYSTERY MEAT!','#c084fc');burst(it.x,it.y,'#c084fc',14);beep(180,0.16,'sawtooth',0.06);shake=9;}
  }else if(it.kind==='jelly'){
    slipT=3.2;wobble=Math.min(96,wobble+13);stack.push('jelly');
    const pts=15*mult;score+=pts;combo++;
    popup(it.x,it.y-14,'🫨 SLIPPERY! +'+pts,'#c084fc');burst(it.x,it.y,'#a855f7',12);beep(300,0.12,'sine',0.07);
  }else if(it.kind==='milk'){
    lives--;combo=0;shake=13;wobble=Math.min(96,wobble+10);
    if(stack.length)stack.pop();
    popup(it.x,it.y-14,'🤮 SPOILED!','#f87171');burst(it.x,it.y,'#f87171',18);beep(120,0.22,'sawtooth',0.08);
    if(lives<=0){gameOver();return;}
  }
  if(stack.length>11){stack.splice(0,stack.length-11);score+=25;popup(tray.x,H-190,'🧊 SHELF CLEARED +25','#4ade80');}
}
// ---------- draw ----------
function face(x,y,r,eyes,mouth,color){
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,6.29);ctx.fill();
  ctx.fillStyle='#0b1226';
  if(eyes==='happy'){ctx.fillRect(x-r*0.45,y-r*0.25,r*0.18,r*0.3);ctx.fillRect(x+r*0.27,y-r*0.25,r*0.18,r*0.3);}
  else if(eyes==='star'){ctx.font=(r*1.1)+'px serif';ctx.fillText('⭐',x-r*0.55,y+r*0.05);}
  else if(eyes==='q'){ctx.font='bold '+(r*1.15)+'px sans-serif';ctx.fillText('?',x-r*0.32,y+r*0.4);}
  else if(eyes==='angry'){ctx.fillRect(x-r*0.5,y-r*0.3,r*0.2,r*0.34);ctx.fillRect(x+r*0.3,y-r*0.3,r*0.2,r*0.34);ctx.strokeStyle='#0b1226';ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(x-r*0.55,y-r*0.48);ctx.lineTo(x-r*0.22,y-r*0.28);ctx.moveTo(x+r*0.55,y-r*0.48);ctx.lineTo(x+r*0.22,y-r*0.28);ctx.stroke();}
  else{ctx.beginPath();ctx.arc(x-r*0.3,y-r*0.15,r*0.11,0,6.29);ctx.arc(x+r*0.3,y-r*0.15,r*0.11,0,6.29);ctx.fill();}
  ctx.strokeStyle='#0b1226';ctx.lineWidth=2.2;ctx.beginPath();
  if(mouth==='smile')ctx.arc(x,y+r*0.18,r*0.42,0.25,2.89);
  else if(mouth==='o')ctx.arc(x,y+r*0.32,r*0.2,0,6.29);
  else ctx.arc(x,y+r*0.62,r*0.38,3.55,5.87);
  ctx.stroke();
}
function drawItem(it){
  const wob=Math.sin(it.ph*2)*3;
  ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot+Math.sin(it.ph)*0.06);
  if(it.kind==='good'){
    ctx.shadowColor='#22d3ee';ctx.shadowBlur=16;
    ctx.fillStyle='#164e63';ctx.fillRect(-19,-14,38,28);
    ctx.shadowBlur=0;ctx.fillStyle='#22d3ee';ctx.fillRect(-19,-14,38,9);
    face(0,3,10,'happy','smile','#a5f3fc');
  }else if(it.kind==='pie'){
    ctx.shadowColor='#facc15';ctx.shadowBlur=20;
    ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.ellipse(0,2,21,13,0,0,6.29);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#fde68a';ctx.beginPath();ctx.ellipse(0,-2,16,8,0,0,6.29);ctx.fill();
    face(0,1,8,'star','smile','#fff7ed');
  }else if(it.kind==='mystery'){
    ctx.fillStyle='#475569';ctx.fillRect(-17,-15,34,30);
    ctx.fillStyle='#94a3b8';ctx.fillRect(-17,-15,34,8);
    face(0,4,10,'q','o','#e2e8f0');
  }else if(it.kind==='jelly'){
    ctx.shadowColor='#a855f7';ctx.shadowBlur=12;
    ctx.fillStyle='rgba(168,85,247,0.9)';
    const sq=1+Math.sin(it.ph*3)*0.14;
    ctx.beginPath();ctx.ellipse(0,0,17*sq,15/sq,0,0,6.29);ctx.fill();ctx.shadowBlur=0;
    face(wob*0.3,0,9,'norm','o','#f3e8ff');
  }else{ // milk - angry spoiled
    ctx.shadowColor='#ef4444';ctx.shadowBlur=10;
    ctx.fillStyle='#7f1d1d';ctx.fillRect(-13,-19,26,36);
    ctx.shadowBlur=0;ctx.fillStyle='#ef4444';ctx.fillRect(-8,-25,16,8);
    ctx.fillStyle='#fecaca';ctx.fillRect(-13,-8,26,13);
    face(0,0,9,'angry','frown','#fee2e2');
    ctx.font='11px serif';ctx.fillText('💀',6,-14);
  }
  ctx.restore();
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  // fridge interior
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0e1a38');g.addColorStop(1,'#0b1226');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  // background shelf objects (bobbing jars = background family)
  ctx.fillStyle='rgba(148,163,184,0.16)';
  for(let s=0;s<3;s++){const y=104+s*118;ctx.fillRect(14,y,W-28,7);
    for(let j=0;j<5;j++){const bx=44+j*78+Math.sin(time*1.4+j*2+s)*2.5;const bob=Math.sin(time*2+j+s*3)*2;
      ctx.fillStyle=['rgba(34,211,238,0.20)','rgba(244,114,182,0.20)','rgba(74,222,128,0.20)'][(j+s)%3];
      ctx.fillRect(bx-11,y-24+bob,22,24);ctx.fillStyle='rgba(226,232,240,0.35)';ctx.fillRect(bx-11,y-24+bob,22,5);}}
  // fridge light bulb (flickers during flicker event)
  const bulbOn=!(flickerT>0&&Math.sin(time*46)>0);
  ctx.fillStyle=bulbOn?'#fef9c3':'#57534e';ctx.beginPath();ctx.arc(W/2,26,9,0,6.29);ctx.fill();
  if(bulbOn){ctx.fillStyle='rgba(254,249,195,0.10)';ctx.beginPath();ctx.arc(W/2,26,44,0,6.29);ctx.fill();}
  if(flickerT>0){ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(-20,-20,W+40,H+40);}
  // falling items
  for(const it of items)drawItem(it);
  // stack on tray
  const sway=Math.sin(time*3.1)*(wobble*0.22);
  let sy=H-64;
  stack.forEach((k,idx)=>{
    const off=Math.sin(time*3.1+idx*0.4)*(wobble*0.22)*(idx+1)/Math.max(1,stack.length);
    ctx.save();ctx.translate(tray.x+off,sy-8);
    if(k==='jelly'){ctx.fillStyle='rgba(168,85,247,0.92)';const sq=1+Math.sin(time*5+idx)*0.1;ctx.beginPath();ctx.ellipse(0,0,19*sq,8/sq,0,0,6.29);ctx.fill();}
    else if(k==='pie'){ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.ellipse(0,0,20,8,0,0,6.29);ctx.fill();ctx.fillStyle='#fde68a';ctx.beginPath();ctx.ellipse(0,-2,14,5,0,0,6.29);ctx.fill();}
    else{ctx.fillStyle='#164e63';ctx.fillRect(-19,-8,38,16);ctx.fillStyle='#22d3ee';ctx.fillRect(-19,-8,38,5);}
    ctx.restore();sy-=17;
  });
  // tray / hand shelf (squashes on catch)
  const sq=tray.squash>0?Math.sin(tray.squash*Math.PI)*0.25:0;
  ctx.save();ctx.translate(tray.x+sway*0.4,H-52);ctx.scale(1+sq,1-sq);
  ctx.fillStyle='#f472b6';ctx.beginPath();ctx.ellipse(0,0,tray.w/2,13,0,0,6.29);ctx.fill();
  ctx.fillStyle='#fbcfe8';ctx.beginPath();ctx.ellipse(0,-4,tray.w/2-9,8,0,0,6.29);ctx.fill();
  face(0,-3,8,'happy','smile','#fff1f2');
  ctx.restore();
  // wobble meter
  ctx.fillStyle='rgba(255,255,255,0.14)';ctx.fillRect(14,H-26,150,9);
  ctx.fillStyle=wobble>70?'#ef4444':(wobble>40?'#facc15':'#4ade80');ctx.fillRect(14,H-26,150*Math.min(1,wobble/100),9);
  ctx.fillStyle='#e2e8f0';ctx.font='bold 10px sans-serif';ctx.fillText('WOBBLE',14,H-31);
  // invert warning
  if(invertT>0){ctx.fillStyle='#f472b6';ctx.font='bold 17px sans-serif';ctx.textAlign='center';ctx.fillText('🙃 CONTROLS FLIPPED!',W/2,58);ctx.textAlign='left';}
  // particles & popups
  for(const p of parts){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.29);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=1-p.t;ctx.fillStyle=p.color;ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);ctx.textAlign='left';ctx.globalAlpha=1;}
  ctx.restore();
  // overlays
  if(state==='menu'){
    ctx.fillStyle='rgba(4,6,18,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 30px sans-serif';ctx.fillText('🧊 FRIDGE TETRIS!',W/2,240);
    ctx.font='17px sans-serif';ctx.fillStyle='#a5f3fc';ctx.fillText('Catch the glowing leftovers.',W/2,282);
    ctx.fillStyle='#fca5a5';ctx.fillText('Never catch the angry milk. 😤',W/2,308);
    ctx.fillStyle='#c084fc';ctx.fillText('At 10s the fridge QUAKES…',W/2,334);
    ctx.fillStyle='#facc15';ctx.font='bold 19px sans-serif';ctx.fillText('TAP TO START',W/2,392);ctx.textAlign='left';
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,6,18,0.78)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#f472b6';ctx.font='bold 32px sans-serif';ctx.fillText('💥 FRIDGE DOWN!',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 21px sans-serif';ctx.fillText(failLine,W/2,262);
    ctx.fillStyle='#a5f3fc';ctx.font='18px sans-serif';
    ctx.fillText('Score: '+score+'  ·  Best combo: x'+(1+Math.floor(bestCombo/5)),W/2,300);
    ctx.fillStyle='#facc15';ctx.font='bold 19px sans-serif';ctx.fillText('Rank: '+rankFor(score),W/2,330);
    ctx.fillStyle='#e2e8f0';ctx.font='15px sans-serif';ctx.fillText('Tap COPY RESULT, then ONE MORE TRY',W/2,366);ctx.textAlign='left';
    if(!document.getElementById('copyBtn')){
      const b=document.createElement('button');b.id='copyBtn';b.textContent='📋 COPY RESULT';
      b.onclick=()=>{const txt='🧊 I scored '+score+' in FRIDGE TETRIS! Rank: '+rankFor(score)+'. "'+failLine+'" Play: https://tuannx.github.io/daily-mini-games/games/fridge-tetris.html';if(navigator.clipboard)navigator.clipboard.writeText(txt);b.textContent='✅ COPIED!';setTimeout(()=>b.textContent='📋 COPY RESULT',1400);};
      document.body.insertBefore(b,$('btn'));
    }
  } else {const cb=document.getElementById('copyBtn');if(cb)cb.remove();}
}
// ---------- loop ----------
let last=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  if(state==='play')update(dt);
  draw();requestAnimationFrame(loop);
}
$('btn').onclick=()=>start();
requestAnimationFrame(loop);
</script>
