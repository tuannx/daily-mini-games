<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DANCE DOG: SINGLE PAW — Keep the beat.</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0d0b1e;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:system-ui,'Arial Black',Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  #wrap{position:relative;width:100%;max-width:480px;height:100%;max-height:860px}
  canvas{display:block;width:100%;height:100%;background:#160a2e}
  .btn{position:absolute;top:8px;width:38px;height:38px;border:2px solid #35e0ff;border-radius:50%;background:rgba(13,11,30,.7);color:#fff;font-size:17px;line-height:34px;text-align:center;cursor:pointer;z-index:5}
  #pauseBtn{right:8px} #muteBtn{right:52px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="480" height="760"></canvas>
<div class="btn" id="muteBtn">♪</div>
<div class="btn" id="pauseBtn">II</div>
</div>
<script>
'use strict';
/* DANCE DOG: SINGLE PAW — beat-tap dance battle.
   Tap when a ring shrinks onto the target circle. Glowing green/gold = TAP.
   Red ring with an angry face = NEVER tap (it lies about the beat).
   Twist: from 15s red fake beats appear; from 30s silent bars (no sound cue);
   tempo rises every 15s; from 45s double beats. Miss = the dog judges you.
   One family, one role: glow = tap, red + angry = don't. */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 480, H = 760;
const GAME_URL = 'https://tuannx.github.io/daily-mini-games/games/dance-dog-single-paw.html';
const HS_KEY = 'dancedog-singlepaw-highscore';
const COLLAR_KEY = 'dancedog-gold-collar';

// ---------- audio (WebAudio, self-generated, no assets) ----------
let AC = null, muted = false;
function beep(f, d, type, vol, slide){
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, AC.currentTime + d);
    g.gain.setValueAtTime(vol || 0.12, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + d);
  } catch(e){}
}
const sKick = ()=>{ beep(150,.16,'sine',.16,45); };
const sHat = ()=>{ beep(6000,.04,'square',.04); };
const sHit = ()=>{ [880,1170].forEach((f,i)=>setTimeout(()=>beep(f,.1,'square',.09),i*55)); };
const sPerfect = ()=>{ [1046,1318,1568].forEach((f,i)=>setTimeout(()=>beep(f,.11,'sine',.10),i*55)); };
const sGold = ()=>{ [1320,1760,2200].forEach((f,i)=>setTimeout(()=>beep(f,.12,'sine',.10),i*60)); };
const sFoul = ()=>{ beep(160,.28,'sawtooth',.14,80); };
const sJudge = ()=>{ beep(300,.25,'triangle',.10,180); };
const sOver = ()=>{ [440,330,220,160].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.11),i*140)); };

// ---------- state ----------
let state = 'menu'; // menu | play | pause | over
let score = 0, combo = 0, bestCombo = 0, timeLeft = 60, elapsed = 0;
let hearts = 3, hits = 0, perfects = 0, fouls = 0;
let high = +(localStorage.getItem(HS_KEY) || 0);
let goldCollar = localStorage.getItem(COLLAR_KEY) === '1';
let collarJust = false;
let rings = [], popups = [], bursts = [], notes = [];
let beatT = 0.8, silentBeats = 0, shakeT = 0, dogMood = 'happy', dogMoodT = 0;
let danceT = 0, copyMsg = 0, overRoast = '', flashT = 0;
const ROASTS = [
  'The dog stopped dancing. For you.',
  'He judged you. Out loud. In dog.',
  'The backup dancers filed a complaint.',
  'You lost the beat. The dog kept it.',
  'Even the disco ball looked away.',
  '3 hearts gone. 0 rhythm found.'
];
const RANKS = [[0,'PAW ROOKIE'],[40,'BEAT PUP'],[80,'DANCE DOG'],[130,'SINGLE PAW STAR'],[200,'DISCO LEGEND']];
function rankFor(s){ let r = RANKS[0][1]; RANKS.forEach(rk => { if (s >= rk[0]) r = rk[1]; }); return r; }
function rand(a, b){ return a + Math.random() * (b - a); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function popup(x, y, txt, col){ popups.push({ x, y, txt, col: col || '#fff', t: 0 }); }
function burst(x, y, col, n){
  for (let i = 0; i < (n || 12); i++) bursts.push({ x, y, vx: rand(-140,140), vy: rand(-200,-40), col, t: 0, s: rand(3,7) });
}
function beatInterval(){
  if (elapsed < 15) return 0.95;
  if (elapsed < 30) return 0.85;
  if (elapsed < 45) return 0.74;
  return 0.64;
}
function reset(){
  score = 0; combo = 0; bestCombo = 0; timeLeft = 60; elapsed = 0;
  hearts = 3; hits = 0; perfects = 0; fouls = 0;
  rings = []; popups = []; bursts = []; notes = [];
  beatT = 0.8; silentBeats = 0; shakeT = 0; dogMood = 'happy'; dogMoodT = 0;
  danceT = 0; copyMsg = 0; flashT = 0; collarJust = false;
}
function spawnBeat(){
  let kind = 'green';
  const r = Math.random();
  if (elapsed >= 15 && r < 0.20) kind = 'red';
  else if (elapsed >= 10 && r < 0.32) kind = 'gold';
  // silent bar: from 30s, one bar of 4 beats with no sound cue
  let silent = false;
  if (elapsed >= 30 && silentBeats > 0){ silent = true; silentBeats--; }
  rings.push({ kind, p: 0, silent });
  if (!silent){ sKick(); setTimeout(sHat, 90); }
  else if (rings.length === 1 || true){ /* visual only */ }
}
function nextBeatDelay(){
  let d = beatInterval();
  if (elapsed >= 45 && Math.random() < 0.25) d *= 0.5; // double beat
  return d;
}
function setMood(m, secs){ dogMood = m; dogMoodT = secs; }

// ---------- input ----------
function onTap(){
  if (state === 'menu'){ reset(); state = 'play'; return; }
  if (state === 'over'){
    // buttons handled by coords in pointer handler; Enter/Space handled by keys
    return;
  }
  if (state !== 'play') return;
  // find ring nearest its target (p near 1)
  let best = null, bestD = 99;
  rings.forEach(r => { const d = Math.abs(r.p - 1); if (d < bestD){ bestD = d; best = r; } });
  if (!best || bestD > 0.22){
    popup(240, 300, 'OFF BEAT!', '#94a3b8');
    return;
  }
  rings.splice(rings.indexOf(best), 1);
  if (best.kind === 'red'){
    hearts--; fouls++; combo = 0; shakeT = 0.4; setMood('angry', 1.2);
    popup(240, 300, 'NO TAP!', '#ef4444'); sFoul();
    if (hearts <= 0) endGame();
    return;
  }
  const perfect = bestD <= 0.09;
  hits++; combo++; bestCombo = Math.max(bestCombo, combo);
  const base = best.kind === 'gold' ? 10 : (perfect ? 5 : 2);
  score += base + Math.floor(combo / 5);
  if (perfect){ perfects++; popup(240, 300, 'PERFECT!', '#facc15'); sPerfect(); burst(240, 470, '#facc15', 14); }
  else if (bestD <= 0.15){ popup(240, 300, 'NICE!', '#4ade80'); sHit(); burst(240, 470, '#4ade80', 8); }
  else { popup(240, 300, 'SO CLOSE!', '#4ade80'); sHit(); }
  if (best.kind === 'gold'){ popup(240, 250, 'GOLDEN!', '#ffd23f'); sGold(); burst(240, 470, '#ffd23f', 18); }
  setMood('happy', 0.6); danceT = 0;
  if (score >= 120 && !goldCollar){ goldCollar = true; collarJust = true; localStorage.setItem(COLLAR_KEY, '1'); popup(240, 200, 'GOLD COLLAR!', '#ffd23f'); }
}
cv.addEventListener('pointerdown', e => {
  if (state === 'over'){
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) * (W / r.width), y = (e.clientY - r.top) * (H / r.height);
    if (y >= 560 && y <= 610){
      if (x >= 90 && x <= 220){ // AGAIN
        reset(); state = 'play'; return;
      }
      if (x >= 260 && x <= 390){ // COPY
        const txt = 'DANCE DOG: SINGLE PAW — I scored ' + score + ' (' + rankFor(score) + ') and the dog still judged me. ' + GAME_URL;
        if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});
        copyMsg = 2; return;
      }
    }
    return;
  }
  if (state === 'pause') return;
  onTap();
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter'){
    e.preventDefault();
    if (state === 'menu'){ reset(); state = 'play'; }
    else if (state === 'over'){ reset(); state = 'play'; }
    else if (state === 'play') onTap();
  }
  if (e.code === 'KeyR' && state === 'over'){ reset(); state = 'play'; }
  if (e.code === 'KeyP' && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
});
document.getElementById('pauseBtn').addEventListener('click', () => {
  if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play';
});
document.getElementById('muteBtn').addEventListener('click', () => {
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '✕' : '♪';
});
function endGame(){
  state = 'over'; overRoast = pick(ROASTS);
  if (score > high){ high = score; localStorage.setItem(HS_KEY, String(high)); }
  sOver();
}

// ---------- drawing ----------
function drawDog(x, y, s, mood, t){
  const bounce = Math.sin(t * 6) * 4;
  const squash = 1 + Math.sin(t * 6) * 0.05;
  ctx.save(); ctx.translate(x, y + bounce); ctx.scale(squash, 2 - squash); ctx.scale(s, s);
  // body
  ctx.fillStyle = '#c98a4b';
  ctx.beginPath(); ctx.ellipse(0, 18, 34, 26, 0, 0, Math.PI * 2); ctx.fill();
  // legs
  ctx.fillStyle = '#a96f35';
  ctx.fillRect(-26, 36, 12, 16); ctx.fillRect(14, 36, 12, 16);
  // ears flipping on the beat
  const ear = Math.sin(t * 6) * 0.35;
  ctx.fillStyle = '#8a5a2b';
  ctx.save(); ctx.rotate(-0.5 - ear); ctx.beginPath(); ctx.ellipse(-24, -22, 10, 20, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.rotate(0.5 + ear); ctx.beginPath(); ctx.ellipse(24, -22, 10, 20, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // head
  ctx.fillStyle = '#d99a55';
  ctx.beginPath(); ctx.arc(0, -8, 30, 0, Math.PI * 2); ctx.fill();
  // snout + nose
  ctx.fillStyle = '#f3d9b8'; ctx.beginPath(); ctx.ellipse(0, 2, 16, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(0, -2, 5, 0, Math.PI * 2); ctx.fill();
  // eyes / mood
  ctx.fillStyle = '#1f2937';
  if (mood === 'angry'){
    ctx.fillRect(-20, -18, 12, 3); ctx.fillRect(8, -18, 12, 3);
    ctx.beginPath(); ctx.arc(-14, -12, 3, 0, Math.PI * 2); ctx.arc(14, -12, 3, 0, Math.PI * 2); ctx.fill();
  } else if (mood === 'judge'){
    ctx.beginPath(); ctx.arc(-14, -14, 4, 0, Math.PI * 2); ctx.arc(14, -14, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-20, -22, 12, 3);
  } else {
    ctx.beginPath(); ctx.arc(-14, -14, 4, 0, Math.PI * 2); ctx.arc(14, -14, 4, 0, Math.PI * 2); ctx.fill();
  }
  // mouth
  ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 2; ctx.beginPath();
  if (mood === 'happy') ctx.arc(0, 6, 8, 0.15, Math.PI - 0.15);
  else ctx.arc(0, 10, 8, Math.PI + 0.4, -0.4);
  ctx.stroke();
  // gold collar unlock
  if (goldCollar){
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, 22, 20, 0.3, Math.PI - 0.3); ctx.stroke();
  }
  ctx.restore();
}
function drawDancer(x, y, s, t, flip){
  const whip = Math.sin(t * 6 + (flip ? 1.5 : 0)) * 0.5;
  ctx.save(); ctx.translate(x, y + Math.sin(t * 6) * 3); ctx.scale(s, s);
  ctx.fillStyle = '#f472b6';
  ctx.beginPath(); ctx.arc(0, -20, 16, 0, Math.PI * 2); ctx.fill();
  // hair whipping
  ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -32); ctx.quadraticCurveTo(whip * 30, -44, whip * 34, -28); ctx.stroke();
  ctx.fillStyle = '#22d3ee'; ctx.beginPath(); ctx.ellipse(0, 8, 18, 24, whip * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1f2937';
  ctx.beginPath(); ctx.arc(-6, -22, 2.5, 0, Math.PI * 2); ctx.arc(6, -22, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawScene(t){
  // stage floor
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#160a2e'); g.addColorStop(0.55, '#241245'); g.addColorStop(1, '#12081f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // disco ball
  ctx.save(); ctx.translate(240, 90);
  ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(0, -16); ctx.stroke();
  ctx.fillStyle = '#e2e8f0'; ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#94a3b8';
  for (let i = 0; i < 6; i++){ ctx.beginPath(); ctx.arc(-14 + i * 6, -12 + (i % 2) * 14, 3, 0, Math.PI * 2); ctx.fill(); }
  // rotating beams
  ctx.globalAlpha = 0.18;
  for (let i = 0; i < 4; i++){
    const a = t * 0.8 + i * Math.PI / 2;
    ctx.fillStyle = i % 2 ? '#f472b6' : '#22d3ee';
    ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(Math.cos(a) * 240, 20 + Math.sin(a) * 240); ctx.lineTo(Math.cos(a + 0.15) * 240, 20 + Math.sin(a + 0.15) * 240); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // speakers pulsing
  [52, 428].forEach((x, i) => {
    const p = 1 + Math.sin(t * 6 + i) * 0.08;
    ctx.save(); ctx.translate(x, 620); ctx.scale(p, p);
    ctx.fillStyle = '#1e293b'; ctx.fillRect(-26, -50, 52, 100);
    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(0, -18, 15, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 22, 10, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
  // crowd heads bouncing at the bottom
  for (let i = 0; i < 9; i++){
    const x = 30 + i * 52, y = 730 + Math.sin(t * 6 + i * 0.9) * 3;
    ctx.fillStyle = ['#f472b6','#22d3ee','#facc15','#4ade80'][i % 4];
    ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1f2937';
    ctx.beginPath(); ctx.arc(x - 5, y - 2, 2, 0, Math.PI * 2); ctx.arc(x + 5, y - 2, 2, 0, Math.PI * 2); ctx.fill();
  }
  drawDancer(140, 540, 0.9, t, false);
  drawDancer(340, 540, 0.9, t, true);
  // stage platform
  ctx.fillStyle = '#2d1b69'; ctx.fillRect(60, 580, 360, 14);
  drawDog(240, 470, 1.15, dogMood, t);
}
function drawRing(r){
  const radius = 130 - 84 * r.p; // 130 -> 46 at p=1
  const cx = 240, cy = 470;
  const col = r.kind === 'red' ? '#ef4444' : (r.kind === 'gold' ? '#ffd23f' : '#4ade80');
  ctx.save();
  if (r.kind !== 'red'){
    ctx.shadowColor = col; ctx.shadowBlur = 18;
  }
  ctx.strokeStyle = col; ctx.lineWidth = r.kind === 'gold' ? 7 : 5;
  ctx.globalAlpha = 0.35 + 0.65 * Math.min(1, r.p + 0.2);
  ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  if (r.kind === 'red'){
    // angry face on the ring
    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 26px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('😠', cx, cy - 90 + (1 - r.p) * 0); // face rides above target zone marker
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui';
    ctx.fillText('DON\'T', cx, cy + 84);
  }
  ctx.restore();
}
function drawHUD(){
  ctx.fillStyle = 'rgba(13,11,30,.75)'; ctx.fillRect(0, 0, W, 62);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px system-ui'; ctx.textAlign = 'left';
  ctx.fillText('★ ' + score, 14, 30);
  ctx.font = 'bold 15px system-ui'; ctx.fillStyle = '#facc15';
  ctx.fillText('x' + combo + ' COMBO', 14, 52);
  ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = 'bold 22px system-ui';
  ctx.fillText(Math.ceil(timeLeft) + 's', W - 14, 30);
  ctx.font = 'bold 15px system-ui'; ctx.fillStyle = '#ef4444';
  ctx.fillText('♥'.repeat(hearts) + '♡'.repeat(3 - hearts), W - 14, 52);
  ctx.textAlign = 'center';
}
function drawTextLines(lines, y0, lh){
  lines.forEach((ln, i) => {
    ctx.font = ln.font; ctx.fillStyle = ln.col; ctx.textAlign = 'center';
    ctx.fillText(ln.txt, W / 2, y0 + i * lh);
  });
}
function draw(){
  const t = performance.now() / 1000;
  ctx.save();
  if (shakeT > 0) ctx.translate(rand(-6, 6), rand(-6, 6));
  drawScene(danceT);
  if (state === 'play' || state === 'pause'){
    // target circle
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(240, 470, 46, 0, Math.PI * 2); ctx.stroke();
    rings.forEach(drawRing);
    drawHUD();
    popups.forEach(p => {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 0.9);
      ctx.font = 'bold 26px system-ui'; ctx.fillStyle = p.col; ctx.textAlign = 'center';
      ctx.fillText(p.txt, p.x, p.y - p.t * 30);
      ctx.globalAlpha = 1;
    });
    bursts.forEach(b => { ctx.fillStyle = b.col; ctx.fillRect(b.x, b.y, b.s, b.s); });
    if (elapsed >= 30 && silentBeats > 0){
      ctx.font = 'bold 20px system-ui'; ctx.fillStyle = '#facc15'; ctx.textAlign = 'center';
      ctx.fillText('QUIET BAR — WATCH!', W / 2, 100);
    }
  }
  if (state === 'menu'){
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    drawTextLines([
      { txt: '🐶 DANCE DOG 🪩', font: 'bold 40px system-ui', col: '#fff' },
      { txt: 'SINGLE PAW', font: 'bold 34px system-ui', col: '#f472b6' },
      { txt: 'Keep the beat. Dog judges you.', font: 'bold 18px system-ui', col: '#e2e8f0' },
      { txt: '🟢 TAP  •  🔴 DON\'T TAP', font: 'bold 17px system-ui', col: '#facc15' },
      { txt: 'TAP TO START', font: 'bold 26px system-ui', col: '#22d3ee' },
      { txt: 'Best: ' + high + '  •  ' + (goldCollar ? '👑 Gold collar unlocked' : 'Score 120 = gold collar'), font: '15px system-ui', col: '#94a3b8' }
    ], 250, 44);
  }
  if (state === 'pause'){
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    drawTextLines([{ txt: 'PAUSED', font: 'bold 40px system-ui', col: '#fff' }], 380, 40);
  }
  if (state === 'over'){
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 0, W, H);
    drawTextLines([
      { txt: 'THE DOG JUDGES YOU', font: 'bold 30px system-ui', col: '#f472b6' },
      { txt: overRoast, font: '17px system-ui', col: '#e2e8f0' },
      { txt: 'Score: ' + score + '  •  Best: ' + high, font: 'bold 22px system-ui', col: '#fff' },
      { txt: rankFor(score) + '  •  ' + hits + ' hits, ' + perfects + ' perfect', font: '16px system-ui', col: '#facc15' },
      { txt: collarJust ? '👑 GOLD COLLAR UNLOCKED!' : '', font: 'bold 17px system-ui', col: '#ffd23f' }
    ], 250, 42);
    ctx.fillStyle = '#22d3ee'; ctx.fillRect(90, 560, 130, 50);
    ctx.fillStyle = '#f472b6'; ctx.fillRect(260, 560, 130, 50);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('AGAIN', 155, 592); ctx.fillText('COPY', 325, 592);
    if (copyMsg > 0){ ctx.fillStyle = '#4ade80'; ctx.font = 'bold 16px system-ui'; ctx.fillText('COPIED!', W / 2, 640); }
  }
  ctx.restore();
}

// ---------- loop ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play'){
    danceT += dt; elapsed += dt; timeLeft -= dt;
    if (dogMoodT > 0){ dogMoodT -= dt; if (dogMoodT <= 0) dogMood = 'happy'; }
    if (shakeT > 0) shakeT -= dt;
    if (copyMsg > 0) copyMsg -= dt;
    // beat scheduling
    beatT -= dt;
    if (beatT <= 0){
      spawnBeat();
      if (elapsed >= 30 && silentBeats === 0 && Math.random() < 0.35) silentBeats = 4;
      beatT = nextBeatDelay();
    }
    rings.forEach(r => { r.p += dt / 0.85; });
    // expired rings
    rings = rings.filter(r => {
      if (r.p > 1.22){
        if (r.kind === 'red'){ score += 2; popup(240, 300, 'SMART!', '#4ade80'); }
        else { combo = 0; setMood('judge', 1.0); popup(240, 300, 'JUDGED!', '#f472b6'); sJudge(); }
        return false;
      }
      return true;
    });
    popups.forEach(p => p.t += dt); popups = popups.filter(p => p.t < 0.9);
    bursts.forEach(b => { b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 300 * dt; });
    bursts = bursts.filter(b => b.t < 0.8);
    if (timeLeft <= 0) endGame();
  } else {
    danceT += dt * 0.3;
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
