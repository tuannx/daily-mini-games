<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DOWN PAYMENT — Dig Deep. Mind the Lava.</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0612;font-family:'Courier New',monospace;touch-action:none;user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;display:block}
  .ui{position:fixed;left:0;right:0;text-align:center;color:#fff;z-index:5;pointer-events:none}
  #hook{top:8px;font-size:15px;letter-spacing:1px;color:#ffd54a;text-shadow:0 0 12px #ff8c00}
  #hud{top:34px;font-size:14px;color:#9fe8ff;text-shadow:0 0 8px #00e5ff}
  #combo{top:58px;font-size:16px;font-weight:bold;color:#ff7ad9;text-shadow:0 0 10px #ff2ea6;opacity:0;transition:opacity .2s}
  #banner{top:38%;font-size:34px;font-weight:bold;color:#ff5252;text-shadow:0 0 18px #ff0000;opacity:0;transition:opacity .3s;transform:rotate(-3deg)}
  #over{position:fixed;inset:0;display:none;z-index:10;background:rgba(5,2,10,.78);color:#fff;text-align:center;padding-top:22vh;pointer-events:auto}
  #over h1{font-size:30px;color:#ff5252;text-shadow:0 0 14px #f00;margin-bottom:10px}
  #over .line{font-size:16px;color:#ffd54a;margin:6px 16px;min-height:44px}
  #over .score{font-size:20px;color:#9fe8ff;margin-top:8px}
  #over .rank{font-size:15px;color:#ff7ad9;margin-top:4px}
  #over button{pointer-events:auto;margin:12px 8px 0;padding:12px 26px;font-size:17px;font-family:inherit;font-weight:bold;color:#0a0612;background:#ffd54a;border:none;border-radius:10px;cursor:pointer;box-shadow:0 0 16px #ff8c00}
  #start{position:fixed;inset:0;z-index:10;background:rgba(5,2,10,.82);color:#fff;text-align:center;padding-top:26vh;pointer-events:auto;cursor:pointer}
  #start h1{font-size:38px;color:#ffd54a;text-shadow:0 0 16px #ff8c00;margin-bottom:8px}
  #start .tag{font-size:14px;color:#9fe8ff;margin:0 20px}
  #start .go{margin-top:22px;font-size:20px;color:#0a0612;background:#ffd54a;display:inline-block;padding:14px 40px;border-radius:12px;font-weight:bold;box-shadow:0 0 20px #ff8c00;animation:pulse 1s infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="hook">DIG DEEP. DODGE ANGRY LAVA.</div>
<div class="ui" id="hud"></div>
<div class="ui" id="combo"></div>
<div class="ui" id="banner"></div>
<div id="over">
  <h1 id="overTitle">MELTED.</h1>
  <div class="line" id="overLine"></div>
  <div class="score" id="overScore"></div>
  <div class="rank" id="overRank"></div>
  <div>
    <button id="again">DIG AGAIN</button>
    <button id="brag">📋 COPY BRAG</button>
  </div>
</div>
<div id="start">
  <h1>⛏️ DOWN PAYMENT</h1>
  <div class="tag">Dig deep. Sell shinies. The lava has opinions.</div>
  <div class="go">TAP TO DIG</div>
</div>
<script>
'use strict';
// ============ DOWN PAYMENT — Day 22 ============
// Hold to drill DOWN. Steer left/right. Release to brake.
// Glowing = good (only glowing things). Angry face = bad.
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

const $=id=>document.getElementById(id);
const HIKEY='downpayment_hi';
let best=0;try{best=parseInt(localStorage.getItem(HIKEY)||'0',10)||0;}catch(e){}

// ---------- tiny synth ----------
let AC=null;function beep(f,d,type,g){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'square';o.frequency.value=f;gn.gain.value=g||.05;gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}

// ---------- game state ----------
const G={
  mode:'menu', t:0, depth:0, best:best, score:0, cash:0, drillHP:3,
  drillSpeed:0, targetSpeed:0, heat:0, x:0, vx:0,
  rocks:[], gems:[], lavas:[], parts:[], texts:[], strata:[],
  nearMissCD:0, combo:0, comboT:0, awake:false, deaths:0,
  popQueue:[], chestT:0, milestoneT:0, lastNearY:0,
};
const LANES={gem:0};
const FAIL_LAVA=["The lava filed a complaint.","You rang the doorbell of Lava's house.","Mole insurance: DENIED.","Congratulations. You dug your own grave.","The core is Lava's living room. You barged in.","Depth achieved. Dignity lost.","You are now part of the mantle."];
const FAIL_ROCK=["Drill broke. The rocks unionized.","3 rocks vs your shovel. Shovel lost.","You hit rock bottom. Literally.","The dirt pressed charges."];
const RANKS=[[0,'Backyard Burrower'],[120,'Basement Bandit'],[260,'Sewer Surfer'],[450,'Mantle Maverick'],[700,'Core Crasher'],[1000,'EARTH DADDY']];
const MILESTONES={40:['40m','WIFI SIGNAL LOST'],90:['90m','DINOSAUR HOUSING'],150:['150m','DO NOT KNOCK'],230:['230m','LAVA COUNTRY'],330:['330m','THE CORE IS SPICY']};

function rankFor(d){let r=RANKS[0][1];for(const[m,t]of RANKS)if(d>=m)r=t;return r;}
function strataColor(y){const d=y/40;const stops=[[0,'#2b1b3d'],[120,'#3d1f2b'],[260,'#4d2418'],[450,'#5c2a10'],[700,'#6b3012'],[1000,'#7d3512']];let a=stops[0],b=stops[stops.length-1];for(let i=0;i<stops.length-1;i++){if(d>=stops[i][0]&&d<=stops[i+1][0]){a=stops[i];b=stops[i+1];break;}}const t=Math.min(1,Math.max(0,(d-a[0])/((b[0]-a[0])||1)));return mix(a[1],b[1],t);}
function mix(c1,c2,t){const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];const a=p(c1),b=p(c2);return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')})`;}

// ---------- spawners ----------
function spawnRow(){
  const y=G.depth+H*0.75;
  const esc=Math.min(1,G.depth/500);          // escalation 0..1
  const nRock=Math.random()<0.25+esc*0.45?1:0;
  for(let i=0;i<nRock;i++)G.rocks.push({x:(Math.random()-.5)*W*.8,y:y+Math.random()*80,r:22+Math.random()*16,angry:1,hurt:false});
  if(Math.random()<0.55)G.gems.push({x:(Math.random()-.5)*W*.8,y:y+Math.random()*60,r:12+Math.random()*6,ph:Math.random()*6});
  if(Math.random()<0.16+esc*0.2)G.lavas.push({x:(Math.random()-.5)*W*.8,y:y+Math.random()*60,r:26+Math.random()*14,ph:Math.random()*6,swim:0});
  if(Math.random()<0.05)G.gems.push({x:(Math.random()-.5)*W*.8,y:y,r:20,chest:true,ph:0});
  if(G.depth>400&&Math.random()<0.08)G.gems.push({x:(Math.random()-.5)*W*.8,y:y,r:12,golden:true,ph:0});
}
function popup(txt,color){G.texts.push({txt,color:color||'#ffd54a',t:0});if(G.texts.length>4)G.texts.shift();}
function banner(txt,color){const b=$('banner');b.textContent=txt;b.style.color=color||'#ff5252';b.style.opacity=1;setTimeout(()=>b.style.opacity=0,1400);}

// ---------- input ----------
const input={dig:false,dir:0};
function bind(){
  const on=e=>{e.preventDefault();if(G.mode==='menu'){startGame();return;}if(G.mode==='over')return;input.dig=true;beep(180,.06,'sawtooth',.03);};
  const off=e=>{e.preventDefault();input.dig=false;};
  window.addEventListener('pointerdown',on);window.addEventListener('pointerup',off);window.addEventListener('pointercancel',off);
  window.addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'||e.code==='ArrowDown'){e.preventDefault();if(G.mode==='menu')startGame();else input.dig=true;}
    if(e.code==='ArrowLeft'||e.code==='KeyA')input.dir=-1;if(e.code==='ArrowRight'||e.code==='KeyD')input.dir=1;
    if((e.code==='KeyR'||e.code==='Enter')&&G.mode==='over')startGame();});
  window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowDown')input.dig=false;if((e.code==='ArrowLeft'||e.code==='KeyA')&&input.dir<0)input.dir=0;if((e.code==='ArrowRight'||e.code==='KeyD')&&input.dir>0)input.dir=0;});
  window.addEventListener('pointermove',e=>{if(!input.dig)return;const nx=(e.clientX/W-.5)*2;input.dir=Math.abs(nx)<.2?0:Math.sign(nx);});
}
$('again').addEventListener('click',()=>startGame());
$('brag').addEventListener('click',()=>{
  const txt=`I dug ${Math.floor(G.depth)}m in DOWN PAYMENT (${rankFor(G.depth)}) and the lava still hates me. ${location.href}`;
  try{navigator.clipboard.writeText(txt);}catch(e){prompt('Copy your brag:',txt);}
  $('brag').textContent='📋 COPIED!';setTimeout(()=>$('brag').textContent='📋 COPY BRAG',1200);});
$('start').addEventListener('click',()=>{});

// ---------- flow ----------
function startGame(){
  Object.assign(G,{mode:'play',t:0,depth:0,score:0,cash:0,drillHP:3,drillSpeed:0,targetSpeed:0,heat:0,x:0,vx:0,
    rocks:[],gems:[],lavas:[],parts:[],texts:[],nearMissCD:0,combo:0,comboT:0,awake:false});
  for(let i=0;i<8;i++)spawnRow();
  $('start').style.display='none';$('over').style.display='none';$('combo').style.opacity=0;
  beep(300,.1,'square',.04);
}
function die(cause){
  G.mode='over';
  const lines=cause==='lava'?FAIL_LAVA:FAIL_ROCK;
  const line=lines[Math.floor(Math.random()*lines.length)];
  $('overTitle').textContent=cause==='lava'?'MELTED.':'SHOVEL DIED.';
  $('overLine').textContent=line;
  $('overScore').textContent=`Depth: ${Math.floor(G.depth)}m · Cash: $${G.cash}`;
  $('overRank').textContent=`Rank: ${rankFor(G.depth)} · Best: ${Math.floor(G.best)}m`;
  if(G.depth>G.best){G.best=G.depth;try{localStorage.setItem(HIKEY,String(Math.floor(G.best)));}catch(e){}}
  $('over').style.display='block';
  beep(120,.5,'sawtooth',.07);setTimeout(()=>beep(70,.7,'sawtooth',.07),120);
}

// ---------- update ----------
function update(dt){
  G.t+=dt;
  const esc=Math.min(1,G.depth/500);
  // drilling
  const maxSp=150+esc*130;
  G.targetSpeed=input.dig&&G.mode==='play'?maxSp:0;
  G.drillSpeed+=(G.targetSpeed-G.drillSpeed)*Math.min(1,dt*4);
  if(input.dig&&G.mode==='play')G.heat=Math.min(1,G.heat+dt*.35);else G.heat=Math.max(0,G.heat-dt*.8);
  G.depth+=G.drillSpeed*dt/40; // meters-ish
  // steer
  G.vx+=input.dir*900*dt;G.vx*=Math.max(0,1-dt*5);G.x+=G.vx*dt;
  const lim=W*.42;if(G.x>lim){G.x=lim;G.vx=0;}if(G.x<-lim){G.x=-lim;G.vx=0;}
  const cy=H*0.28; // mole screen y
  // wake twist ~ depth 60 (roughly 10-14s in)
  if(!G.awake&&G.depth>=60){G.awake=true;banner('LAVA IS AWAKE!');popup('RUN.');
    for(const l of G.lavas)l.swim=1;beep(90,.6,'sawtooth',.06);}
  // spawn ahead
  while(G.rocks.length<20&&Math.random()<.8)spawnRow();
  // particles/texts decay
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.life-=dt;}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const t of G.texts)t.t+=dt;G.texts=G.texts.filter(t=>t.t<1.1);
  // milestone signs
  for(const[k,v]of Object.entries(MILESTONES)){if(G.depth>=+k&&G.milestoneT!==+k){G.milestoneT=+k;popup(v[1],'#9fe8ff');beep(520,.15,'sine',.05);}}
  // near-miss cooldown
  G.nearMissCD-=dt;G.comboT-=dt;if(G.comboT<=0){G.combo=0;$('combo').style.opacity=0;}
  // collisions
  const mx=W/2+G.x;
  const killR=18;
  for(const l of G.lavas){
    l.ph+=dt*3;
    if(l.swim){ // lava swims toward mole x, slowly
      l.x+=Math.sign(mx-l.x)*Math.min(Math.abs(mx-l.x),(30+esc*60)*dt);
    }
    const d=Math.hypot(l.x-mx,l.y-(G.depth*40+cy));
    if(d<l.r+killR&&G.mode==='play'){die('lava');return;}
    if(d<l.r+killR+46&&G.nearMissCD<=0&&G.drillSpeed>60){G.nearMissCD=1.2;G.combo++;G.comboT=2.5;G.cash+=25*G.combo;popup('SO CLOSE!','#ff7ad9');beep(880,.08,'sine',.05);
      if(G.combo>1){$('combo').textContent='x'+G.combo+' STREAK';$('combo').style.opacity=1;}}
  }
  for(const r of G.rocks){
    const d=Math.hypot(r.x-mx,r.y-(G.depth*40+cy));
    if(d<r.r+killR&&!r.hurt&&G.mode==='play'){
      r.hurt=true;G.drillHP--;G.vx+=Math.sign(mx-r.x)*260;G.drillSpeed*=0.3;
      burst(r.x,r.y,'#b0a89f',10);popup('OUCH.','#ff5252');beep(140,.15,'square',.06);
      if(G.drillHP<=0){die('rock');return;}
      setTimeout(()=>r.hurt=false,900);
    }
  }
  for(let i=G.gems.length-1;i>=0;i--){
    const g=G.gems[i];g.ph+=dt*4;
    const d=Math.hypot(g.x-mx,g.y-(G.depth*40+cy));
    if(d<g.r+killR+8&&G.mode==='play'){
      const val=g.chest?150:(g.golden?300:25);
      G.cash+=val;burst(g.x,g.y,'#ffe14d',g.chest?22:10);
      popup(g.chest?'JACKPOT!':g.golden?'SPICY!':'+$'+val,'#ffe14d');
      beep(g.chest?1320:660,.12,'sine',.05);
      G.gems.splice(i,1);
    }
  }
  // cleanup far behind/ahead
  const wy=G.depth*40+cy;
  G.rocks=G.rocks.filter(r=>r.y>wy-H&&r.y<wy+H*2);
  G.lavas=G.lavas.filter(l=>l.y>wy-H&&l.y<wy+H*2);
  G.gems=G.gems.filter(g=>g.y>wy-H&&g.y<wy+H*2);
  $('hud').textContent=`⛏ ${Math.floor(G.depth)}m  💰 $${G.cash}  🔧${'⬛'.repeat(Math.max(0,G.drillHP))}${'⬜'.repeat(Math.max(0,3-G.drillHP))}  BEST ${Math.floor(G.best)}m`;
}
function burst(x,y,c,n){for(let i=0;i<n;i++)G.parts.push({x,y,vx:(Math.random()-.5)*400,vy:(Math.random()-.5)*400-100,life:.5+Math.random()*.4,c});}

// ---------- draw ----------
function face(x,y,r,mood){ // mood: 'ok' | 'angry' | 'panic'
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-r*.32,y-r*.15,r*.2,0,7);ctx.arc(x+r*.32,y-r*.15,r*.2,0,7);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x-r*.32,y-r*.15,r*.09,0,7);ctx.arc(x+r*.32,y-r*.15,r*.09,0,7);ctx.fill();
  ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.beginPath();
  if(mood==='angry'){ctx.moveTo(x-r*.5,y-r*.55);ctx.lineTo(x-r*.14,y-r*.38);ctx.moveTo(x+r*.5,y-r*.55);ctx.lineTo(x+r*.14,y-r*.38);}
  else{ctx.moveTo(x-r*.5,y-r*.45);ctx.lineTo(x-r*.14,y-r*.45);ctx.moveTo(x+r*.5,y-r*.45);ctx.lineTo(x+r*.14,y-r*.45);}
  ctx.stroke();
  ctx.beginPath();
  if(mood==='angry'){ctx.arc(x,y+r*.45,r*.3,Math.PI*1.15,Math.PI*1.85);}
  else if(mood==='panic'){ctx.ellipse(x,y+r*.4,r*.16,r*.24,0,0,7);}
  else{ctx.arc(x,y+r*.25,r*.28,Math.PI*.15,Math.PI*.85);}
  ctx.stroke();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const cy=H*0.28,wy=G.depth*40+cy,camY=wy-cy;
  // strata background
  ctx.fillStyle=strataColor(wy);ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=3;
  for(let y=-((camY)%90);y<H;y+=90){ctx.beginPath();ctx.moveTo(0,y);ctx.quadraticCurveTo(W*.25,y+14,W*.5,y);ctx.quadraticCurveTo(W*.75,y-14,W,y);ctx.stroke();}
  const mx=W/2+G.x;
  // worms (background critters)
  ctx.strokeStyle='rgba(255,150,200,.5)';ctx.lineWidth=5;ctx.lineCap='round';
  for(let i=0;i<5;i++){const wx=(i*197+G.t*20)%W,wy2=(i*263+camY*0.85)%H;
    ctx.beginPath();for(let s=0;s<=8;s++)ctx.lineTo(wx+s*6,wy2+Math.sin(G.t*6+s)*5);ctx.stroke();}
  // roots
  ctx.strokeStyle='rgba(120,70,40,.8)';ctx.lineWidth=4;
  for(let i=0;i<4;i++){const rx=(i*331+camY*0.6)%W,ry=(i*499+camY*0.9)%H;
    ctx.beginPath();ctx.moveTo(rx,ry-70);ctx.quadraticCurveTo(rx+20,ry-20,rx-10,ry+30);ctx.stroke();}
  // rocks (ANGRY, hazards)
  for(const r of G.rocks){const sy=r.y-camY;if(sy<-60||sy>H+60)continue;
    const shake=r.hurt?3:0,sx=r.x+(Math.random()-.5)*shake;
    ctx.fillStyle=r.hurt?'#8d8578':'#6b6257';ctx.strokeStyle='#3a352e';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(sx,sy-r.r);ctx.lineTo(sx+r.r*.9,sy-r.r*.4);ctx.lineTo(sx+r.r*.6,sy+r.r*.8);ctx.lineTo(sx-r.r*.7,sy+r.r*.7);ctx.lineTo(sx-r.r,sy-r.r*.3);ctx.closePath();ctx.fill();ctx.stroke();
    face(sx,sy-r.r*.05,r.r*.55,'angry');
    ctx.fillStyle='rgba(255,60,60,.85)';ctx.fillRect(sx-r.r,sy-r.r-12,(r.r*2)*(r.hurt?1:0.999),4);}
  // gems (GLOWING = collectible only)
  for(const g of G.gems){const sy=g.y-camY;if(sy<-60||sy>H+60)continue;
    const pulse=1+Math.sin(g.ph)*.15;
    ctx.save();ctx.shadowColor=g.chest?'#ff9d00':'#ffe14d';ctx.shadowBlur=22*pulse;
    if(g.chest){ctx.fillStyle='#7a4a00';ctx.fillRect(g.x-22,sy-16,44,34);ctx.fillStyle='#ffcf4d';ctx.fillRect(g.x-22,sy-16,44,8);ctx.strokeStyle='#3d2400';ctx.lineWidth=3;ctx.strokeRect(g.x-22,sy-16,44,34);}
    else{ctx.fillStyle=g.golden?'#ff9d00':'#ffe14d';ctx.beginPath();ctx.moveTo(g.x,sy-g.r*pulse);ctx.lineTo(g.x+g.r*.8*pulse,sy);ctx.lineTo(g.x,sy+g.r*pulse);ctx.lineTo(g.x-g.r*.8*pulse,sy);ctx.closePath();ctx.fill();}
    ctx.restore();}
  // lava pockets (ANGRY, red/orange, bubbling)
  for(const l of G.lavas){const sy=l.y-camY;if(sy<-60||sy>H+60)continue;
    const w=1+Math.sin(l.ph)*.12;
    const grd=ctx.createRadialGradient(l.x,sy,l.r*.2,l.x,sy,l.r);
    grd.addColorStop(0,'#ffdd55');grd.addColorStop(.5,'#ff7a00');grd.addColorStop(1,'#cc2200');
    ctx.fillStyle=grd;ctx.beginPath();ctx.ellipse(l.x,sy,l.r*w,l.r/w,0,0,7);ctx.fill();
    ctx.fillStyle='#ffdd55';for(let b=0;b<4;b++){const ba=l.ph+b*1.7,bx=l.x+Math.cos(ba)*l.r*.55,by=sy+Math.sin(ba*1.3)*l.r*.5;ctx.beginPath();ctx.arc(bx,by,3+Math.sin(ba*3),0,7);ctx.fill();}
    face(l.x,sy,l.r*.6,'angry');
    if(l.swim){ctx.strokeStyle='rgba(255,120,0,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(l.x,sy,l.r*1.25,G.t*2,G.t*2+4);ctx.stroke();}}
  // dirt crumbs where drilling
  if(input.dig&&G.mode==='play'){for(let i=0;i<2;i++)G.parts.push({x:mx+(Math.random()-.5)*40,y:wy+30,vx:(Math.random()-.5)*200,vy:Math.random()*200,life:.4,c:'#8a6a45'});}
  for(const p of G.parts){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y-camY,4,4);}
  ctx.globalAlpha=1;
  // mole hero + drill
  const squash=input.dig?1+Math.min(.3,G.drillSpeed/900):1;
  const heatC=['#4dd0ff','#ffb14d','#ff5252'][Math.min(2,Math.floor(G.heat*3))];
  ctx.save();ctx.translate(mx,cy);ctx.scale(2-squash,squash);
  // drill bit
  ctx.fillStyle=heatC;ctx.shadowColor=heatC;ctx.shadowBlur=G.heat*24;
  ctx.beginPath();ctx.moveTo(-10,18);ctx.lineTo(10,18);ctx.lineTo(0,44);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  // body
  ctx.fillStyle='#a06a3c';ctx.beginPath();ctx.arc(0,0,24,0,7);ctx.fill();
  ctx.fillStyle='#c08a52';ctx.beginPath();ctx.arc(0,-6,20,0,7);ctx.fill();
  // ears + nose
  ctx.fillStyle='#a06a3c';ctx.beginPath();ctx.arc(-16,-16,7,0,7);ctx.arc(16,-16,7,0,7);ctx.fill();
  ctx.fillStyle='#ff9ecf';ctx.beginPath();ctx.arc(0,8,5,0,7);ctx.fill();
  face(0,-4,22,input.dig?(G.heat>.6?'panic':'ok'):'ok');
  // hard hat
  ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.arc(0,-12,20,Math.PI,0);ctx.fill();
  ctx.fillRect(-4,-30,8,8);
  ctx.restore();
  // floating texts
  let ty=H*0.42;for(const t of G.texts){ctx.globalAlpha=Math.max(0,1-t.t);ctx.font='bold 26px Courier New';ctx.textAlign='center';
    ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.strokeText(t.txt,mx,ty);ctx.fillStyle=t.color;ctx.fillText(t.txt,mx,ty);ty+=34;}
  ctx.globalAlpha=1;
  if(G.mode==='menu'){ctx.fillStyle='rgba(0,0,0,.0)';}
}
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(G.mode==='play')update(dt);draw();requestAnimationFrame(loop);}
bind();requestAnimationFrame(loop);
</script>
