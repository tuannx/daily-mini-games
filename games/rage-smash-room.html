<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RAGE SMASH ROOM! — Day 50</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#170407; overflow:hidden; touch-action:none;
    font-family:'Trebuchet MS','Comic Sans MS',sans-serif; }

<body>
<div id="wrap"><canvas id="c" width="480" height="720"></canvas></div>
<script>
"use strict";
// RAGE SMASH ROOM! — Day 50
// A rage needle swings across the meter. TAP / SPACE when it hits the
// red-hot zone to smash the object on the table with a giant hammer.
// Perfect = shattering. Whiff = the object dodges and laughs at you.
// TWIST LADDER: 8s BOMBS! (do NOT smash — let the fuse die)
// -> 14s HELMETS! (armor eats a hit) -> 26s THEY DODGE! (objects hop
// your swing) -> 38s DRUNK NEEDLE! (needle wobbles + fake-pauses)
// -> 50s BOSS FRIDGE! (huge HP). Golden phone = rare glowing bonus.
// Trend: "So Mad Smash" (realhelper.club, Nov 16-17 2026, "I got so
// mad" meme, rage-needle timing) + rage-room wave: "Break It Down!"
// rage room sim (Nov 8-10 2026), "Rage Pit" (Product Hunt, Nov 10).
// Not a clone: new bomb-restraint + dodge + helmet twists, new cast.
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 480, H = 720;
const TABLE_Y = 452;         // top of the table the object sits on
const OBJ_X = 240, OBJ_Y = 452; // object base point (feet on table)
const METER_X = 56, METER_W = 368, METER_Y = 566, METER_H = 34;

// ---------- audio (WebAudio, self-generated) ----------
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(f, d, type, v){
  const ac = audio(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type||'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(v||0.12, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
}
function noiseBurst(dur, vol, freq){
  const ac = audio(); if(!ac) return;
  const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 1.6);
  const s = ac.createBufferSource(); s.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq||900;
  const g = ac.createGain(); g.gain.value = vol||0.2;
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
}
function swingSnd(){ noiseBurst(0.12, 0.10, 2400); }
function thudSnd(){ noiseBurst(0.16, 0.22, 500); beep(90, 0.16, 'sine', 0.16); }
function crackSnd(){ noiseBurst(0.10, 0.18, 1600); beep(320, 0.07, 'square', 0.07); }
function perfectSnd(){ [660,880,1320].forEach((f,i)=>setTimeout(()=>beep(f,0.10,'triangle',0.11), i*55)); noiseBurst(0.2, 0.2, 700); }
function boomSnd(){ noiseBurst(0.55, 0.34, 320); beep(55, 0.5, 'sine', 0.22); setTimeout(()=>beep(40, 0.4, 'sine', 0.16), 90); }
function laughSnd(){ [700,560,700,470].forEach((f,i)=>setTimeout(()=>beep(f,0.09,'square',0.07), i*85)); }
function defuseSnd(){ beep(520, 0.08, 'sine', 0.09); setTimeout(()=>beep(780, 0.1, 'sine', 0.09), 70); }
function goldSnd(){ [880,1175,1568,2093].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'triangle',0.11), i*70)); }

// ---------- helpers ----------
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const TAU = Math.PI*2;
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); }

// ---------- state ----------
let state = 'menu'; // menu | play | pause | over
let t = 0, score = 0, hearts = 3, combo = 0, bestCombo = 0, smashed = 0, escaped = 0;
let needlePhase = 0, needleD = 1, needleFrozen = 0, freezeT = 0;
let obj = null, spawnT = 0, objCount = 0, lastWasBomb = false, goldIn = 5, bossQueued = false;
let hammer = { anim: -1, dAtTap: 1 }; // anim: -1 idle, else 0..1 swing progress
let parts = [], popupsTxt = [], shake = 0;
let twistMsg = '', twistMsgT = 0, twistsDone = {};
let wallCracks = 0, plantLeaves = 3;
let high = +(localStorage.getItem('ragesmash_high')||0);
let unlock = localStorage.getItem('ragesmash_unlock')||'';
let copied = false, failLine = '', menuT = 0;
let keys = {};

const FAILS = [
  "You calmed down. Tragic.",
  "HR would like a word.",
  "The objects unionized. You lost.",
  "The bomb sends its regards.",
  "Objects: 1. You: 0.",
  "Anger management: failed successfully.",
  "The fridge saw everything.",
];
function rankFor(s){
  if(s>=3000) return "RAGE GOD";
  if(s>=2000) return "OFFICE MENACE";
  if(s>=1200) return "TABLE FLIPPER";
  if(s>=500) return "KEYBOARD WARRIOR";
  return "CALM INTERN";
}
function popup(x,y,txt,col,size){ popupsTxt.push({x,y,txt,life:1.05,col:col||'#fff',size:size||24}); }
function burst(x,y,col,n,spd){
  for(let i=0;i<(n||12);i++){
    const a = rand(0,TAU), s = rand(40,spd||180);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-90,life:rand(0.4,0.95),col,r:rand(2,5.5),grav:560,rot:rand(0,TAU),vr:rand(-9,9),sq:Math.random()<0.5});
  }
}
function addScore(base, x, y, label, col){
  const mult = 1 + Math.min(combo, 20) * 0.2;
  const pts = Math.round(base * mult);
  score += pts;
  if(label) popup(x, y, label.replace('{P}', pts), col||'#ffd60a', pts>=200 ? 28 : 22);
  return pts;
}

// ---------- objects ----------
// kind: clock melon phone toaster keyboard tv chair fridge gold bomb
const KINDS = {
  clock:    { hp:1, col:'#fbbf24', col2:'#b45309', label:'CLOCK' },
  melon:    { hp:1, col:'#22c55e', col2:'#14532d', label:'MELON' },
  phone:    { hp:2, col:'#38bdf8', col2:'#0c4a6e', label:'PHONE' },
  toaster:  { hp:2, col:'#e2e8f0', col2:'#64748b', label:'TOASTER' },
  keyboard: { hp:2, col:'#a78bfa', col2:'#4c1d95', label:'KEYBOARD' },
  tv:       { hp:3, col:'#94a3b8', col2:'#1e293b', label:'TV' },
  chair:    { hp:3, col:'#f97316', col2:'#7c2d12', label:'CHAIR' },
  fridge:   { hp:5, col:'#e7e5e4', col2:'#78716c', label:'FRIDGE' },
  gold:     { hp:1, col:'#ffd60a', col2:'#b45309', label:'GOLD!' },
  bomb:     { hp:99, col:'#26262e', col2:'#000000', label:'BOMB' },
};
const CYCLE = ['clock','melon','phone','toaster','keyboard','tv','chair','phone','melon','toaster'];
function needleSpeed(){
  let s = 2.1 + smashed * 0.14;
  if(twistsDone.drunk) s *= 1 + Math.sin(t*2.3) * 0.35; // drunk wobble
  return s;
}
function zoneHalf(){
  // perfect half-width in d units (d = 0 center .. 1 edge), shrinks slowly
  return { perfect: Math.max(0.085, 0.16 - smashed*0.006),
           good:    Math.max(0.24, 0.36 - smashed*0.008),
           ok:      0.62 };
}
function spawnObject(forceKind){
  objCount++;
  let kind = forceKind;
  if(!kind){
    if(objCount === goldIn){ kind = 'gold'; goldIn = objCount + Math.floor(rand(6,9)); }
    else if(t >= 8 && !lastWasBomb && Math.random() < 0.17){ kind = 'bomb'; }
    else kind = CYCLE[(objCount-1) % CYCLE.length];
  }
  lastWasBomb = (kind === 'bomb');
  const def = KINDS[kind];
  const hpBonus = (kind==='fridge') ? 0 : Math.floor(smashed/7);
  const isBoss = !!forceKind && kind==='fridge';
  obj = {
    kind, hp: def.hp + hpBonus, maxHp: def.hp + hpBonus,
    armor: (twistsDone.helmet && kind!=='bomb' && kind!=='gold' && Math.random()<0.75) ? 1 : 0,
    x: W + 90, tx: OBJ_X, baseY: OBJ_Y, hopX: 0, hopY: 0,
    mode: 'enter', // enter | idle | telegraph | hop | dying | leaving
    modeT: 0, dodgeT: rand(1.6, 3.2), face: 'smug', faceT: 0,
    squash: 0, shakeT: 0, flash: 0,
    patience: kind==='bomb' ? 2.6 : (kind==='gold' ? 3.4 : clamp(7.5 - smashed*0.16, 4.2, 7.5)),
    maxPatience: 0, scale: isBoss ? 1.35 : (kind==='fridge' ? 1.18 : 1),
    fuseSparks: 0,
  };
  obj.maxPatience = obj.patience;
  if(kind==='bomb') popup(OBJ_X, 210, "DON'T SMASH!", '#ff2d55', 30);
}
function objectGone(){
  obj = null; spawnT = 0.55;
}
function smashObject(dmg, perfect){
  const def = KINDS[obj.kind];
  obj.hp -= dmg;
  obj.squash = 1; obj.shakeT = 0.3; obj.flash = 0.12; obj.face = 'dizzy'; obj.faceT = 0.5;
  burst(obj.x, obj.baseY - 70*obj.scale, def.col, perfect ? 22 : 13, perfect ? 280 : 200);
  burst(obj.x, obj.baseY - 70*obj.scale, def.col2, 8, 160);
  if(obj.hp <= 0){
    smashed++;
    wallCracks = Math.min(9, wallCracks + 1);
    if(plantLeaves > 0 && Math.random() < 0.5) plantLeaves--;
    const base = obj.kind==='gold' ? (perfect ? 500 : 150) : (perfect ? 100 : 60);
    addScore(base, obj.x, obj.baseY - 150*obj.scale, perfect ? "PERFECT! +{P}" : "SMASHED! +{P}", perfect ? '#ffd60a' : '#7bff5e');
    if(obj.kind==='gold') goldSnd(); else if(perfect) perfectSnd(); else thudSnd();
    burst(obj.x, obj.baseY - 60*obj.scale, '#ffffff', 10, 220);
    shake = perfect ? 10 : 6;
    objectGone();
  } else {
    popup(obj.x, obj.baseY - 150*obj.scale, perfect ? "CRACKED!" : "DENTED!", '#fff', 22);
    crackSnd();
  }
}
function loseHeart(why){
  hearts--;
  shake = 13;
  popup(OBJ_X, 190, why, '#ff2d55', 28);
  if(hearts <= 0) endGame();
}
function swing(){
  if(state!=='play' || hammer.anim >= 0) return;
  hammer.anim = 0;
  hammer.dAtTap = needleD;
  swingSnd();
}
function resolveSwing(){
  const d = hammer.dAtTap;
  const z = zoneHalf();
  if(!obj || obj.mode==='dying' || obj.mode==='leaving'){ return; }
  // bomb: ANY swing that lands while a bomb is on the table = boom
  if(obj.kind === 'bomb'){
    boomSnd();
    burst(obj.x, obj.baseY - 60, '#f97316', 30, 340);
    burst(obj.x, obj.baseY - 60, '#26262e', 16, 260);
    combo = 0;
    objectGone();
    loseHeart("BOOM!");
    return;
  }
  // dodged: object is mid-hop -> hammer hits the table, automatic whiff
  if(obj.mode === 'hop'){
    thudSnd();
    burst(OBJ_X, TABLE_Y - 4, '#d6a05a', 8, 130);
    combo = 0;
    obj.face = 'laugh'; obj.faceT = 0.9;
    popup(obj.x + obj.hopX, obj.baseY - 150*obj.scale, "DODGED!", '#ff9f1c', 26);
    laughSnd();
    loseHeart("TOO SLOW!");
    return;
  }
  if(d <= z.perfect){
    // PERFECT
    combo++; if(combo>bestCombo) bestCombo = combo;
    if(obj.armor > 0 && obj.maxHp > 1){
      // perfect blows the helmet off AND deals damage
      obj.armor = 0;
      burst(obj.x, obj.baseY - 128*obj.scale, '#facc15', 10, 200);
      popup(obj.x, obj.baseY - 168*obj.scale, "HELMET OFF!", '#facc15', 22);
      smashObject(1, true);
    } else if(obj.armor > 0){
      obj.armor = 0;
      burst(obj.x, obj.baseY - 128*obj.scale, '#facc15', 12, 220);
      popup(obj.x, obj.baseY - 168*obj.scale, "HELMET OFF!", '#facc15', 22);
      crackSnd();
      obj.squash = 1; obj.shakeT = 0.3;
    } else {
      smashObject(2, true);
    }
    // near-miss is impossible on perfect; check SO CLOSE on good below
  } else if(d <= z.good){
    combo++; if(combo>bestCombo) bestCombo = combo;
    if(z.good - d < 0.055) popup(obj.x, obj.baseY - 185*obj.scale, "SO CLOSE!", '#7dd3fc', 20);
    if(obj.armor > 0){
      obj.armor = 0;
      burst(obj.x, obj.baseY - 128*obj.scale, '#facc15', 10, 200);
      popup(obj.x, obj.baseY - 168*obj.scale, "HELMET OFF!", '#facc15', 22);
      crackSnd();
      obj.squash = 0.8; obj.shakeT = 0.25;
    } else {
      smashObject(1, false);
    }
  } else if(d <= z.ok){
    // DENT — glancing blow, tiny points, combo survives, no damage
    addScore(10, obj.x, obj.baseY - 150*obj.scale, "DENT +{P}", '#e2e8f0');
    obj.squash = 0.55; obj.shakeT = 0.18; obj.face = 'panic'; obj.faceT = 0.4;
    crackSnd();
  } else {
    // WHIFF — hammer misses entirely, object laughs
    combo = 0;
    obj.face = 'laugh'; obj.faceT = 0.9;
    popup(obj.x, obj.baseY - 150*obj.scale, "WHIFF!", '#ff9f1c', 26);
    laughSnd();
    thudSnd();
    loseHeart("IT LAUGHED!");
  }
}

// ---------- twists ----------
function fireTwist(name, msg){
  if(twistsDone[name]) return; twistsDone[name] = true;
  twistMsg = msg; twistMsgT = 2.1;
  popup(W/2, 268, msg, '#ff9f1c', 32);
  beep(660, 0.1, 'square', 0.09); setTimeout(()=>beep(440, 0.12, 'square', 0.09), 90);
}

// ---------- update ----------
function update(dt){
  menuT += dt;
  if(state==='menu' || state==='pause') return;
  if(state==='over'){
    parts.forEach(p=>{ p.vy += (p.grav||0)*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt; p.life -= dt; });
    parts = parts.filter(p=>p.life>0);
    popupsTxt.forEach(p=>{ p.y -= 30*dt; p.life -= dt; });
    popupsTxt = popupsTxt.filter(p=>p.life>0);
    return;
  }
  t += dt;
  if(t>=8)  fireTwist('bombs', "BOMBS! DON'T!");
  if(t>=14) fireTwist('helmet', "HELMETS!");
  if(t>=26) fireTwist('dodge', "THEY DODGE!");
  if(t>=38) fireTwist('drunk', "DRUNK NEEDLE!");
  if(t>=50 && !twistsDone.boss){ fireTwist('boss', "BOSS FRIDGE!"); bossQueued = true; }

  // needle (drunk fake-pauses after 38s)
  if(twistsDone.drunk){
    freezeT -= dt;
    if(freezeT <= 0){ needleFrozen = Math.random() < 0.30 ? rand(0.16, 0.3) : 0; freezeT = rand(0.7, 1.6); }
  }
  if(needleFrozen > 0){ needleFrozen -= dt; }
  else { needlePhase += dt * needleSpeed(); }
  needleD = Math.abs(Math.sin(needlePhase)); // 0 = dead center, 1 = edge... remap below
  // sin gives 0..1..0; we want d=0 at center of swing: use cos so phase 0 = center
  needleD = Math.abs(Math.sin(needlePhase)); // distance from nearest center crossing
  // (needle x is drawn from sin(phase): center when sin=0)

  // hammer swing animation; resolve at impact (progress crosses 0.45)
  if(hammer.anim >= 0){
    const prev = hammer.anim;
    hammer.anim += dt / 0.26;
    if(prev < 0.45 && hammer.anim >= 0.45) resolveSwing();
    if(hammer.anim >= 1) hammer.anim = -1;
  }

  // spawning
  if(!obj){
    spawnT -= dt;
    if(spawnT <= 0){
      if(bossQueued){ bossQueued = false; spawnObject('fridge'); }
      else spawnObject();
    }
  }

  // object behaviour
  if(obj){
    const o = obj;
    o.modeT += dt;
    if(o.flash > 0) o.flash -= dt;
    if(o.squash > 0) o.squash = Math.max(0, o.squash - dt*4.5);
    if(o.shakeT > 0) o.shakeT -= dt;
    if(o.faceT > 0){ o.faceT -= dt; if(o.faceT <= 0) o.face = 'smug'; }
    if(o.mode === 'enter'){
      o.x += (o.tx - o.x) * Math.min(1, dt*7);
      if(Math.abs(o.tx - o.x) < 4){ o.x = o.tx; o.mode = 'idle'; o.modeT = 0; }
    } else if(o.mode === 'idle' || o.mode === 'telegraph' || o.mode === 'hop'){
      o.patience -= dt;
      // face: panic when the needle nears the red zone or patience is low
      if(o.faceT <= 0) o.face = (needleD < 0.30 || o.patience < 1.4) ? 'panic' : 'smug';
      // dodge behaviour (from 26s): telegraph crouch, then hop sideways
      if(twistsDone.dodge && o.kind !== 'bomb' && o.kind !== 'gold'){
        if(o.mode === 'idle'){
          o.dodgeT -= dt;
          if(o.dodgeT <= 0){ o.mode = 'telegraph'; o.modeT = 0; popup(o.x, o.baseY - 150*o.scale, "!", '#ff9f1c', 30); }
        } else if(o.mode === 'telegraph'){
          if(o.modeT >= 0.45){
            o.mode = 'hop'; o.modeT = 0;
            o.hopDir = (o.x + (Math.random()<0.5?-1:1) * 95 < 70 || o.x + 95 > W-70) ? (o.x > W/2 ? -1 : 1) : (Math.random()<0.5?-1:1);
          }
        } else if(o.mode === 'hop'){
          const hp = o.modeT / 0.38;
          o.hopX = Math.sin(Math.min(hp,1) * Math.PI) * 95 * o.hopDir;
          o.hopY = -Math.sin(Math.min(hp,1) * Math.PI) * 46;
          if(o.modeT >= 0.38){ o.mode = 'idle'; o.modeT = 0; o.x = clamp(o.x + 95*o.hopDir, 70, W-70); o.tx = o.x; o.hopX = 0; o.hopY = 0; o.dodgeT = rand(1.8, 3.4); }
        }
      }
      if(o.patience <= 0){
        if(o.kind === 'bomb'){
          // fuse died on its own — patience pays
          addScore(50, o.x, o.baseY - 150, "PATIENCE +{P}", '#7bff5e');
          defuseSnd();
          burst(o.x, o.baseY - 60, '#94a3b8', 8, 110);
          objectGone();
        } else {
          // it escapes, laughing
          escaped++;
          combo = 0;
          o.face = 'laugh';
          popup(o.x, o.baseY - 150*o.scale, "IT ESCAPED!", '#ff9f1c', 24);
          laughSnd();
          objectGone();
        }
      }
    }
    if(o && o.kind === 'bomb') o.fuseSparks += dt;
  }

  // particles / popups / shake
  parts.forEach(p=>{ p.vy += (p.grav||0)*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt; p.life -= dt; });
  parts = parts.filter(p=>p.life>0 && p.y < H+30);
  popupsTxt.forEach(p=>{ p.y -= 30*dt; p.life -= dt; });
  popupsTxt = popupsTxt.filter(p=>p.life>0);
  if(twistMsgT>0) twistMsgT -= dt;
  if(shake>0) shake = Math.max(0, shake - dt*30);
}
function endGame(){
  if(state !== 'play') return;
  state = 'over';
  failLine = FAILS[Math.floor(Math.random()*FAILS.length)];
  boomSnd();
  if(score > high){ high = score; localStorage.setItem('ragesmash_high', String(high)); }
  if(score >= 2000 && !unlock){ unlock = 'goldhammer'; localStorage.setItem('ragesmash_unlock', unlock); }
}
function resetGame(){
  t = 0; score = 0; hearts = 3; combo = 0; bestCombo = 0; smashed = 0; escaped = 0;
  needlePhase = 2.2; needleD = 1; needleFrozen = 0; freezeT = 1;
  obj = null; spawnT = 0.25; objCount = 0; lastWasBomb = false; goldIn = 6; bossQueued = false;
  hammer = { anim: -1, dAtTap: 1 };
  parts = []; popupsTxt = []; shake = 0;
  twistMsg = ''; twistMsgT = 0; twistsDone = {};
  wallCracks = 0; plantLeaves = 3;
  copied = false; failLine = '';
  state = 'play';
}

// ---------- drawing ----------
function drawFace(x, y, kind, s){
  ctx.fillStyle = '#1c0a0a';
  if(kind==='angry'){
    circle(x-8*s, y-3*s, 2.6*s); circle(x+8*s, y-3*s, 2.6*s);
    ctx.strokeStyle = '#1c0a0a'; ctx.lineWidth = 2.4*s;
    ctx.beginPath(); ctx.moveTo(x-12*s, y-10*s); ctx.lineTo(x-3*s, y-6*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+12*s, y-10*s); ctx.lineTo(x+3*s, y-6*s); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y+11*s, 5*s, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
  } else if(kind==='dizzy'){
    ctx.font = 'bold ' + Math.round(14*s) + 'px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('×', x-8*s, y-3*s); ctx.fillText('×', x+8*s, y-3*s);
    ctx.beginPath(); ctx.ellipse(x, y+7*s, 4*s, 5*s, 0, 0, TAU); ctx.fill();
  } else if(kind==='panic'){
    circle(x-8*s, y-4*s, 3.6*s); circle(x+8*s, y-4*s, 3.6*s);
    ctx.beginPath(); ctx.ellipse(x, y+7*s, 3.8*s, 5.2*s, 0, 0, TAU); ctx.fill();
    // sweat drops
    ctx.fillStyle = '#7dd3fc';
    circle(x-16*s, y-8*s, 2.6*s); circle(x+16*s, y-10*s, 2.2*s);

function drawCracks(cx, cy, w, h, frac, seed){
  if(frac <= 0.02) return;
  ctx.save(); ctx.strokeStyle = 'rgba(20,10,10,0.55)'; ctx.lineWidth = 2;
  const n = Math.floor(frac * 5);
  for(let i=0;i<n;i++){
    const a = (seed * (i+3) * 1.7) % TAU;
    const len = (0.25 + frac*0.55) * w * (0.5 + ((seed*(i+1)*7)%10)/14);
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a)*len, cy + Math.sin(a)*len*0.7);
    ctx.lineTo(cx + Math.cos(a)*len*1.5, cy + Math.sin(a+0.5)*len);
    ctx.stroke();
  }
  ctx.restore();
}

function drawMeter(){

  ctx.fillStyle = '#111118'; roundRect(METER_X-6, METER_Y-6, METER_W+12, METER_H+12, 10); ctx.fill();
  // zones from outside in: gray | yellow(ok) | green(good) | red(perfect)
  const seg = (d0, d1, col)=>{ ctx.fillStyle = col;
    ctx.fillRect(cx - px(d1), METER_Y, px(d1)-px(d0), METER_H);
    ctx.fillRect(cx + px(d0), METER_Y, px(d1)-px(d0), METER_H); };
  seg(z.ok, 1, '#3f3f46');
  seg(z.good, z.ok, '#eab308');
  seg(z.perfect, z.good, '#22c55e');
  ctx.fillStyle = '#ef4444'; ctx.fillRect(cx - px(z.perfect), METER_Y, px(z.perfect)*2, METER_H);
  ctx.fillStyle = '#fff'; ctx.fillRect(cx-1.5, METER_Y-3, 3, METER_H+6);
  // needle
  const nx = cx + Math.sin(needlePhase) * (METER_W/2);
  ctx.strokeStyle = needleFrozen > 0 ? '#f472b6' : '#ffffff'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(nx, METER_Y - 12); ctx.lineTo(nx, METER_Y + METER_H + 8); ctx.stroke();

  ctx.restore();

    ctx.fillText(score + '  •  ' + rankFor(score), W/2, 296);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Trebuchet MS';
    ctx.fillText('SMASHED ' + smashed + '   •   BEST COMBO x' + bestCombo + '   •   BEST ' + high, W/2, 334);
    if(unlock==='goldhammer'){ ctx.fillStyle = '#ffd60a'; ctx.fillText('🔨 GOLD HAMMER UNLOCKED!', W/2, 366); }
    ctx.fillStyle = copied ? '#7bff5e' : '#00d4ff';
    roundRect(W/2-120, 404, 240, 48, 12); ctx.fill();
    ctx.fillStyle = '#170407'; ctx.font = 'bold 19px Trebuchet MS';
    ctx.fillText(copied ? 'COPIED!' : '📋 COPY RESULT', W/2, 429);
    ctx.fillStyle = '#7b2ff7';
    roundRect(W/2-120, 468, 240, 52, 12); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Trebuchet MS';
    ctx.fillText('↻ RAGE AGAIN', W/2, 495);
    ctx.fillStyle = '#ffffff88'; ctx.font = 'bold 13px Trebuchet MS';
    ctx.fillText('tap R to restart', W/2, 544);
    ctx.restore();
  }
}

// ---------- input ----------
function posFromEvent(e){
  const r = cv.getBoundingClientRect();
  const sx = W / r.width, sy = H / r.height;
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return { x: (cx - r.left) * sx, y: (cy - r.top) * sy };
}
function shareText(){
  return "I smashed " + smashed + " things for " + score + " (" + rankFor(score) + ") in the RAGE SMASH ROOM before calming down. The bomb sends its regards. " + location.href;
}
cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  const p = posFromEvent(e);
  if(state==='menu'){ resetGame(); return; }
  if(state==='pause'){ state = 'play'; return; }
  if(state==='over'){
    if(p.y>=404 && p.y<=452 && Math.abs(p.x-W/2)<=120){
      const txt = shareText();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(()=>{ copied = true; }).catch(()=>{ copied = true; });
      } else { copied = true; }
      return;
    }
    if(p.y>=468 && p.y<=520 && Math.abs(p.x-W/2)<=120){ resetGame(); return; }
    return;
  }
  if(state==='play'){
    if(p.x > W-60 && p.y < 120 && p.y > 60){ state = 'pause'; return; }
    swing();
  }
});
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(k===' '){ e.preventDefault(); if(keys[k]) return; keys[k] = true;
    if(state==='menu'){ resetGame(); return; }
    if(state==='pause'){ state = 'play'; return; }
    if(state==='play') swing();
    return;
  }
  keys[k] = true;
  if(k==='p' && state==='play') state = 'pause';
  else if(k==='p' && state==='pause') state = 'play';
  if(k==='r' && state!=='menu') resetGame();
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && state==='play') state = 'pause'; });

// debug/testing handle (harmless in production)
window.__RSR = { get state(){ return state; }, get score(){ return score; },
  get smashed(){ return smashed; }, get hearts(){ return hearts; }, get t(){ return t; },
  needle: ()=>needleD, objKind: ()=> obj ? obj.kind : null, start: ()=>resetGame(), swing: ()=>swing() };

// ---------- loop ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now-last)/1000); last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
